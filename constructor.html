<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Смета | Конструктор</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fb;
            padding: 20px;
            color: #1a2a3a;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            margin-bottom: 24px;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1a5d2a;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .header p {
            color: #6c7a8a;
            font-size: 14px;
            margin-top: 4px;
        }
        
        .two-columns {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }
        
        .left-panel {
            flex: 1.2;
            min-width: 260px;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid #e8ecf0;
        }
        
        .right-panel {
            flex: 2;
            min-width: 320px;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid #e8ecf0;
        }
        
        .categories-title {
            font-size: 12px;
            text-transform: uppercase;
            color: #8a99a8;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }
        
        .category-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .category-btn {
            background: #f8f9fc;
            border: none;
            border-radius: 14px;
            padding: 14px 16px;
            text-align: left;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #2c3e50;
            border: 1px solid transparent;
        }
        
        .category-btn:hover {
            background: #eef2f7;
        }
        
        .category-btn.active {
            background: #e8f5e9;
            border-color: #2e7d32;
            color: #1a5d2a;
        }
        
        .category-icon {
            font-size: 20px;
        }
        
        .form-row {
            margin-bottom: 16px;
        }
        
        .form-row label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #5b6e8c;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        
        .form-row select, .form-row input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid #dce2e8;
            font-size: 15px;
            background: white;
            font-family: inherit;
        }
        
        .form-row select:focus, .form-row input:focus {
            outline: none;
            border-color: #2e7d32;
            box-shadow: 0 0 0 3px rgba(46,125,50,0.1);
        }
        
        .info-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        
        .info-field {
            flex: 1;
        }
        
        .price-preview {
            background: #f0fdf4;
            border-radius: 14px;
            padding: 16px;
            margin: 16px 0;
            text-align: center;
        }
        
        .price-preview .label {
            font-size: 12px;
            color: #2e7d32;
            text-transform: uppercase;
        }
        
        .price-preview .value {
            font-size: 28px;
            font-weight: 700;
            color: #1a5d2a;
        }
        
        .add-btn {
            width: 100%;
            background: #2e7d32;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        
        .add-btn:hover {
            background: #1b5e20;
        }
        
        .estimate-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        
        .estimate-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: #1a2a3a;
        }
        
        .estimate-total {
            font-size: 22px;
            font-weight: 700;
            color: #1a5d2a;
        }
        
        .table-wrapper {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid #e8ecf0;
            background: white;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        
        th {
            text-align: left;
            padding: 14px 12px;
            background: #f8fafc;
            font-weight: 600;
            color: #4a5a6a;
            border-bottom: 1px solid #e8ecf0;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #f0f2f5;
        }
        
        .delete-item {
            color: #e74c3c;
            cursor: pointer;
            font-size: 18px;
            background: none;
            border: none;
        }
        
        .empty-estimate {
            text-align: center;
            padding: 40px;
            color: #8a99a8;
        }
        
        .export-btn {
            background: white;
            border: 1px solid #2e7d32;
            color: #2e7d32;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 16px;
        }
        
        .refresh-btn {
            background: #eef2f7;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
        }
        
        .size-badge {
            display: inline-block;
            background: #eef2f7;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            color: #4a5a6a;
            margin-top: 8px;
        }
        
        @media (max-width: 700px) {
            body { padding: 16px; }
            .info-row { flex-direction: column; }
            .two-columns { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📋 Смета</h1>
        <p>Выберите категорию и позицию, укажите количество</p>
    </div>
    
    <div class="two-columns">
        <div class="left-panel">
            <div class="categories-title">КАТЕГОРИИ</div>
            <div class="category-list" id="categoryList">
                <div style="text-align:center; padding:20px;">Загрузка...</div>
            </div>
            <button class="refresh-btn" onclick="loadCatalog()" style="margin-top: 20px; width:100%;">🔄 Обновить</button>
        </div>
        
        <div class="right-panel">
            <div class="form-row">
                <label>📦 Что добавляем?</label>
                <select id="itemSelect">
                    <option>Сначала выберите категорию</option>
                </select>
            </div>
            
            <div id="sizeContainer" class="size-badge" style="display:none;"></div>
            
            <div class="info-row">
                <div class="info-field">
                    <label>📏 Ед. измерения</label>
                    <input type="text" id="unit" readonly placeholder="—">
                </div>
                <div class="info-field">
                    <label>💰 Цена за ед.</label>
                    <input type="text" id="price" readonly placeholder="—">
                </div>
            </div>
            
            <div class="form-row">
                <label>🔢 Количество</label>
                <input type="number" id="quantity" value="1" step="1">
            </div>
            
            <div class="price-preview">
                <div class="label">ИТОГО ЗА ПОЗИЦИЮ</div>
                <div class="value" id="rowTotal">0 ₽</div>
            </div>
            
            <button class="add-btn" onclick="addToEstimate()">➕ Добавить в смету</button>
        </div>
    </div>
    
    <div class="estimate-header">
        <h2>📋 Смета</h2>
        <div class="estimate-total" id="totalEstimate">0 ₽</div>
    </div>
    <div class="table-wrapper" id="estimateWrapper">
        <table id="estimateTable">
            <thead>
                <tr><th>Категория</th><th>Наименование</th><th>Размер</th><th>Ед.изм</th><th>Кол-во</th><th>Цена/ед</th><th>Итого</th><th></th></tr>
            </thead>
            <tbody id="estimateBody">
                <tr><td colspan="8" class="empty-estimate">Смета пуста. Добавьте позиции.</td></tr>
            </tbody>
        </table>
    </div>
    <button class="export-btn" onclick="exportEstimate()">📤 Экспорт в CSV</button>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzAHFuX6pg9l86XWs9jlJLbtguxdz-mFqD0EIW0QDU5LdYhHsKZH9kVaRY9WXZOhgejXA/exec";
    
    let catalog = { materials: [], works: [] };
    let allCategories = [];
    let currentCategory = null;
    let currentItems = [];
    let currentItem = null;
    let estimateItems = [];

    function loadCatalog() {
        const categoryDiv = document.getElementById('categoryList');
        categoryDiv.innerHTML = '<div style="text-align:center; padding:20px;">📡 Загрузка...</div>';
        
        const callbackName = 'jsonp_callback_' + Math.random().toString(36).substr(2);
        window[callbackName] = function(data) {
            delete window[callbackName];
            document.body.removeChild(script);
            catalog = data;
            
            const categoriesSet = new Set();
            catalog.materials.forEach(item => { if (item.group) categoriesSet.add(item.group); });
            catalog.works.forEach(item => { if (item.group) categoriesSet.add(item.group); });
            allCategories = Array.from(categoriesSet).sort();
            
            renderCategories();
            if (allCategories.length > 0) selectCategory(allCategories[0]);
        };
        
        const script = document.createElement('script');
        script.src = API_URL + '?callback=' + callbackName;
        script.onerror = () => {
            delete window[callbackName];
            document.body.removeChild(script);
            categoryDiv.innerHTML = '<div style="color:red; text-align:center;">❌ Ошибка загрузки</div>';
        };
        document.body.appendChild(script);
    }
    
    function renderCategories() {
        const container = document.getElementById('categoryList');
        container.innerHTML = '';
        allCategories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'category-btn';
            btn.innerHTML = `<span class="category-icon">${getIcon(cat)}</span><span>${cat}</span>`;
            btn.onclick = () => selectCategory(cat);
            container.appendChild(btn);
        });
    }
    
    function getIcon(category) {
        const icons = {
            'Материалы': '📦', 'Листовые материалы': '📄', 'Профиль металлический': '📐',
            'Профиль алюминиевый': '🥤', 'Нержавеющая сталь': '⚙️', 'Пленки': '🎨',
            'Светотехника': '💡', 'Обнарядка': '🎄', 'Работы': '🔧', 'Подряд': '📋',
            'Монтаж': '🚚', 'Транспорт': '🚛'
        };
        return icons[category] || '📁';
    }
    
    function selectCategory(category) {
        currentCategory = category;
        document.querySelectorAll('.category-btn').forEach(btn => {
            if (btn.innerText.includes(category)) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        
        currentItems = [];
        catalog.materials.forEach(item => { if (item.group === category) currentItems.push({ ...item, type: 'material' }); });
        catalog.works.forEach(item => { if (item.group === category) currentItems.push({ ...item, type: 'work' }); });
        
        const select = document.getElementById('itemSelect');
        select.innerHTML = '<option value="">Выберите позицию</option>';
        currentItems.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.name;
            opt.textContent = item.name;
            opt.dataset.unit = item.unit || '';
            opt.dataset.price = item.price || 0;
            opt.dataset.size = item.size || '';
            opt.dataset.notes = item.notes || '';
            select.appendChild(opt);
        });
        
        document.getElementById('unit').value = '';
        document.getElementById('price').value = '';
        document.getElementById('sizeContainer').style.display = 'none';
        document.getElementById('quantity').value = 1;
        document.getElementById('rowTotal').innerHTML = '0 ₽';
        currentItem = null;
    }
    
    function fillDetails() {
        const select = document.getElementById('itemSelect');
        const opt = select.options[select.selectedIndex];
        if (!opt || !opt.value) return;
        
        const selected = currentItems.find(item => item.name === opt.value);
        if (!selected) return;
        
        document.getElementById('unit').value = selected.unit || '—';
        document.getElementById('price').value = selected.price ? selected.price.toLocaleString('ru-RU') + ' ₽' : '—';
        
        // Показываем размер, если есть
        if (selected.size && selected.size !== '') {
            const sizeDiv = document.getElementById('sizeContainer');
            sizeDiv.innerHTML = '📏 ' + selected.size;
            sizeDiv.style.display = 'inline-block';
        } else {
            document.getElementById('sizeContainer').style.display = 'none';
        }
        
        currentItem = {
            category: currentCategory,
            name: selected.name,
            unit: selected.unit || '—',
            price: parseFloat(selected.price) || 0,
            size: selected.size || '',
            type: selected.type
        };
        calculateRowTotal();
    }
    
    function calculateRowTotal() {
        const price = currentItem ? currentItem.price : 0;
        const qty = parseFloat(document.getElementById('quantity').value) || 0;
        const total = price * qty;
        document.getElementById('rowTotal').innerHTML = total.toFixed(2).replace('.', ',') + ' ₽';
        return total;
    }
    
    function addToEstimate() {
        const qty = parseFloat(document.getElementById('quantity').value) || 0;
        if (!currentItem || !currentItem.name || qty === 0) {
            alert('Выберите позицию и укажите количество');
            return;
        }
        
        estimateItems.push({
            category: currentItem.category,
            name: currentItem.name,
            size: currentItem.size || '',
            unit: currentItem.unit,
            quantity: qty,
            price: currentItem.price,
            total: currentItem.price * qty
        });
        
        renderEstimate();
        document.getElementById('quantity').value = 1;
        calculateRowTotal();
    }
    
    function renderEstimate() {
        const tbody = document.getElementById('estimateBody');
        tbody.innerHTML = '';
        let grand = 0;
        
        if (estimateItems.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="empty-estimate">Смета пуста. Добавьте позиции.</td></tr>';
            document.getElementById('totalEstimate').innerHTML = '0 ₽';
            return;
        }
        
        estimateItems.forEach((item, idx) => {
            grand += item.total;
            const row = tbody.insertRow();
            row.insertCell(0).innerHTML = item.category;
            row.insertCell(1).innerHTML = item.name;
            row.insertCell(2).innerHTML = item.size || '—';
            row.insertCell(3).innerHTML = item.unit;
            row.insertCell(4).innerHTML = item.quantity;
            row.insertCell(5).innerHTML = item.price.toFixed(2).replace('.', ',') + ' ₽';
            row.insertCell(6).innerHTML = item.total.toFixed(2).replace('.', ',') + ' ₽';
            const delCell = row.insertCell(7);
            const delBtn = document.createElement('button');
            delBtn.innerHTML = '🗑️';
            delBtn.className = 'delete-item';
            delBtn.onclick = () => { estimateItems.splice(idx, 1); renderEstimate(); };
            delCell.appendChild(delBtn);
        });
        
        document.getElementById('totalEstimate').innerHTML = grand.toFixed(2).replace('.', ',') + ' ₽';
        localStorage.setItem('estimate', JSON.stringify(estimateItems));
    }
    
    function exportEstimate() {
        if (estimateItems.length === 0) { alert('Смета пуста'); return; }
        let csv = "Категория,Наименование,Размер,Ед.изм,Кол-во,Цена/ед,Итого\n";
        estimateItems.forEach(i => {
            csv += `"${i.category}","${i.name}","${i.size || ''}","${i.unit}",${i.quantity},${i.price.toFixed(2)},${i.total.toFixed(2)}\n`;
        });
        const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `smeta_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.csv`;
        link.click();
        URL.revokeObjectURL(link.href);
    }
    
    document.getElementById('itemSelect').addEventListener('change', fillDetails);
    document.getElementById('quantity').addEventListener('input', calculateRowTotal);
    
    const saved = localStorage.getItem('estimate');
    if (saved) { try { estimateItems = JSON.parse(saved); renderEstimate(); } catch(e) {} }
    
    loadCatalog();
</script>
</body>
</html>
