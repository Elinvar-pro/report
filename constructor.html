<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Смета | Конструктор</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fb;
            padding: 20px;
            color: #1a2a3a;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            margin-bottom: 24px;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1a5d2a;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .header p {
            color: #6c7a8a;
            font-size: 14px;
            margin-top: 4px;
        }
        
        .two-columns {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }
        
        .left-panel {
            flex: 1.2;
            min-width: 260px;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid #e8ecf0;
        }
        
        .right-panel {
            flex: 2;
            min-width: 320px;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid #e8ecf0;
        }
        
        .categories-title {
            font-size: 12px;
            text-transform: uppercase;
            color: #8a99a8;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            margin-top: 16px;
        }
        
        .categories-title:first-of-type {
            margin-top: 0;
        }
        
        .category-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 20px;
        }
        
        .category-btn {
            background: #f8f9fc;
            border: none;
            border-radius: 14px;
            padding: 12px 16px;
            text-align: left;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #2c3e50;
            border: 1px solid transparent;
        }
        
        .category-btn:hover {
            background: #eef2f7;
        }
        
        .category-btn.active {
            background: #e8f5e9;
            border-color: #2e7d32;
            color: #1a5d2a;
        }
        
        .category-icon {
            font-size: 18px;
        }
        
        .separator {
            height: 1px;
            background: #e8ecf0;
            margin: 16px 0;
        }
        
        .form-row {
            margin-bottom: 16px;
        }
        
        .form-row label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #5b6e8c;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        
        .form-row select, .form-row input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid #dce2e8;
            font-size: 15px;
            background: white;
            font-family: inherit;
        }
        
        .selected-info {
            background: #f8f9fc;
            border-radius: 16px;
            padding: 16px;
            margin: 16px 0;
        }
        
        .info-line {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e8ecf0;
        }
        
        .info-line:last-child {
            border-bottom: none;
        }
        
        .info-label {
            color: #6c7a8a;
            font-size: 13px;
        }
        
        .info-value {
            font-weight: 600;
            color: #1a2a3a;
            font-size: 15px;
        }
        
        .price-preview {
            background: #f0fdf4;
            border-radius: 14px;
            padding: 16px;
            margin: 16px 0;
            text-align: center;
        }
        
        .price-preview .label {
            font-size: 12px;
            color: #2e7d32;
            text-transform: uppercase;
        }
        
        .price-preview .value {
            font-size: 28px;
            font-weight: 700;
            color: #1a5d2a;
        }
        
        .add-btn {
            width: 100%;
            background: #2e7d32;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        
        .add-btn:hover {
            background: #1b5e20;
        }
        
        .estimate-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        
        .estimate-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: #1a2a3a;
        }
        
        .estimate-total {
            font-size: 22px;
            font-weight: 700;
            color: #1a5d2a;
        }
        
        .table-wrapper {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid #e8ecf0;
            background: white;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        
        th {
            text-align: left;
            padding: 14px 12px;
            background: #f8fafc;
            font-weight: 600;
            color: #4a5a6a;
            border-bottom: 1px solid #e8ecf0;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #f0f2f5;
        }
        
        .delete-item {
            color: #e74c3c;
            cursor: pointer;
            font-size: 18px;
            background: none;
            border: none;
        }
        
        .empty-estimate {
            text-align: center;
            padding: 40px;
            color: #8a99a8;
        }
        
        .export-btn {
            background: white;
            border: 1px solid #2e7d32;
            color: #2e7d32;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 16px;
        }
        
        .refresh-btn {
            background: #eef2f7;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            margin-top: 16px;
            width: 100%;
        }
        
        @media (max-width: 700px) {
            body { padding: 16px; }
            .two-columns { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📋 Смета</h1>
        <p>Выберите категорию → выберите позицию → укажите количество</p>
    </div>
    
    <div class="two-columns">
        <div class="left-panel">
            <div style="margin-bottom: 16px;">
                <div class="categories-title">📦 МАТЕРИАЛЫ</div>
                <div class="category-list" id="materialsList">
                    <div style="text-align:center; padding:20px;">Загрузка...</div>
                </div>
            </div>
            
            <div class="separator"></div>
            
            <div>
                <div class="categories-title">🔧 РАБОТЫ И УСЛУГИ</div>
                <div class="category-list" id="worksList">
                    <div style="text-align:center; padding:20px;">Загрузка...</div>
                </div>
            </div>
            
            <button class="refresh-btn" onclick="loadCatalog()">🔄 Обновить</button>
        </div>
        
        <div class="right-panel">
            <div class="form-row">
                <label>📦 Позиция</label>
                <select id="itemSelect">
                    <option>Сначала выберите категорию</option>
                </select>
            </div>
            
            <div id="infoPanel" style="display:none;" class="selected-info">
                <div class="info-line">
                    <span class="info-label">📏 Размер</span>
                    <span class="info-value" id="sizeValue">—</span>
                </div>
                <div class="info-line">
                    <span class="info-label">📐 Ед. измерения</span>
                    <span class="info-value" id="unitValue">—</span>
                </div>
                <div class="info-line">
                    <span class="info-label">💰 Цена за единицу</span>
                    <span class="info-value" id="priceValue">—</span>
                </div>
            </div>
            
            <div class="form-row">
                <label>🔢 Количество</label>
                <input type="number" id="quantity" value="1" step="1">
            </div>
            
            <div class="price-preview">
                <div class="label">ИТОГО ЗА ПОЗИЦИЮ</div>
                <div class="value" id="rowTotal">0 ₽</div>
            </div>
            
            <button class="add-btn" onclick="addToEstimate()">➕ Добавить в смету</button>
        </div>
    </div>
    
    <div class="estimate-header">
        <h2>📋 Смета</h2>
        <div class="estimate-total" id="totalEstimate">0 ₽</div>
    </div>
    <div class="table-wrapper">
        <table>
            <thead>
                <tr><th>Категория</th><th>Наименование</th><th>Размер</th><th>Ед.изм</th><th>Кол-во</th><th>Цена/ед</th><th>Итого</th><th></th></tr>
            </thead>
            <tbody id="estimateBody">
                <tr><td colspan="8" class="empty-estimate">Смета пуста. Добавьте позиции.</td></tr>
            </tbody>
        </table>
    </div>
    <button class="export-btn" onclick="exportEstimate()">📤 Экспорт в CSV</button>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxhR6KETtE_Qh5P7fJdX4DqtWaup0fxduXIOCkglA0guCGmfnXWCN4152ake19J92O6_w/exec";
    
    let catalog = { materials: [], works: [] };
    let materialCategories = [];
    let workCategories = [];
    
    let currentType = null;      // 'material' или 'work'
    let currentCategory = null;
    let currentItems = [];
    let currentItem = null;
    let estimateItems = [];

    function loadCatalog() {
        const materialsDiv = document.getElementById('materialsList');
        const worksDiv = document.getElementById('worksList');
        materialsDiv.innerHTML = '<div style="text-align:center; padding:20px;">📡 Загрузка...</div>';
        worksDiv.innerHTML = '<div style="text-align:center; padding:20px;">📡 Загрузка...</div>';
        
        const callbackName = 'jsonp_callback_' + Math.random().toString(36).substr(2);
        window[callbackName] = function(data) {
            delete window[callbackName];
            document.body.removeChild(script);
            catalog = data;
            
            // Собираем категории материалов (из Листа1)
            const matSet = new Set();
            catalog.materials.forEach(item => { if (item.group) matSet.add(item.group); });
            materialCategories = Array.from(matSet).sort();
            
            // Собираем категории работ (из Листа2)
            const workSet = new Set();
            catalog.works.forEach(item => { if (item.group) workSet.add(item.group); });
            workCategories = Array.from(workSet).sort();
            
            renderCategories();
        };
        
        const script = document.createElement('script');
        script.src = API_URL + '?callback=' + callbackName;
        script.onerror = () => {
            delete window[callbackName];
            document.body.removeChild(script);
            materialsDiv.innerHTML = '<div style="color:red; text-align:center;">❌ Ошибка загрузки</div>';
            worksDiv.innerHTML = '<div style="color:red; text-align:center;">❌ Ошибка загрузки</div>';
        };
        document.body.appendChild(script);
    }
    
    function renderCategories() {
        // Материалы
        const materialsDiv = document.getElementById('materialsList');
        materialsDiv.innerHTML = '';
        if (materialCategories.length === 0) {
            materialsDiv.innerHTML = '<div style="color:#8a99a8; text-align:center; padding:20px;">Нет данных</div>';
        } else {
            materialCategories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'category-btn';
                btn.innerHTML = `<span class="category-icon">${getIcon(cat)}</span><span>${cat}</span>`;
                btn.onclick = () => selectCategory('material', cat);
                materialsDiv.appendChild(btn);
            });
        }
        
        // Работы и услуги
        const worksDiv = document.getElementById('worksList');
        worksDiv.innerHTML = '';
        if (workCategories.length === 0) {
            worksDiv.innerHTML = '<div style="color:#8a99a8; text-align:center; padding:20px;">Нет данных</div>';
        } else {
            workCategories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'category-btn';
                btn.innerHTML = `<span class="category-icon">${getIcon(cat)}</span><span>${cat}</span>`;
                btn.onclick = () => selectCategory('work', cat);
                worksDiv.appendChild(btn);
            });
        }
        
        // Снимаем активность со всех кнопок
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        
        // Сбрасываем выбор
        currentType = null;
        currentCategory = null;
        currentItems = [];
        const select = document.getElementById('itemSelect');
        select.innerHTML = '<option value="">Сначала выберите категорию</option>';
        document.getElementById('infoPanel').style.display = 'none';
        document.getElementById('quantity').value = 1;
        document.getElementById('rowTotal').innerHTML = '0 ₽';
        currentItem = null;
    }
    
    function getIcon(category) {
        const icons = {
            'Материалы': '📦', 'Листовые материалы': '📄', 'Профиль металлический': '📐',
            'Профиль алюминиевый': '🥤', 'Нержавеющая сталь': '⚙️', 'Пленки': '🎨',
            'Светотехника': '💡', 'Обнарядка': '🎄', 'Работы': '🔧', 'Подряд': '📋',
            'Монтаж': '🚚', 'Транспорт': '🚛'
        };
        return icons[category] || '📁';
    }
    
    function selectCategory(type, category) {
        currentType = type;
        currentCategory = category;
        
        // Снимаем активность со всех кнопок
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        
        // Подсвечиваем активную кнопку
        const btns = document.querySelectorAll('.category-btn');
        for (let btn of btns) {
            if (btn.innerText.includes(category)) {
                btn.classList.add('active');
                break;
            }
        }
        
        // Собираем позиции
        currentItems = [];
        if (type === 'material') {
            catalog.materials.forEach(item => {
                if (item.group === category) {
                    currentItems.push({ ...item, itemType: 'material' });
                }
            });
        } else {
            catalog.works.forEach(item => {
                if (item.group === category) {
                    currentItems.push({ ...item, itemType: 'work' });
                }
            });
        }
        
        // Заполняем выпадающий список
        const select = document.getElementById('itemSelect');
        select.innerHTML = '<option value="">Выберите позицию</option>';
        currentItems.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.name;
            opt.textContent = item.name;
            opt.dataset.unit = item.unit || '';
            opt.dataset.price = item.price || 0;
            opt.dataset.size = item.size || '';
            opt.dataset.type = item.itemType;
            select.appendChild(opt);
        });
        
        // Сбрасываем форму
        document.getElementById('infoPanel').style.display = 'none';
        document.getElementById('sizeValue').innerHTML = '—';
        document.getElementById('unitValue').innerHTML = '—';
        document.getElementById('priceValue').innerHTML = '—';
        document.getElementById('quantity').value = 1;
        document.getElementById('rowTotal').innerHTML = '0 ₽';
        currentItem = null;
    }
    
    function fillDetails() {
        const select = document.getElementById('itemSelect');
        const opt = select.options[select.selectedIndex];
        if (!opt || !opt.value) return;
        
        const selected = currentItems.find(item => item.name === opt.value);
        if (!selected) return;
        
        // Показываем панель с информацией
        document.getElementById('infoPanel').style.display = 'block';
        document.getElementById('sizeValue').innerHTML = selected.size && selected.size !== '' ? selected.size : '—';
        document.getElementById('unitValue').innerHTML = selected.unit || '—';
        document.getElementById('priceValue').innerHTML = selected.price ? selected.price.toLocaleString('ru-RU') + ' ₽' : '—';
        
        currentItem = {
            type: currentType === 'material' ? 'Материал' : 'Работа',
            category: currentCategory,
            name: selected.name,
            unit: selected.unit || '—',
            price: parseFloat(selected.price) || 0,
            size: selected.size || '',
            itemType: selected.itemType
        };
        calculateRowTotal();
    }
    
    function calculateRowTotal() {
        const price = currentItem ? currentItem.price : 0;
        const qty = parseFloat(document.getElementById('quantity').value) || 0;
        const total = price * qty;
        document.getElementById('rowTotal').innerHTML = total.toFixed(2).replace('.', ',') + ' ₽';
        return total;
    }
    
    function addToEstimate() {
        const qty = parseFloat(document.getElementById('quantity').value) || 0;
        if (!currentItem || !currentItem.name || qty === 0) {
            alert('Выберите позицию и укажите количество');
            return;
        }
        
        estimateItems.push({
            type: currentItem.type,
            category: currentItem.category,
            name: currentItem.name,
            size: currentItem.size || '',
            unit: currentItem.unit,
            quantity: qty,
            price: currentItem.price,
            total: currentItem.price * qty
        });
        
        renderEstimate();
        document.getElementById('quantity').value = 1;
        calculateRowTotal();
    }
    
    function renderEstimate() {
        const tbody = document.getElementById('estimateBody');
        tbody.innerHTML = '';
        let grand = 0;
        
        if (estimateItems.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="empty-estimate">Смета пуста. Добавьте позиции.</td></tr>';
            document.getElementById('totalEstimate').innerHTML = '0 ₽';
            return;
        }
        
        estimateItems.forEach((item, idx) => {
            grand += item.total;
            const row = tbody.insertRow();
            row.insertCell(0).innerHTML = item.type;
            row.insertCell(1).innerHTML = item.category;
            row.insertCell(2).innerHTML = item.name;
            row.insertCell(3).innerHTML = item.size || '—';
            row.insertCell(4).innerHTML = item.unit;
            row.insertCell(5).innerHTML = item.quantity;
            row.insertCell(6).innerHTML = item.price.toFixed(2).replace('.', ',') + ' ₽';
            row.insertCell(7).innerHTML = item.total.toFixed(2).replace('.', ',') + ' ₽';
            const delCell = row.insertCell(8);
            const delBtn = document.createElement('button');
            delBtn.innerHTML = '🗑️';
            delBtn.className = 'delete-item';
            delBtn.onclick = () => { estimateItems.splice(idx, 1); renderEstimate(); };
            delCell.appendChild(delBtn);
        });
        
        document.getElementById('totalEstimate').innerHTML = grand.toFixed(2).replace('.', ',') + ' ₽';
        localStorage.setItem('estimate', JSON.stringify(estimateItems));
    }
    
    function exportEstimate() {
        if (estimateItems.length === 0) { alert('Смета пуста'); return; }
        let csv = "Тип,Категория,Наименование,Размер,Ед.изм,Кол-во,Цена/ед,Итого\n";
        estimateItems.forEach(i => {
            csv += `"${i.type}","${i.category}","${i.name}","${i.size || ''}","${i.unit}",${i.quantity},${i.price.toFixed(2)},${i.total.toFixed(2)}\n`;
        });
        const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `smeta_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.csv`;
        link.click();
        URL.revokeObjectURL(link.href);
    }
    
    document.getElementById('itemSelect').addEventListener('change', fillDetails);
    document.getElementById('quantity').addEventListener('input', calculateRowTotal);
    
    const saved = localStorage.getItem('estimate');
    if (saved) { try { estimateItems = JSON.parse(saved); renderEstimate(); } catch(e) {} }
    
    loadCatalog();
</script>
</body>
</html>
