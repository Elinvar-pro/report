<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Смета | Конструктор</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fb; padding: 20px; color: #1a2a3a; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { margin-bottom: 24px; }
        .header h1 { font-size: 24px; font-weight: 600; color: #1a5d2a; display: flex; align-items: center; gap: 8px; }
        .header p { color: #6c7a8a; font-size: 14px; margin-top: 4px; }
        
        .two-columns { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 32px; }
        .left-panel { flex: 1.2; min-width: 260px; background: white; border-radius: 20px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #e8ecf0; }
        .right-panel { flex: 2; min-width: 320px; background: white; border-radius: 20px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #e8ecf0; }
        
        .categories-title { font-size: 12px; text-transform: uppercase; color: #8a99a8; letter-spacing: 0.5px; margin-bottom: 12px; margin-top: 16px; }
        .categories-title:first-of-type { margin-top: 0; }
        .category-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; max-height: 350px; overflow-y: auto; }
        .category-btn { background: #f8f9fc; border: none; border-radius: 14px; padding: 12px 16px; text-align: left; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 10px; color: #2c3e50; border: 1px solid transparent; }
        .category-btn:hover { background: #eef2f7; }
        .category-btn.active { background: #e8f5e9; border-color: #2e7d32; color: #1a5d2a; }
        .category-icon { font-size: 18px; }
        .separator { height: 1px; background: #e8ecf0; margin: 16px 0; }
        
        .form-row { margin-bottom: 16px; }
        .form-row label { display: block; font-size: 12px; font-weight: 600; color: #5b6e8c; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.3px; }
        .form-row select, .form-row input { width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid #dce2e8; font-size: 15px; background: white; font-family: inherit; }
        
        .selected-info { background: #f8f9fc; border-radius: 16px; padding: 16px; margin: 16px 0; }
        .info-line { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #e8ecf0; }
        .info-line:last-child { border-bottom: none; }
        .info-label { color: #6c7a8a; font-size: 13px; }
        .info-value { font-weight: 600; color: #1a2a3a; font-size: 15px; }
        
        .calc-card { background: #f8f9fc; border-radius: 16px; padding: 16px; margin: 16px 0; }
        .parsed-info { background: #e8f5e9; border-radius: 12px; padding: 12px; margin-bottom: 16px; text-align: center; }
        .parsed-info .value { font-weight: 700; color: #1a5d2a; font-size: 16px; }
        .size-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
        .size-field { flex: 1; min-width: 100px; }
        .size-field label { font-size: 11px; color: #6c7a8a; margin-bottom: 4px; display: block; }
        .size-field input { width: 100%; padding: 10px; border-radius: 12px; border: 1px solid #dce2e8; font-size: 14px; }
        .calc-result { font-size: 13px; color: #2e7d32; text-align: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid #e0e4e8; }
        
        .price-preview { background: #f0fdf4; border-radius: 14px; padding: 16px; margin: 16px 0; text-align: center; }
        .price-preview .label { font-size: 12px; color: #2e7d32; text-transform: uppercase; }
        .price-preview .value { font-size: 28px; font-weight: 700; color: #1a5d2a; }
        
        .add-btn { width: 100%; background: #2e7d32; color: white; border: none; padding: 14px; border-radius: 40px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: background 0.2s; }
        .add-btn:hover { background: #1b5e20; }
        
        .estimate-header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; margin-bottom: 16px; }
        .estimate-header h2 { font-size: 18px; font-weight: 600; color: #1a2a3a; }
        .estimate-total { font-size: 22px; font-weight: 700; color: #1a5d2a; }
        
        .table-wrapper { overflow-x: auto; border-radius: 16px; border: 1px solid #e8ecf0; background: white; max-height: 400px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 12px 10px; background: #f8fafc; font-weight: 600; color: #1a5d2a; border-bottom: 2px solid #e8ecf0; position: sticky; top: 0; }
        td { padding: 10px; border-bottom: 1px solid #f0f2f5; }
        .even-row { background-color: #f8f9fc; }
        .odd-row { background-color: #ffffff; }
        .total-row td { background: #fef6e0; font-weight: 700; border-top: 1px solid #e8ecf0; }
        .delete-item { color: #e74c3c; cursor: pointer; font-size: 18px; background: none; border: none; }
        .empty-estimate { text-align: center; padding: 40px; color: #8a99a8; }
        
        .export-buttons { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
        .export-btn { background: white; border: 1px solid #2e7d32; color: #2e7d32; padding: 10px 20px; border-radius: 40px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .export-btn:hover { background: #e8f5e9; }
        .refresh-btn { background: #eef2f7; border: none; padding: 8px 16px; border-radius: 30px; font-size: 13px; cursor: pointer; margin-top: 16px; width: 100%; }
        
        @media (max-width: 700px) {
            body { padding: 16px; }
            .two-columns { flex-direction: column; }
            .size-row { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📋 Смета</h1>
        <p>Выберите категорию → выберите позицию → укажите параметры</p>
    </div>
    
    <div class="two-columns">
        <div class="left-panel">
            <div><div class="categories-title">📦 МАТЕРИАЛЫ</div><div class="category-list" id="materialsList"><div style="text-align:center; padding:20px;">Загрузка...</div></div></div>
            <div class="separator"></div>
            <div><div class="categories-title">🔧 РАБОТЫ И УСЛУГИ</div><div class="category-list" id="worksList"><div style="text-align:center; padding:20px;">Загрузка...</div></div></div>
            <button class="refresh-btn" onclick="loadCatalog()">🔄 Обновить</button>
        </div>
        
        <div class="right-panel">
            <div class="form-row">
                <label>📦 Позиция</label>
                <select id="itemSelect"><option>Сначала выберите категорию</option></select>
            </div>
            
            <div id="infoPanel" style="display:none;" class="selected-info">
                <div class="info-line"><span class="info-label">📏 Размер из таблицы</span><span class="info-value" id="sizeValue">—</span></div>
                <div class="info-line"><span class="info-label">📐 Ед. измерения</span><span class="info-value" id="unitValue">—</span></div>
                <div class="info-line"><span class="info-label">💰 Цена за ед.</span><span class="info-value" id="priceValue">—</span></div>
            </div>
            
            <div id="calcCard" class="calc-card" style="display:none;"></div>
            
            <div class="price-preview">
                <div class="label">ИТОГО ЗА ПОЗИЦИЮ</div>
                <div class="value" id="rowTotal">0 ₽</div>
            </div>
            
            <button class="add-btn" onclick="addToEstimate()">➕ Добавить в смету</button>
        </div>
    </div>
    
    <div class="estimate-header">
        <h2>📋 Смета</h2>
        <div class="estimate-total" id="totalEstimate">0 ₽</div>
    </div>
    <div class="table-wrapper">
        <table>
            <thead>
                <tr><th>Тип</th><th>Категория</th><th>Наименование</th><th>Расчёт</th><th>Ед.изм</th><th>Кол-во</th><th>Цена/ед</th><th>Итого</th><th></th></tr>
            </thead>
            <tbody id="estimateBody">
                <tr><td colspan="9" class="empty-estimate">Смета пуста. Добавьте позиции.缓解</td>
            </tbody>
        </table>
    </div>
    <div class="export-buttons">
        <button class="export-btn" onclick="exportToExcel()">📎 Экспорт в Excel</button>
        <button class="export-btn" onclick="copyEstimate()">📋 Копировать таблицу</button>
        <button class="export-btn" onclick="clearEstimate()">🗑️ Очистить смету</button>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxqcZfgZ9cyIAnY3u_P0XD5Nv7ZpD4IohzltLtFDOjVhbgeagNgDp0mN0MeHP9dBkm-/exec";
    
    let catalog = { materials: [], works: [] };
    let materialCategories = [], workCategories = [];
    let currentType = null, currentCategory = null, currentItems = [], currentItem = null;
    let estimateItems = [];
    
    function getCalcType(unit) {
        const u = (unit || '').toLowerCase();
        if (u.includes('м²') || u.includes('м.кв') || u.includes('кв.м')) return 'area';
        if (u.includes('м.п') || u === 'м' || u.includes('пог.м')) return 'length';
        return 'piece';
    }
    
    function parseSize(sizeStr, calcType) {
        if (!sizeStr || sizeStr === '') return null;
        const str = String(sizeStr).trim();
        
        if (calcType === 'area') {
            let match = str.match(/(\d+)[хxX×](\d+)/);
            if (match) {
                return { type: 'area', width_m: parseFloat(match[1]) / 1000, height_m: parseFloat(match[2]) / 1000, original: str };
            }
        }
        
        if (calcType === 'length') {
            let match = str.match(/(\d+)\s*мм/i);
            if (match) return { type: 'length', length_m: parseFloat(match[1]) / 1000, original: str };
            match = str.match(/(\d+[.,]?\d*)\s*м/i);
            if (match) return { type: 'length', length_m: parseFloat(match[1].replace(',', '.')), original: str };
        }
        
        return null;
    }
    
    function buildCalcInterface() {
        const calcCard = document.getElementById('calcCard');
        if (!currentItem) return;
        
        const calcType = getCalcType(currentItem.unit);
        const parsedSize = parseSize(currentItem.size, calcType);
        
        let html = '';
        
        if (calcType === 'area') {
            if (parsedSize) {
                const areaOne = parsedSize.width_m * parsedSize.height_m;
                html = `
                    <div class="parsed-info">
                        📐 Размер из таблицы: <span class="value">${parsedSize.original}</span><br>
                        → ${parsedSize.width_m.toFixed(2)}м × ${parsedSize.height_m.toFixed(2)}м = <span class="value">${areaOne.toFixed(2)} м²</span>
                    </div>
                    <div class="form-row">
                        <label>🔢 Количество (шт)</label>
                        <input type="number" id="areaQty" value="1" step="1" min="1">
                    </div>
                    <div class="calc-result" id="calcResult"></div>
                `;
            } else {
                html = `
                    <div class="form-row"><label>📐 Введите размеры</label></div>
                    <div class="size-row">
                        <div class="size-field"><label>Ширина (м)</label><input type="number" id="areaWidth" value="1" step="0.01" placeholder="м"></div>
                        <div class="size-field"><label>Высота (м)</label><input type="number" id="areaHeight" value="1" step="0.01" placeholder="м"></div>
                        <div class="size-field"><label>Количество (шт)</label><input type="number" id="areaCount" value="1" step="1" placeholder="шт"></div>
                    </div>
                    <div class="calc-result" id="calcResult"></div>
                `;
            }
        } 
        else if (calcType === 'length') {
            if (parsedSize) {
                html = `
                    <div class="parsed-info">
                        📏 Размер из таблицы: <span class="value">${parsedSize.original}</span><br>
                        → Длина: <span class="value">${parsedSize.length_m.toFixed(2)} м</span>
                    </div>
                    <div class="form-row">
                        <label>🔢 Количество (шт)</label>
                        <input type="number" id="lengthQty" value="1" step="1" min="1">
                    </div>
                    <div class="calc-result" id="calcResult"></div>
                `;
            } else {
                html = `
                    <div class="form-row"><label>📏 Введите размеры</label></div>
                    <div class="size-row">
                        <div class="size-field"><label>Длина (м)</label><input type="number" id="lengthVal" value="1" step="0.1" placeholder="м"></div>
                        <div class="size-field"><label>Количество (шт)</label><input type="number" id="lengthCount" value="1" step="1" placeholder="шт"></div>
                    </div>
                    <div class="calc-result" id="calcResult"></div>
                `;
            }
        } 
        else {
            html = `
                <div class="form-row">
                    <label>🔢 Количество (${currentItem.unit})</label>
                    <input type="number" id="pieceQty" value="1" step="1" min="1">
                </div>
                <div class="calc-result" id="calcResult"></div>
            `;
        }
        
        calcCard.innerHTML = html;
        calcCard.style.display = 'block';
        
        if (calcType === 'area') {
            if (parsedSize) {
                document.getElementById('areaQty')?.addEventListener('input', calculateTotal);
            } else {
                document.getElementById('areaWidth')?.addEventListener('input', calculateTotal);
                document.getElementById('areaHeight')?.addEventListener('input', calculateTotal);
                document.getElementById('areaCount')?.addEventListener('input', calculateTotal);
            }
        } else if (calcType === 'length') {
            if (parsedSize) {
                document.getElementById('lengthQty')?.addEventListener('input', calculateTotal);
            } else {
                document.getElementById('lengthVal')?.addEventListener('input', calculateTotal);
                document.getElementById('lengthCount')?.addEventListener('input', calculateTotal);
            }
        } else {
            document.getElementById('pieceQty')?.addEventListener('input', calculateTotal);
        }
        
        calculateTotal();
    }
    
    function calculateTotal() {
        if (!currentItem) return 0;
        
        const calcType = getCalcType(currentItem.unit);
        const parsedSize = parseSize(currentItem.size, calcType);
        let total = 0, quantity = 0, calcText = '';
        
        if (calcType === 'area') {
            if (parsedSize) {
                const qty = parseFloat(document.getElementById('areaQty')?.value) || 0;
                const areaOne = parsedSize.width_m * parsedSize.height_m;
                total = areaOne * currentItem.price * qty;
                quantity = qty;
                calcText = `${qty} шт × ${areaOne.toFixed(2)}м² × ${currentItem.price.toFixed(2)}₽ = ${total.toFixed(2)}₽`;
            } else {
                const width = parseFloat(document.getElementById('areaWidth')?.value) || 0;
                const height = parseFloat(document.getElementById('areaHeight')?.value) || 0;
                const count = parseFloat(document.getElementById('areaCount')?.value) || 0;
                const area = width * height;
                total = area * currentItem.price * count;
                quantity = count;
                calcText = `${width}м × ${height}м = ${area.toFixed(2)}м² × ${count}шт × ${currentItem.price.toFixed(2)}₽ = ${total.toFixed(2)}₽`;
            }
        } 
        else if (calcType === 'length') {
            if (parsedSize) {
                const qty = parseFloat(document.getElementById('lengthQty')?.value) || 0;
                total = parsedSize.length_m * currentItem.price * qty;
                quantity = qty;
                calcText = `${qty} шт × ${parsedSize.length_m.toFixed(2)}м × ${currentItem.price.toFixed(2)}₽ = ${total.toFixed(2)}₽`;
            } else {
                const length = parseFloat(document.getElementById('lengthVal')?.value) || 0;
                const count = parseFloat(document.getElementById('lengthCount')?.value) || 0;
                total = length * currentItem.price * count;
                quantity = count;
                calcText = `${length}м × ${count}шт × ${currentItem.price.toFixed(2)}₽ = ${total.toFixed(2)}₽`;
            }
        } 
        else {
            const qty = parseFloat(document.getElementById('pieceQty')?.value) || 0;
            total = qty * currentItem.price;
            quantity = qty;
            calcText = `${qty} ${currentItem.unit} × ${currentItem.price.toFixed(2)}₽ = ${total.toFixed(2)}₽`;
        }
        
        document.getElementById('rowTotal').innerHTML = total.toFixed(2).replace('.', ',') + ' ₽';
        const calcResult = document.getElementById('calcResult');
        if (calcResult) calcResult.innerHTML = calcText;
        
        return { total, quantity, calcText };
    }
    
    function exportToExcel() {
        if (estimateItems.length === 0) { alert('Смета пуста'); return; }
        
        let rows = [];
        rows.push('Тип;Категория;Наименование;Расчёт;Ед.изм;Кол-во;Цена/ед (₽);Итого (₽)');
        
        const materials = estimateItems.filter(item => item.type === 'Материал');
        const works = estimateItems.filter(item => item.type === 'Работа');
        
        let materialsSum = 0;
        let worksSum = 0;
        
        if (materials.length > 0) {
            rows.push('=== МАТЕРИАЛЫ ===');
            materials.forEach(item => {
                materialsSum += item.total;
                rows.push(`${item.type};${item.category};${item.name};${item.calcText};${item.unit};${item.quantity};${item.price.toFixed(2).replace('.', ',')};${item.total.toFixed(2).replace('.', ',')}`);
            });
            rows.push(`ИТОГО ПО МАТЕРИАЛАМ;;;;;;${materialsSum.toFixed(2).replace('.', ',')}`);
            rows.push('');
        }
        
        if (works.length > 0) {
            rows.push('=== РАБОТЫ И УСЛУГИ ===');
            works.forEach(item => {
                worksSum += item.total;
                rows.push(`${item.type};${item.category};${item.name};${item.calcText};${item.unit};${item.quantity};${item.price.toFixed(2).replace('.', ',')};${item.total.toFixed(2).replace('.', ',')}`);
            });
            rows.push(`ИТОГО ПО РАБОТАМ;;;;;;${worksSum.toFixed(2).replace('.', ',')}`);
            rows.push('');
        }
        
        const grandTotal = materialsSum + worksSum;
        rows.push(`ВСЕГО ПО СМЕТЕ;;;;;;${grandTotal.toFixed(2).replace('.', ',')}`);
        
        const blob = new Blob(["\uFEFF" + rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `smeta_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.csv`;
        link.click();
        URL.revokeObjectURL(link.href);
    }
    
    function copyEstimate() {
        if (estimateItems.length === 0) { alert('Смета пуста'); return; }
        
        let text = 'Тип\tКатегория\tНаименование\tРасчёт\tЕд.изм\tКол-во\tЦена/ед (₽)\tИтого (₽)\n';
        estimateItems.forEach(item => {
            text += `${item.type}\t${item.category}\t${item.name}\t${item.calcText}\t${item.unit}\t${item.quantity}\t${item.price.toFixed(2)}\t${item.total.toFixed(2)}\n`;
        });
        const grandTotal = estimateItems.reduce((sum, i) => sum + i.total, 0);
        text += `\nИТОГО:\t\t\t\t\t\t\t${grandTotal.toFixed(2)} ₽`;
        
        navigator.clipboard.writeText(text);
        alert('✅ Таблица скопирована в буфер обмена');
    }
    
    function clearEstimate() {
        if (confirm('Очистить всю смету?')) {
            estimateItems = [];
            renderEstimate();
        }
    }
    
    function loadCatalog() {
        const materialsDiv = document.getElementById('materialsList');
        const worksDiv = document.getElementById('worksList');
        materialsDiv.innerHTML = '<div style="text-align:center; padding:20px;">📡 Загрузка...</div>';
        worksDiv.innerHTML = '<div style="text-align:center; padding:20px;">📡 Загрузка...</div>';
        
        const callbackName = 'jsonp_callback_' + Math.random().toString(36).substr(2);
        window[callbackName] = function(data) {
            delete window[callbackName];
            document.body.removeChild(script);
            catalog = data;
            
            const matSet = new Set();
            catalog.materials.forEach(item => { if (item.group) matSet.add(item.group); });
            materialCategories = Array.from(matSet).sort();
            
            const workSet = new Set();
            catalog.works.forEach(item => { if (item.group) workSet.add(item.group); });
            workCategories = Array.from(workSet).sort();
            
            renderCategories();
        };
        
        const script = document.createElement('script');
        script.src = API_URL + '?callback=' + callbackName;
        script.onerror = () => {
            delete window[callbackName];
            document.body.removeChild(script);
            materialsDiv.innerHTML = '<div style="color:red; text-align:center;">❌ Ошибка загрузки</div>';
            worksDiv.innerHTML = '<div style="color:red; text-align:center;">❌ Ошибка загрузки</div>';
        };
        document.body.appendChild(script);
    }
    
    function renderCategories() {
        const materialsDiv = document.getElementById('materialsList');
        materialsDiv.innerHTML = '';
        materialCategories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'category-btn';
            btn.innerHTML = `<span class="category-icon">${getIcon(cat)}</span><span>${cat}</span>`;
            btn.onclick = () => selectCategory('material', cat);
            materialsDiv.appendChild(btn);
        });
        
        const worksDiv = document.getElementById('worksList');
        worksDiv.innerHTML = '';
        workCategories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'category-btn';
            btn.innerHTML = `<span class="category-icon">${getIcon(cat)}</span><span>${cat}</span>`;
            btn.onclick = () => selectCategory('work', cat);
            worksDiv.appendChild(btn);
        });
        
        document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
        resetForm();
    }
    
    function getIcon(category) {
        const icons = {
            'Листовые материалы': '📄', 'Профиль металлический': '📐',
            'Профиль алюминиевый': '🥤', 'Нержавеющая сталь': '⚙️',
            'Пленки': '🎨', 'Светотехника': '💡', 'Обнарядка': '🎄',
            'Работы': '🔧', 'Подряд': '📋', 'Монтаж': '🚚', 'Транспорт': '🚛'
        };
        return icons[category] || '📁';
    }
    
    function resetForm() {
        currentType = null;
        currentCategory = null;
        currentItems = [];
        currentItem = null;
        document.getElementById('itemSelect').innerHTML = '<option value="">Сначала выберите категорию</option>';
        document.getElementById('infoPanel').style.display = 'none';
        document.getElementById('calcCard').style.display = 'none';
        document.getElementById('rowTotal').innerHTML = '0 ₽';
    }
    
    function selectCategory(type, category) {
        currentType = type;
        currentCategory = category;
        
        document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
        for (let btn of document.querySelectorAll('.category-btn')) {
            if (btn.innerText.includes(category)) { btn.classList.add('active'); break; }
        }
        
        currentItems = [];
        if (type === 'material') {
            catalog.materials.forEach(item => { if (item.group === category) currentItems.push({ ...item, itemType: 'material' }); });
        } else {
            catalog.works.forEach(item => { if (item.group === category) currentItems.push({ ...item, itemType: 'work' }); });
        }
        
        const select = document.getElementById('itemSelect');
        select.innerHTML = '<option value="">Выберите позицию</option>';
        currentItems.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.name;
            opt.textContent = item.name;
            opt.dataset.unit = item.unit || '';
            opt.dataset.price = item.price || 0;
            opt.dataset.size = item.size || '';
            select.appendChild(opt);
        });
        
        document.getElementById('infoPanel').style.display = 'none';
        document.getElementById('calcCard').style.display = 'none';
        document.getElementById('rowTotal').innerHTML = '0 ₽';
        currentItem = null;
    }
    
    function fillDetails() {
        const select = document.getElementById('itemSelect');
        const opt = select.options[select.selectedIndex];
        if (!opt || !opt.value) return;
        
        const selected = currentItems.find(item => item.name === opt.value);
        if (!selected) return;
        
        document.getElementById('infoPanel').style.display = 'block';
        document.getElementById('sizeValue').innerHTML = selected.size || '—';
        document.getElementById('unitValue').innerHTML = selected.unit || '—';
        document.getElementById('priceValue').innerHTML = selected.price ? selected.price.toLocaleString('ru-RU') + ' ₽' : '—';
        
        currentItem = {
            type: currentType === 'material' ? 'Материал' : 'Работа',
            category: currentCategory,
            name: selected.name,
            unit: selected.unit || '—',
            price: parseFloat(selected.price) || 0,
            size: selected.size || ''
        };
        
        buildCalcInterface();
    }
    
    function addToEstimate() {
        if (!currentItem || !currentItem.name) { alert('Выберите позицию'); return; }
        
        const calcType = getCalcType(currentItem.unit);
        const parsedSize = parseSize(currentItem.size, calcType);
        let total = 0, quantity = 0, calcText = '';
        
        if (calcType === 'area') {
            if (parsedSize) {
                const qty = parseFloat(document.getElementById('areaQty')?.value) || 0;
                const areaOne = parsedSize.width_m * parsedSize.height_m;
                total = areaOne * currentItem.price * qty;
                quantity = qty;
                calcText = `${qty} шт × ${areaOne.toFixed(2)}м²`;
            } else {
                const width = parseFloat(document.getElementById('areaWidth')?.value) || 0;
                const height = parseFloat(document.getElementById('areaHeight')?.value) || 0;
                const count = parseFloat(document.getElementById('areaCount')?.value) || 0;
                const area = width * height;
                total = area * currentItem.price * count;
                quantity = count;
                calcText = `${width}м × ${height}м = ${area.toFixed(2)}м² × ${count}шт`;
            }
        } 
        else if (calcType === 'length') {
            if (parsedSize) {
                const qty = parseFloat(document.getElementById('lengthQty')?.value) || 0;
                total = parsedSize.length_m * currentItem.price * qty;
                quantity = qty;
                calcText = `${qty} шт × ${parsedSize.length_m.toFixed(2)}м`;
            } else {
                const length = parseFloat(document.getElementById('lengthVal')?.value) || 0;
                const count = parseFloat(document.getElementById('lengthCount')?.value) || 0;
                total = length * currentItem.price * count;
                quantity = count;
                calcText = `${length}м × ${count}шт`;
            }
        } 
        else {
            const qty = parseFloat(document.getElementById('pieceQty')?.value) || 0;
            total = qty * currentItem.price;
            quantity = qty;
            calcText = `${qty} ${currentItem.unit}`;
        }
        
        if (total === 0) { alert('Укажите параметры расчёта'); return; }
        
        estimateItems.push({
            type: currentItem.type,
            category: currentItem.category,
            name: currentItem.name,
            calcText: calcText,
            unit: currentItem.unit,
            quantity: quantity,
            price: currentItem.price,
            total: total
        });
        
        renderEstimate();
        document.getElementById('rowTotal').innerHTML = '0 ₽';
    }
    
    function renderEstimate() {
        const tbody = document.getElementById('estimateBody');
        tbody.innerHTML = '';
        let grand = 0;
        
        if (estimateItems.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="empty-estimate">Смета пуста. Добавьте позиции.缓解</td>';
            document.getElementById('totalEstimate').innerHTML = '0 ₽';
            return;
        }
        
        estimateItems.forEach((item, idx) => {
            grand += item.total;
            const row = tbody.insertRow();
            row.classList.add(idx % 2 === 0 ? 'even-row' : 'odd-row');
            row.insertCell(0).innerHTML = item.type;
            row.insertCell(1).innerHTML = item.category;
            row.insertCell(2).innerHTML = item.name;
            row.insertCell(3).innerHTML = item.calcText;
            row.insertCell(4).innerHTML = item.unit;
            row.insertCell(5).innerHTML = item.quantity;
            row.insertCell(6).innerHTML = item.price.toFixed(2).replace('.', ',') + ' ₽';
            row.insertCell(7).innerHTML = item.total.toFixed(2).replace('.', ',') + ' ₽';
            const delCell = row.insertCell(8);
            const delBtn = document.createElement('button');
            delBtn.innerHTML = '🗑️';
            delBtn.className = 'delete-item';
            delBtn.onclick = () => { estimateItems.splice(idx, 1); renderEstimate(); };
            delCell.appendChild(delBtn);
        });
        
        // Добавляем итоговую строку
        const totalRow = tbody.insertRow();
        totalRow.classList.add('total-row');
        totalRow.insertCell(0).innerHTML = '<strong>ИТОГО:</strong>';
        totalRow.insertCell(1).innerHTML = '';
        totalRow.insertCell(2).innerHTML = '';
        totalRow.insertCell(3).innerHTML = '';
        totalRow.insertCell(4).innerHTML = '';
        totalRow.insertCell(5).innerHTML = '';
        totalRow.insertCell(6).innerHTML = '';
        totalRow.insertCell(7).innerHTML = `<strong>${grand.toFixed(2).replace('.', ',')} ₽</strong>`;
        totalRow.insertCell(8).innerHTML = '';
        
        document.getElementById('totalEstimate').innerHTML = grand.toFixed(2).replace('.', ',') + ' ₽';
        localStorage.setItem('estimate', JSON.stringify(estimateItems));
    }
    
    document.getElementById('itemSelect').addEventListener('change', fillDetails);
    
    const saved = localStorage.getItem('estimate');
    if (saved) { try { estimateItems = JSON.parse(saved); renderEstimate(); } catch(e) {} }
    
    loadCatalog();
</script>
</body>
</html>
