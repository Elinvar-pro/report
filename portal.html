<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Конструктор сметы</title>
    <style>
        :root {
            --green: #2e7d32;
            --green-dark: #1a5d2a;
            --green-light: #e8f5e9;
            --yellow: #fff9c4;
            --orange: #ffcc02;
            --gray-bg: #f5f7fb;
            --gray-border: #dce2e8;
            --gray-text: #6c7a8a;
            --white: #ffffff;
            --red: #c62828;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--gray-bg);
            color: #1a2a3a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: var(--white);
            border-bottom: 1px solid var(--gray-border);
            padding: 0 24px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--green-dark);
        }
        .header-status {
            font-size: 12px;
            color: var(--gray-text);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
        }
        .status-dot.online { background: #4caf50; }
        .status-dot.offline { background: #f44336; }
        .status-dot.loading { background: #ff9800; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        
        .main-layout {
            display: flex;
            flex: 1;
            gap: 1px;
            background: var(--gray-border);
            overflow: hidden;
        }
        
        .column {
            background: var(--white);
            overflow-y: auto;
        }
        .column-catalog {
            width: 250px;
            min-width: 200px;
            flex-shrink: 0;
            padding: 16px;
        }
        .column-params {
            flex: 1;
            min-width: 300px;
            padding: 20px 24px;
        }
        .column-estimate {
            flex: 1.8;
            min-width: 400px;
            display: flex;
            flex-direction: column;
        }
        
        .column-header {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--gray-text);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--gray-border);
        }
        
        .section-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8a99a8;
            margin: 14px 0 8px;
        }
        .section-label:first-child { margin-top: 0; }
        
        .category-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .category-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: #2c3e50;
            transition: background 0.15s;
            border: 1px solid transparent;
        }
        .category-item:hover { background: #f0f2f5; }
        .category-item.active {
            background: var(--green-light);
            border-color: var(--green);
            color: var(--green-dark);
            font-weight: 600;
        }
        
        .divider {
            height: 1px;
            background: var(--gray-border);
            margin: 12px 0;
        }
        
        .field-group {
            margin-bottom: 16px;
        }
        .field-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: #5b6e8c;
            margin-bottom: 4px;
        }
        .field-group select,
        .field-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--gray-border);
            border-radius: 8px;
            font-size: 14px;
            font-family: var(--font);
            background: var(--white);
        }
        .field-group select:focus,
        .field-group input:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 0 2px rgba(46,125,50,0.1);
        }
        
        .info-block {
            background: #f8f9fc;
            border: 1px solid var(--gray-border);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 16px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 13px;
        }
        .info-row .label { color: var(--gray-text); }
        .info-row .value { font-weight: 600; color: #1a2a3a; }
        .info-row .value.size-hint {
            background: var(--green-light);
            color: var(--green-dark);
            padding: 1px 8px;
            border-radius: 3px;
            font-size: 12px;
        }
        
        .calc-block {
            background: #f8f9fc;
            border: 1px solid var(--gray-border);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 16px;
        }
        .calc-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
        .calc-row .field-group { flex: 1; min-width: 100px; margin-bottom: 0; }
        .calc-hint { font-size: 11px; color: var(--gray-text); margin-top: 4px; }
        .calc-result {
            margin-top: 12px; padding-top: 10px;
            border-top: 1px solid #e0e4e8;
            text-align: right; font-size: 13px; color: var(--green-dark);
        }
        
        .position-total {
            background: #f0fdf4; border: 1px solid #c8e6c9;
            border-radius: 8px; padding: 14px; text-align: center; margin-bottom: 12px;
        }
        .position-total .pt-label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--green); }
        .position-total .pt-value { font-size: 26px; font-weight: 700; color: var(--green-dark); }
        
        .btn {
            padding: 10px 20px; border-radius: 6px; font-weight: 600;
            cursor: pointer; font-family: var(--font); font-size: 14px;
            border: none; transition: all 0.15s; white-space: nowrap;
        }
        .btn-primary { background: var(--green); color: white; width: 100%; }
        .btn-primary:hover { background: #1b5e20; }
        .btn-outline { background: white; border: 1px solid var(--green); color: var(--green); }
        .btn-outline:hover { background: var(--green-light); }
        .btn-sm { padding: 5px 12px; font-size: 12px; }
        .btn-danger { color: var(--red); border-color: var(--red); background: white; }
        .btn-danger:hover { background: #ffebee; }
        
        .estimate-header-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 16px; border-bottom: 2px solid var(--gray-border); flex-shrink: 0;
        }
        .estimate-title { font-size: 15px; font-weight: 700; color: #1a2a3a; }
        .estimate-grand { font-size: 18px; font-weight: 700; color: var(--green-dark); }
        
        .estimate-table-wrap {
            flex: 1; overflow-y: auto; padding: 0;
        }
        .estimate-table {
            width: 100%; border-collapse: collapse; font-size: 12px;
        }
        .estimate-table th {
            text-align: left; padding: 8px 10px; background: #f8fafc;
            font-weight: 600; color: var(--green-dark);
            border-bottom: 1px solid var(--gray-border);
            position: sticky; top: 0; z-index: 1;
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.3px;
        }
        .estimate-table th.col-right { text-align: right; }
        
        .estimate-table td {
            padding: 6px 10px; border-bottom: 1px solid #f0f2f5; vertical-align: middle;
        }
        .estimate-table .even { background: #f8f9fc; }
        .estimate-table .odd { background: #ffffff; }
        .estimate-table .col-right { text-align: right; white-space: nowrap; }
        .estimate-table .col-bold { font-weight: 600; }
        .estimate-table .del-btn {
            background: none; border: none; cursor: pointer;
            color: #999; font-size: 16px; padding: 0 4px; line-height: 1;
        }
        .estimate-table .del-btn:hover { color: var(--red); }
        
        /* Секции и итоги */
        .section-row td {
            background: #e8f5e9; font-weight: 700; font-size: 11px;
            color: #1a5d2a; padding: 5px 10px; text-transform: uppercase;
            letter-spacing: 0.5px; border-bottom: 1px solid #c8e6c9;
        }
        .subtotal-row td {
            background: #fff9c4; font-weight: 700; font-size: 12px;
            border-top: 1px solid #e0d89c; border-bottom: 1px solid #e0d89c;
        }
        .grand-row td {
            background: #ffcc02; font-weight: 800; font-size: 13px;
            border-top: 2px solid #e6b800;
        }
        
        .estimate-empty { text-align: center; padding: 40px; color: #8a99a8; font-size: 13px; }
        
        .estimate-actions {
            padding: 12px 16px; border-top: 1px solid var(--gray-border);
            display: flex; gap: 8px; flex-wrap: wrap; flex-shrink: 0;
        }
        
        /* МОБИЛЬНАЯ ВЕРСИЯ */
        @media (max-width: 900px) {
            .main-layout {
                flex-direction: column;
                overflow: visible;
            }
            .column-catalog {
                width: 100%; min-width: 0; max-height: none;
                padding: 12px;
            }
            .category-list {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 4px;
                max-height: none;
            }
            .category-item {
                font-size: 12px; padding: 6px 10px;
                white-space: nowrap;
            }
            .column-params {
                min-width: 0; padding: 12px;
            }
            .column-estimate {
                min-width: 0; flex: 1;
            }
            .header {
                padding: 0 12px; height: 48px;
            }
            .header-title { font-size: 16px; }
            .estimate-table { font-size: 11px; }
            .estimate-table th, .estimate-table td { padding: 4px 6px; }
            .estimate-actions { flex-direction: column; }
            .btn-sm { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

<header class="header">
    <span class="header-title">Конструктор сметы</span>
    <span class="header-status" id="dataStatus">
        <span class="status-dot loading"></span> Загрузка...
    </span>
</header>

<div class="main-layout">

    <!-- КАТАЛОГ -->
    <div class="column column-catalog">
        <div class="section-label">Материалы</div>
        <div class="category-list" id="materialsList">
            <div style="color:#8a99a8; font-size:12px; padding:8px;">Загрузка...</div>
        </div>
        <div class="divider"></div>
        <div class="section-label">Работы и услуги</div>
        <div class="category-list" id="worksList">
            <div style="color:#8a99a8; font-size:12px; padding:8px;">Загрузка...</div>
        </div>
    </div>

    <!-- ПАРАМЕТРЫ -->
    <div class="column column-params">
        <div class="column-header">Параметры позиции</div>

        <div class="field-group">
            <label>Позиция</label>
            <select id="itemSelect">
                <option value="">Сначала выберите категорию</option>
            </select>
        </div>

        <div id="infoBlock" class="info-block" style="display:none;">
            <div class="info-row">
                <span class="label">Размер (из таблицы)</span>
                <span class="value size-hint" id="sizeValue">—</span>
            </div>
            <div class="info-row">
                <span class="label">Единица измерения</span>
                <span class="value" id="unitValue">—</span>
            </div>
            <div class="info-row">
                <span class="label">Цена за единицу</span>
                <span class="value" id="priceValue">—</span>
            </div>
            <div class="info-row" id="supplierRow" style="display:none;">
                <span class="label">Поставщик</span>
                <span class="value" id="supplierValue">—</span>
            </div>
            <div class="info-row" id="siteRow" style="display:none;">
                <span class="label">Сайт</span>
                <span class="value" id="siteValue">—</span>
            </div>
        </div>

        <div id="calcBlock" class="calc-block" style="display:none;">
            <div class="calc-row" id="calcFields"></div>
            <div class="calc-result" id="calcResult"></div>
        </div>

        <div class="position-total">
            <div class="pt-label">Сумма за позицию</div>
            <div class="pt-value" id="rowTotal">0 ₽</div>
        </div>

        <button class="btn btn-primary" onclick="addToEstimate()">Добавить в смету</button>
    </div>

    <!-- СМЕТА -->
    <div class="column column-estimate">
        <div class="estimate-header-row">
            <span class="estimate-title">Смета</span>
            <span class="estimate-grand" id="totalEstimate">0 ₽</span>
        </div>
        <div class="estimate-table-wrap">
            <table class="estimate-table">
                <thead>
                    <tr>
                        <th>Тип</th>
                        <th>Наименование</th>
                        <th>Расчёт</th>
                        <th>Ед.</th>
                        <th class="col-right">Кол-во</th>
                        <th class="col-right">Цена/ед</th>
                        <th class="col-right">Сумма</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="estimateBody">
                    <tr><td colspan="8" class="estimate-empty">Смета пуста. Добавьте позиции.</td></tr>
                </tbody>
            </table>
        </div>
        <div class="estimate-actions">
            <button class="btn btn-outline btn-sm" onclick="exportToXLSX()">Экспорт в Excel</button>
            <button class="btn btn-outline btn-sm" onclick="copyEstimate()">Копировать</button>
            <button class="btn btn-danger btn-sm" onclick="clearEstimate()">Очистить</button>
        </div>
    </div>

</div>

<script>
// ============================================================
// УТИЛИТЫ
// ============================================================
function parsePrice(value) {
    if (value === undefined || value === null || value === '') return 0;
    if (typeof value === 'number') return value;
    let s = String(value).trim().replace(/\s/g, '').replace(',', '.');
    let num = parseFloat(s);
    return isNaN(num) ? 0 : num;
}

// ============================================================
// ЗАГРУЗКА ДАННЫХ
// ============================================================
const SPREADSHEET_ID = "1OhoJYlXsYiJDdCF_ET7gkNKg21juUI5ENo-haz6wcR4";
const SHEET1_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=Лист1`;
const SHEET2_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=Лист2`;

let catalog = { materials: [], works: [] };
let dataLoaded = false;

function setDataStatus(status, text) {
    document.getElementById('dataStatus').innerHTML = `<span class="status-dot ${status}"></span> ${text}`;
}

function loadAllData() {
    setDataStatus('loading', 'Загрузка...');
    
    Promise.all([
        fetch(SHEET1_URL).then(r => r.text()),
        fetch(SHEET2_URL).then(r => r.text())
    ])
    .then(([text1, text2]) => {
        const json1 = JSON.parse(text1.substring(47, text1.length - 2));
        catalog.materials = [];
        for (let i = 0; i < json1.table.rows.length; i++) {
            const row = json1.table.rows[i].c;
            if (!row || !row[0] || !row[0].v) continue;
            const group = String(row[0]?.v || '').trim();
            if (!group) continue;
            catalog.materials.push({
                group, name: String(row[1]?.v || '').trim(),
                unit: String(row[3]?.v || '').trim(), price: parsePrice(row[4]?.v),
                size: String(row[5]?.v || '').trim(), supplier: String(row[7]?.v || '').trim(),
                site: String(row[8]?.v || '').trim()
            });
        }
        
        const json2 = JSON.parse(text2.substring(47, text2.length - 2));
        catalog.works = [];
        for (let i = 0; i < json2.table.rows.length; i++) {
            const row = json2.table.rows[i].c;
            if (!row || !row[0] || !row[0].v) continue;
            const group = String(row[0]?.v || '').trim();
            if (!group) continue;
            catalog.works.push({
                group, name: String(row[1]?.v || '').trim(),
                unit: String(row[2]?.v || '').trim(), price: parsePrice(row[3]?.v),
                note: String(row[4]?.v || '').trim(), size: '', supplier: '', site: ''
            });
        }
        
        dataLoaded = true;
        setDataStatus('online', 'Готово');
        initConstructor();
        preloadExcelJS();
    })
    .catch(error => {
        console.error(error);
        setDataStatus('offline', 'Ошибка загрузки');
    });
}

function preloadExcelJS() {
    if (typeof ExcelJS === 'undefined' && !document.getElementById('exceljs-script')) {
        const s = document.createElement('script');
        s.id = 'exceljs-script';
        s.src = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
        document.head.appendChild(s);
    }
}

// ============================================================
// КОНСТРУКТОР
// ============================================================
let materialCategories = [], workCategories = [];
let currentType = null, currentCategory = null, currentItems = [], currentItem = null;
let estimateItems = [];

function initConstructor() {
    materialCategories = [...new Set(catalog.materials.map(i => i.group).filter(Boolean))].sort();
    workCategories = [...new Set(catalog.works.map(i => i.group).filter(Boolean))].sort();
    renderCategories();
    loadEstimateFromStorage();
}

function renderCategories() {
    const mDiv = document.getElementById('materialsList');
    mDiv.innerHTML = '';
    materialCategories.forEach(cat => {
        const div = document.createElement('div');
        div.className = 'category-item';
        div.textContent = cat;
        div.onclick = () => selectCategory('material', cat);
        mDiv.appendChild(div);
    });
    
    const wDiv = document.getElementById('worksList');
    wDiv.innerHTML = '';
    workCategories.forEach(cat => {
        const div = document.createElement('div');
        div.className = 'category-item';
        div.textContent = cat;
        div.onclick = () => selectCategory('work', cat);
        wDiv.appendChild(div);
    });
    
    resetForm();
}

function resetForm() {
    currentType = null; currentCategory = null; currentItems = []; currentItem = null;
    document.getElementById('itemSelect').innerHTML = '<option value="">Сначала выберите категорию</option>';
    document.getElementById('infoBlock').style.display = 'none';
    document.getElementById('calcBlock').style.display = 'none';
    document.getElementById('rowTotal').innerHTML = '0 ₽';
    document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active'));
}

function selectCategory(type, category) {
    currentType = type; currentCategory = category;
    document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active'));
    const selector = type === 'material' ? '#materialsList .category-item' : '#worksList .category-item';
    document.querySelectorAll(selector).forEach(el => {
        if (el.textContent.trim() === category) el.classList.add('active');
    });
    
    currentItems = [];
    const source = type === 'material' ? catalog.materials : catalog.works;
    source.forEach(item => { if (item.group === category) currentItems.push({ ...item, itemType: type }); });
    
    const select = document.getElementById('itemSelect');
    select.innerHTML = '<option value="">Выберите позицию</option>';
    currentItems.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.name; opt.textContent = item.name;
        opt.dataset.unit = item.unit || ''; opt.dataset.price = item.price || 0;
        opt.dataset.size = item.size || ''; opt.dataset.supplier = item.supplier || '';
        opt.dataset.site = item.site || '';
        select.appendChild(opt);
    });
    
    document.getElementById('infoBlock').style.display = 'none';
    document.getElementById('calcBlock').style.display = 'none';
    document.getElementById('rowTotal').innerHTML = '0 ₽';
    currentItem = null;
}

function fillDetails() {
    const select = document.getElementById('itemSelect');
    const opt = select.options[select.selectedIndex];
    if (!opt || !opt.value) return;
    const selected = currentItems.find(item => item.name === opt.value);
    if (!selected) return;
    
    document.getElementById('infoBlock').style.display = 'block';
    document.getElementById('sizeValue').innerHTML = selected.size || '—';
    document.getElementById('unitValue').innerHTML = selected.unit || '—';
    document.getElementById('priceValue').innerHTML = selected.price
        ? selected.price.toLocaleString('ru-RU') + ' ₽/' + (selected.unit || 'ед.') : '—';
    
    document.getElementById('supplierRow').style.display = selected.supplier ? 'flex' : 'none';
    if (selected.supplier) document.getElementById('supplierValue').innerHTML = selected.supplier;
    
    document.getElementById('siteRow').style.display = selected.site ? 'flex' : 'none';
    if (selected.site) {
        const sv = document.getElementById('siteValue');
        sv.innerHTML = selected.site.startsWith('http')
            ? `<a href="${selected.site}" target="_blank" style="color:#2e7d32;">открыть</a>`
            : selected.site;
    }
    
    currentItem = {
        type: currentType === 'material' ? 'Материал' : 'Работа',
        category: currentCategory, name: selected.name,
        unit: selected.unit || 'ед.', price: parseFloat(selected.price) || 0,
        size: selected.size || '', supplier: selected.supplier || '', site: selected.site || ''
    };
    buildCalcInterface();
}

function getCalcType(unit) {
    const u = (unit || '').toLowerCase();
    if (u.includes('м²') || u.includes('м.кв') || u.includes('кв.м')) return 'area';
    if (u.includes('м.п') || u === 'м' || u.includes('пог.м')) return 'length';
    return 'piece';
}

function buildCalcInterface() {
    if (!currentItem) return;
    const calcType = getCalcType(currentItem.unit);
    const unitLabel = currentItem.unit || 'ед.';
    let html = '';
    
    if (calcType === 'area') {
        html = `<div class="field-group"><label>Площадь (м²)</label>
            <input type="number" id="calcQty" value="1" step="0.01" min="0.01" placeholder="Сколько м² нужно">
            <div class="calc-hint">Введите нужную площадь</div></div>`;
    } else if (calcType === 'length') {
        html = `<div class="field-group"><label>Длина (м)</label>
            <input type="number" id="calcQty" value="1" step="0.1" min="0.1" placeholder="Сколько метров нужно">
            <div class="calc-hint">Введите нужную длину</div></div>`;
    } else {
        html = `<div class="field-group"><label>Количество (${unitLabel})</label>
            <input type="number" id="calcQty" value="1" step="1" min="1" placeholder="Сколько нужно">
            <div class="calc-hint">Введите нужное количество</div></div>`;
    }
    if (currentItem.size) html += `<div style="font-size:11px;color:#6c7a8a;margin-top:6px;">Размер единицы: ${currentItem.size}</div>`;
    
    document.getElementById('calcFields').innerHTML = html;
    document.getElementById('calcBlock').style.display = 'block';
    document.getElementById('calcQty')?.addEventListener('input', calculateTotal);
    calculateTotal();
}

function calculateTotal() {
    if (!currentItem) return 0;
    const qty = parseFloat(document.getElementById('calcQty')?.value) || 0;
    const total = qty * currentItem.price;
    
    let calcText = '';
    const calcType = getCalcType(currentItem.unit);
    if (calcType === 'area') calcText = `${qty.toFixed(2)} м² x ${currentItem.price.toFixed(2)} ₽/м² = ${total.toFixed(2)} ₽`;
    else if (calcType === 'length') calcText = `${qty.toFixed(1)} м x ${currentItem.price.toFixed(2)} ₽/м = ${total.toFixed(2)} ₽`;
    else calcText = `${qty} ${currentItem.unit||'ед.'} x ${currentItem.price.toFixed(2)} ₽ = ${total.toFixed(2)} ₽`;
    
    document.getElementById('rowTotal').innerHTML = total.toFixed(2).replace('.', ',') + ' ₽';
    document.getElementById('calcResult').innerHTML = calcText;
    return { total, quantity: qty, calcText };
}

function addToEstimate() {
    if (!currentItem || !currentItem.name) { alert('Выберите позицию'); return; }
    const calc = calculateTotal();
    if (calc.total === 0) { alert('Укажите количество'); return; }
    
    const qty = calc.quantity;
    let calcTextShort = '';
    const calcType = getCalcType(currentItem.unit);
    if (calcType === 'area') calcTextShort = `${qty.toFixed(2)} м²`;
    else if (calcType === 'length') calcTextShort = `${qty.toFixed(1)} м`;
    else calcTextShort = `${qty} ${currentItem.unit || 'ед.'}`;
    
    estimateItems.push({
        type: currentItem.type, category: currentItem.category,
        name: currentItem.name, calcText: calcTextShort,
        unit: currentItem.unit || 'ед.', quantity: qty,
        price: currentItem.price, total: calc.total
    });
    renderEstimate();
    document.getElementById('rowTotal').innerHTML = '0 ₽';
}

function renderEstimate() {
    const tbody = document.getElementById('estimateBody');
    tbody.innerHTML = '';
    
    if (estimateItems.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="estimate-empty">Смета пуста. Добавьте позиции.</td></tr>';
        document.getElementById('totalEstimate').innerHTML = '0 ₽';
        return;
    }
    
    const materials = estimateItems.filter(i => i.type === 'Материал');
    const works = estimateItems.filter(i => i.type === 'Работа');
    let matsSum = 0, worksSum = 0, rowIdx = 0;
    
    function addRow(item) {
        const row = tbody.insertRow();
        row.className = rowIdx % 2 === 0 ? 'even' : 'odd';
        rowIdx++;
        row.insertCell(0).innerHTML = item.type;
        row.insertCell(1).innerHTML = item.name;
        row.insertCell(2).innerHTML = item.calcText;
        row.insertCell(3).innerHTML = item.unit;
        row.insertCell(4).innerHTML = item.quantity; row.cells[4].className = 'col-right';
        row.insertCell(5).innerHTML = item.price.toFixed(2).replace('.', ',') + ' ₽'; row.cells[5].className = 'col-right';
        row.insertCell(6).innerHTML = item.total.toFixed(2).replace('.', ',') + ' ₽'; row.cells[6].className = 'col-right col-bold';
        const del = row.insertCell(7);
        del.innerHTML = '<button class="del-btn">&times;</button>';
        del.querySelector('button').onclick = () => {
            const idx = estimateItems.indexOf(item);
            if (idx >= 0) { estimateItems.splice(idx, 1); renderEstimate(); }
        };
    }
    
    function addSubtotal(label, sum) {
        const row = tbody.insertRow();
        row.className = 'subtotal-row';
        row.insertCell(0).colSpan = 6;
        row.cells[0].innerHTML = label;
        row.cells[0].style.textAlign = 'right';
        row.cells[0].style.fontWeight = '700';
        const val = row.insertCell(1);
        val.innerHTML = sum.toFixed(2).replace('.', ',') + ' ₽';
        val.className = 'col-right'; val.style.fontWeight = '700';
        row.insertCell(2).innerHTML = '';
    }
    
    if (materials.length > 0) {
        const sr = tbody.insertRow(); sr.className = 'section-row';
        sr.insertCell(0).colSpan = 8; sr.cells[0].innerHTML = 'МАТЕРИАЛЫ';
        materials.forEach(item => { matsSum += item.total; addRow(item); });
        addSubtotal('Итого материалы:', matsSum);
    }
    
    if (works.length > 0) {
        const sr = tbody.insertRow(); sr.className = 'section-row';
        sr.insertCell(0).colSpan = 8; sr.cells[0].innerHTML = 'РАБОТЫ И УСЛУГИ';
        works.forEach(item => { worksSum += item.total; addRow(item); });
        addSubtotal('Итого работы:', worksSum);
    }
    
    const grand = matsSum + worksSum;
    const gr = tbody.insertRow(); gr.className = 'grand-row';
    gr.insertCell(0).colSpan = 6;
    gr.cells[0].innerHTML = 'ВСЕГО ПО СМЕТЕ:';
    gr.cells[0].style.textAlign = 'right'; gr.cells[0].style.fontWeight = '800';
    const gv = gr.insertCell(1);
    gv.innerHTML = grand.toFixed(2).replace('.', ',') + ' ₽';
    gv.className = 'col-right'; gv.style.fontWeight = '800';
    gr.insertCell(2).innerHTML = '';
    
    document.getElementById('totalEstimate').innerHTML = grand.toFixed(2).replace('.', ',') + ' ₽';
    localStorage.setItem('estimate', JSON.stringify(estimateItems));
}

function loadEstimateFromStorage() {
    try {
        const saved = localStorage.getItem('estimate');
        if (saved) { estimateItems = JSON.parse(saved); renderEstimate(); }
    } catch(e) {}
}

// ============================================================
// ЭКСПОРТ
// ============================================================
function copyEstimate() {
    if (!estimateItems.length) { alert('Смета пуста'); return; }
    let text = 'Тип\tНаименование\tРасчёт\tЕд.\tКол-во\tЦена/ед\tСумма\n';
    const mats = estimateItems.filter(i => i.type === 'Материал');
    const wrk = estimateItems.filter(i => i.type === 'Работа');
    let ms = 0, ws = 0;
    
    if (mats.length) {
        text += '\nМАТЕРИАЛЫ\n';
        mats.forEach(i => {
            ms += i.total;
            text += [i.type,i.name,i.calcText,i.unit,i.quantity,i.price.toFixed(2),i.total.toFixed(2)].join('\t')+'\n';
        });
        text += `\t\t\t\t\tИтого материалы:\t${ms.toFixed(2)} ₽\n`;
    }
    if (wrk.length) {
        text += '\nРАБОТЫ И УСЛУГИ\n';
        wrk.forEach(i => {
            ws += i.total;
            text += [i.type,i.name,i.calcText,i.unit,i.quantity,i.price.toFixed(2),i.total.toFixed(2)].join('\t')+'\n';
        });
        text += `\t\t\t\t\tИтого работы:\t${ws.toFixed(2)} ₽\n`;
    }
    text += `\n\t\t\t\t\tВСЕГО:\t${(ms+ws).toFixed(2)} ₽`;
    navigator.clipboard.writeText(text).then(() => alert('Смета скопирована')).catch(() => alert('Не удалось'));
}

function clearEstimate() {
    if (confirm('Очистить смету?')) { estimateItems = []; renderEstimate(); }
}

function exportToXLSX() {
    if (!estimateItems.length) { alert('Смета пуста'); return; }
    if (typeof ExcelJS === 'undefined') { alert('Подождите загрузки компонента...'); return; }
    exportToXLSX_do();
}

async function exportToXLSX_do() {
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('Смета', { views: [{ showGridLines: false }] });
    ws.columns = [{w:12},{w:30},{w:20},{w:10},{w:10},{w:14},{w:16}];
    
    const mats = estimateItems.filter(i => i.type === 'Материал');
    const wrk = estimateItems.filter(i => i.type === 'Работа');
    let r = 1;
    
    const t = ws.getRow(r); t.getCell(1).value = 'Смета от '+new Date().toLocaleString('ru-RU');
    t.getCell(1).font = {bold:true,size:14,color:{argb:'FF1A5D2A'}};
    ws.mergeCells(r,1,r,7); t.height=28; r++;
    
    ['Тип','Наименование','Расчёт','Ед.','Кол-во','Цена/ед','Сумма'].forEach((h,i) => {
        const c = ws.getRow(r).getCell(i+1);
        c.value=h; c.font={bold:true,color:{argb:'FFFFFFFF'},size:10};
        c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF2E7D32'}};
        c.alignment={horizontal:'center',vertical:'middle'};
        c.border=bd();
    });
    ws.getRow(r).height=24; r++;
    
    let ms=0,ws2=0;
    
    if (mats.length) {
        const sr = ws.getRow(r); sr.getCell(1).value='МАТЕРИАЛЫ';
        sr.getCell(1).font={bold:true,size:11,color:{argb:'FF1A5D2A'}};
        sr.getCell(1).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFC8E6C9'}};
        ws.mergeCells(r,1,r,7); applyB(sr,1,7); sr.height=22; r++;
        mats.forEach((it,i) => {
            ms+=it.total; const row=ws.getRow(r);
            const bg=i%2===0?'FFFFFFFF':'FFF5F5F5';
            [it.type,it.name,it.calcText,it.unit,it.quantity,it.price.toFixed(2).replace('.',',')+' ₽',it.total.toFixed(2).replace('.',',')+' ₽'].forEach((v,j) => {
                const c=row.getCell(j+1); c.value=v;
                c.fill={type:'pattern',pattern:'solid',fgColor:{argb:bg}};
                c.alignment={vertical:'middle',horizontal:j>=4?'right':'left'};
                c.border=bd();
            });
            row.getCell(7).font={bold:true}; row.height=20; r++;
        });
        const tr=ws.getRow(r); ws.mergeCells(r,1,r,5);
        tr.getCell(6).value='Итого материалы:'; tr.getCell(7).value=ms.toFixed(2).replace('.',',')+' ₽';
        [6,7].forEach(j=>{tr.getCell(j).font={bold:true};tr.getCell(j).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFF9C4'}};tr.getCell(j).alignment={horizontal:'right',vertical:'middle'};tr.getCell(j).border=bd();});
        applyB(tr,1,5); tr.height=22; r++;
    }
    
    if (wrk.length) {
        r++; const sr=ws.getRow(r); sr.getCell(1).value='РАБОТЫ И УСЛУГИ';
        sr.getCell(1).font={bold:true,size:11,color:{argb:'FF1A5D2A'}};
        sr.getCell(1).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFC8E6C9'}};
        ws.mergeCells(r,1,r,7); applyB(sr,1,7); sr.height=22; r++;
        wrk.forEach((it,i) => {
            ws2+=it.total; const row=ws.getRow(r);
            const bg=i%2===0?'FFFFFFFF':'FFF5F5F5';
            [it.type,it.name,it.calcText,it.unit,it.quantity,it.price.toFixed(2).replace('.',',')+' ₽',it.total.toFixed(2).replace('.',',')+' ₽'].forEach((v,j) => {
                const c=row.getCell(j+1); c.value=v;
                c.fill={type:'pattern',pattern:'solid',fgColor:{argb:bg}};
                c.alignment={vertical:'middle',horizontal:j>=4?'right':'left'};
                c.border=bd();
            });
            row.getCell(7).font={bold:true}; row.height=20; r++;
        });
        const tr=ws.getRow(r); ws.mergeCells(r,1,r,5);
        tr.getCell(6).value='Итого работы:'; tr.getCell(7).value=ws2.toFixed(2).replace('.',',')+' ₽';
        [6,7].forEach(j=>{tr.getCell(j).font={bold:true};tr.getCell(j).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFF9C4'}};tr.getCell(j).alignment={horizontal:'right',vertical:'middle'};tr.getCell(j).border=bd();});
        applyB(tr,1,5); tr.height=22; r++;
    }
    
    r++; const grand=ms+ws2; const gr=ws.getRow(r);
    ws.mergeCells(r,1,r,5);
    gr.getCell(6).value='ВСЕГО ПО СМЕТЕ:'; gr.getCell(7).value=grand.toFixed(2).replace('.',',')+' ₽';
    [6,7].forEach(j=>{gr.getCell(j).font={bold:true,size:12};gr.getCell(j).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFCC02'}};gr.getCell(j).alignment={horizontal:'right',vertical:'middle'};gr.getCell(j).border={top:{style:'medium'},bottom:{style:'medium'},left:{style:'thin'},right:{style:'thin'}};});
    applyB(gr,1,5); gr.height=26;
    
    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `smeta_${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.xlsx`;
    a.click(); URL.revokeObjectURL(a.href);
}

function bd() { return {top:{style:'thin'},bottom:{style:'thin'},left:{style:'thin'},right:{style:'thin'}}; }
function applyB(row,f,t) { for(let i=f;i<=t;i++) row.getCell(i).border=bd(); }

document.getElementById('itemSelect').addEventListener('change', fillDetails);
loadAllData();
window.addToEstimate = addToEstimate;
window.exportToXLSX = exportToXLSX;
window.copyEstimate = copyEstimate;
window.clearEstimate = clearEstimate;
