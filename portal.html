<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Конструктор сметы</title>
    <style>
        :root {
            --green: #2e7d32;
            --green-dark: #1a5d2a;
            --green-light: #e8f5e9;
            --yellow: #fff9c4;
            --orange: #ffcc02;
            --gray-bg: #f5f7fb;
            --gray-border: #dce2e8;
            --gray-text: #6c7a8a;
            --white: #ffffff;
            --red: #c62828;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--gray-bg);
            color: #1a2a3a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* ШАПКА */
        .header {
            background: var(--white);
            border-bottom: 1px solid var(--gray-border);
            padding: 0 24px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--green-dark);
            letter-spacing: -0.3px;
        }
        .header-status {
            font-size: 12px;
            color: var(--gray-text);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
        }
        .status-dot.online { background: #4caf50; }
        .status-dot.offline { background: #f44336; }
        .status-dot.loading { background: #ff9800; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        
        /* ОСНОВНОЙ БЛОК */
        .main-layout {
            display: flex;
            flex: 1;
            gap: 1px;
            background: var(--gray-border);
            overflow: hidden;
        }
        
        /* КОЛОНКИ */
        .column {
            background: var(--white);
            overflow-y: auto;
        }
        .column-catalog {
            width: 280px;
            min-width: 240px;
            flex-shrink: 0;
            padding: 16px;
        }
        .column-params {
            flex: 1;
            min-width: 340px;
            padding: 20px 24px;
        }
        .column-estimate {
            width: 420px;
            min-width: 340px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
        
        /* ЗАГОЛОВКИ КОЛОНОК */
        .column-header {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--gray-text);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--gray-border);
        }
        
        /* КАТАЛОГ */
        .section-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8a99a8;
            margin: 14px 0 8px;
        }
        .section-label:first-child { margin-top: 0; }
        
        .category-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            max-height: 240px;
            overflow-y: auto;
        }
        .category-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: #2c3e50;
            transition: background 0.15s;
            border: 1px solid transparent;
        }
        .category-item:hover { background: #f0f2f5; }
        .category-item.active {
            background: var(--green-light);
            border-color: var(--green);
            color: var(--green-dark);
            font-weight: 600;
        }
        .category-item .icon {
            width: 20px;
            text-align: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        
        .divider {
            height: 1px;
            background: var(--gray-border);
            margin: 12px 0;
        }
        
        /* ВЫБОР ПОЗИЦИИ */
        .field-group {
            margin-bottom: 16px;
        }
        .field-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: #5b6e8c;
            margin-bottom: 4px;
        }
        .field-group select,
        .field-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--gray-border);
            border-radius: 8px;
            font-size: 14px;
            font-family: var(--font);
            background: var(--white);
        }
        .field-group select:focus,
        .field-group input:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 0 2px rgba(46,125,50,0.1);
        }
        
        /* ИНФО-БЛОК */
        .info-block {
            background: #f8f9fc;
            border: 1px solid var(--gray-border);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 16px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 13px;
        }
        .info-row .label { color: var(--gray-text); }
        .info-row .value { font-weight: 600; color: #1a2a3a; }
        .info-row .value.size-hint {
            background: var(--green-light);
            color: var(--green-dark);
            padding: 1px 8px;
            border-radius: 3px;
            font-size: 12px;
        }
        
        /* РАСЧЁТ */
        .calc-block {
            background: #f8f9fc;
            border: 1px solid var(--gray-border);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 16px;
        }
        .calc-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .calc-row .field-group {
            flex: 1;
            min-width: 100px;
            margin-bottom: 0;
        }
        .calc-hint {
            font-size: 11px;
            color: var(--gray-text);
            margin-top: 4px;
        }
        .calc-result {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #e0e4e8;
            text-align: right;
            font-size: 13px;
            color: var(--green-dark);
        }
        
        /* ИТОГО ЗА ПОЗИЦИЮ */
        .position-total {
            background: #f0fdf4;
            border: 1px solid #c8e6c9;
            border-radius: 8px;
            padding: 14px;
            text-align: center;
            margin-bottom: 12px;
        }
        .position-total .pt-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--green);
        }
        .position-total .pt-value {
            font-size: 26px;
            font-weight: 700;
            color: var(--green-dark);
        }
        
        /* КНОПКИ */
        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-family: var(--font);
            font-size: 14px;
            border: none;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .btn-primary {
            background: var(--green);
            color: white;
            width: 100%;
        }
        .btn-primary:hover { background: #1b5e20; }
        .btn-outline {
            background: white;
            border: 1px solid var(--green);
            color: var(--green);
        }
        .btn-outline:hover { background: var(--green-light); }
        .btn-sm { padding: 5px 12px; font-size: 12px; }
        .btn-danger { color: var(--red); border-color: var(--red); background: white; }
        .btn-danger:hover { background: #ffebee; }
        
        /* СМЕТА */
        .estimate-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 2px solid var(--gray-border);
            flex-shrink: 0;
        }
        .estimate-title {
            font-size: 15px;
            font-weight: 700;
            color: #1a2a3a;
        }
        .estimate-grand {
            font-size: 18px;
            font-weight: 700;
            color: var(--green-dark);
        }
        
        .estimate-table-wrap {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }
        .estimate-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .estimate-table th {
            text-align: left;
            padding: 8px 10px;
            background: #f8fafc;
            font-weight: 600;
            color: var(--green-dark);
            border-bottom: 1px solid var(--gray-border);
            position: sticky;
            top: 0;
            z-index: 1;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .estimate-table td {
            padding: 7px 10px;
            border-bottom: 1px solid #f0f2f5;
        }
        .estimate-table .even { background: #f8f9fc; }
        .estimate-table .odd { background: #ffffff; }
        .estimate-table .col-sum {
            text-align: right;
            font-weight: 600;
            white-space: nowrap;
        }
        .estimate-table .del-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #999;
            font-size: 16px;
            padding: 0 4px;
        }
        .estimate-table .del-btn:hover { color: var(--red); }
        
        .estimate-total-row td {
            background: var(--yellow);
            font-weight: 700;
            border-top: 1px solid var(--gray-border);
        }
        
        .estimate-empty {
            text-align: center;
            padding: 40px;
            color: #8a99a8;
            font-size: 13px;
        }
        
        .estimate-actions {
            padding: 12px 16px;
            border-top: 1px solid var(--gray-border);
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        
        /* АДАПТИВ */
        @media (max-width: 900px) {
            .main-layout { flex-direction: column; }
            .column-catalog { width: 100%; min-width: 0; max-height: 200px; }
            .column-params { min-width: 0; }
            .column-estimate { width: 100%; min-width: 0; max-height: 400px; }
            .header { padding: 0 12px; }
        }
    </style>
</head>
<body>

<header class="header">
    <span class="header-title">Конструктор сметы</span>
    <span class="header-status" id="dataStatus">
        <span class="status-dot loading"></span> Загрузка...
    </span>
</header>

<div class="main-layout">

    <!-- КОЛОНКА 1: КАТАЛОГ -->
    <div class="column column-catalog">
        <div class="section-label">Материалы</div>
        <div class="category-list" id="materialsList">
            <div style="color:#8a99a8; font-size:12px; padding:8px;">Загрузка...</div>
        </div>
        <div class="divider"></div>
        <div class="section-label">Работы и услуги</div>
        <div class="category-list" id="worksList">
            <div style="color:#8a99a8; font-size:12px; padding:8px;">Загрузка...</div>
        </div>
    </div>

    <!-- КОЛОНКА 2: ПАРАМЕТРЫ -->
    <div class="column column-params">
        <div class="column-header">Параметры позиции</div>

        <div class="field-group">
            <label>Позиция</label>
            <select id="itemSelect">
                <option value="">Сначала выберите категорию</option>
            </select>
        </div>

        <div id="infoBlock" class="info-block" style="display:none;">
            <div class="info-row">
                <span class="label">Размер (из таблицы)</span>
                <span class="value size-hint" id="sizeValue">—</span>
            </div>
            <div class="info-row">
                <span class="label">Единица измерения</span>
                <span class="value" id="unitValue">—</span>
            </div>
            <div class="info-row">
                <span class="label">Цена за единицу</span>
                <span class="value" id="priceValue">—</span>
            </div>
            <div class="info-row" id="supplierRow" style="display:none;">
                <span class="label">Поставщик</span>
                <span class="value" id="supplierValue">—</span>
            </div>
            <div class="info-row" id="siteRow" style="display:none;">
                <span class="label">Сайт</span>
                <span class="value" id="siteValue">—</span>
            </div>
        </div>

        <div id="calcBlock" class="calc-block" style="display:none;">
            <div class="calc-row" id="calcFields"></div>
            <div class="calc-result" id="calcResult"></div>
        </div>

        <div class="position-total">
            <div class="pt-label">Сумма за позицию</div>
            <div class="pt-value" id="rowTotal">0 ₽</div>
        </div>

        <button class="btn btn-primary" onclick="addToEstimate()">Добавить в смету</button>
    </div>

    <!-- КОЛОНКА 3: СМЕТА -->
    <div class="column column-estimate">
        <div class="estimate-header-row">
            <span class="estimate-title">Смета</span>
            <span class="estimate-grand" id="totalEstimate">0 ₽</span>
        </div>
        <div class="estimate-table-wrap">
            <table class="estimate-table">
                <thead>
                    <tr>
                        <th>Тип</th>
                        <th>Наименование</th>
                        <th>Расчёт</th>
                        <th>Ед.</th>
                        <th>Кол-во</th>
                        <th>Цена/ед</th>
                        <th>Сумма</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="estimateBody">
                    <tr><td colspan="8" class="estimate-empty">Смета пуста. Добавьте позиции.</td></tr>
                </tbody>
            </table>
        </div>
        <div class="estimate-actions">
            <button class="btn btn-outline btn-sm" onclick="exportToXLSX()">Экспорт в Excel</button>
            <button class="btn btn-outline btn-sm" onclick="copyEstimate()">Копировать</button>
            <button class="btn btn-danger btn-sm" onclick="clearEstimate()">Очистить</button>
        </div>
    </div>

</div>

<script>
// ============================================================
// УТИЛИТЫ
// ============================================================
function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

function parsePrice(value) {
    if (value === undefined || value === null || value === '') return 0;
    if (typeof value === 'number') return value;
    let s = String(value).trim().replace(/\s/g, '').replace(',', '.');
    let num = parseFloat(s);
    return isNaN(num) ? 0 : num;
}

function getCategoryIcon(category) {
    const icons = {
        'Листовые материалы': 'L', 'Профиль металлический': 'P',
        'Профиль алюминиевый': 'A', 'Нержавеющая сталь': 'S',
        'Пленки': 'F', 'Светотехника': 'Lt', 'Обнарядка': 'O',
        'Работы': 'W', 'Подряд': 'C', 'Монтаж': 'M', 'Транспорт': 'T'
    };
    return icons[category] || '•';
}

// ============================================================
// ЗАГРУЗКА ДАННЫХ
// ============================================================
const SPREADSHEET_ID = "1OhoJYlXsYiJDdCF_ET7gkNKg21juUI5ENo-haz6wcR4";
const SHEET1_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=Лист1`;
const SHEET2_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=Лист2`;

let catalog = { materials: [], works: [] };
let dataLoaded = false;

function setDataStatus(status, text) {
    const el = document.getElementById('dataStatus');
    el.innerHTML = `<span class="status-dot ${status}"></span> ${text}`;
}

function loadAllData() {
    setDataStatus('loading', 'Загрузка...');
    
    Promise.all([
        fetch(SHEET1_URL).then(r => r.text()),
        fetch(SHEET2_URL).then(r => r.text())
    ])
    .then(([text1, text2]) => {
        // Лист1 — Материалы
        const json1 = JSON.parse(text1.substring(47, text1.length - 2));
        const rows1 = json1.table.rows;
        catalog.materials = [];
        
        for (let i = 0; i < rows1.length; i++) {
            const row = rows1[i].c;
            if (!row || !row[0] || !row[0].v) continue;
            const group = String(row[0]?.v || '').trim();
            if (!group) continue;
            
            catalog.materials.push({
                group: group,
                name: String(row[1]?.v || '').trim(),
                unit: String(row[3]?.v || '').trim(),
                price: parsePrice(row[4]?.v),
                size: String(row[5]?.v || '').trim(),
                supplier: String(row[7]?.v || '').trim(),
                site: String(row[8]?.v || '').trim()
            });
        }
        
        // Лист2 — Работы и услуги
        const json2 = JSON.parse(text2.substring(47, text2.length - 2));
        const rows2 = json2.table.rows;
        catalog.works = [];
        
        for (let i = 0; i < rows2.length; i++) {
            const row = rows2[i].c;
            if (!row || !row[0] || !row[0].v) continue;
            const group = String(row[0]?.v || '').trim();
            if (!group) continue;
            
            catalog.works.push({
                group: group,
                name: String(row[1]?.v || '').trim(),
                unit: String(row[2]?.v || '').trim(),
                price: parsePrice(row[3]?.v),
                note: String(row[4]?.v || '').trim(),
                size: '',
                supplier: '',
                site: ''
            });
        }
        
        console.log('Загружено: материалов', catalog.materials.length, ', работ', catalog.works.length);
        dataLoaded = true;
        setDataStatus('online', 'Готово');
        initConstructor();
        preloadExcelJS();
    })
    .catch(error => {
        console.error('Ошибка загрузки:', error);
        setDataStatus('offline', 'Ошибка загрузки');
        document.getElementById('materialsList').innerHTML = '<div style="color:red;font-size:12px;padding:8px;">Ошибка</div>';
        document.getElementById('worksList').innerHTML = '<div style="color:red;font-size:12px;padding:8px;">Ошибка</div>';
    });
}

function preloadExcelJS() {
    if (typeof ExcelJS === 'undefined' && !document.getElementById('exceljs-script')) {
        const s = document.createElement('script');
        s.id = 'exceljs-script';
        s.src = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
        document.head.appendChild(s);
    }
}

// ============================================================
// КОНСТРУКТОР
// ============================================================
let materialCategories = [], workCategories = [];
let currentType = null, currentCategory = null, currentItems = [], currentItem = null;
let estimateItems = [];

function initConstructor() {
    const matSet = new Set();
    catalog.materials.forEach(i => { if (i.group) matSet.add(i.group); });
    materialCategories = Array.from(matSet).sort();
    
    const workSet = new Set();
    catalog.works.forEach(i => { if (i.group) workSet.add(i.group); });
    workCategories = Array.from(workSet).sort();
    
    renderCategories();
    loadEstimateFromStorage();
}

function renderCategories() {
    const mDiv = document.getElementById('materialsList');
    mDiv.innerHTML = '';
    materialCategories.forEach(cat => {
        const div = document.createElement('div');
        div.className = 'category-item';
        div.innerHTML = `<span class="icon">${getCategoryIcon(cat)}</span>${cat}`;
        div.onclick = () => selectCategory('material', cat);
        mDiv.appendChild(div);
    });
    
    const wDiv = document.getElementById('worksList');
    wDiv.innerHTML = '';
    workCategories.forEach(cat => {
        const div = document.createElement('div');
        div.className = 'category-item';
        div.innerHTML = `<span class="icon">${getCategoryIcon(cat)}</span>${cat}`;
        div.onclick = () => selectCategory('work', cat);
        wDiv.appendChild(div);
    });
    
    resetForm();
}

function resetForm() {
    currentType = null;
    currentCategory = null;
    currentItems = [];
    currentItem = null;
    document.getElementById('itemSelect').innerHTML = '<option value="">Сначала выберите категорию</option>';
    document.getElementById('infoBlock').style.display = 'none';
    document.getElementById('calcBlock').style.display = 'none';
    document.getElementById('rowTotal').innerHTML = '0 ₽';
    document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active'));
}

function selectCategory(type, category) {
    currentType = type;
    currentCategory = category;
    
    document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active'));
    const allItems = document.querySelectorAll(type === 'material' ? '#materialsList .category-item' : '#worksList .category-item');
    allItems.forEach(el => {
        if (el.textContent.trim() === category) el.classList.add('active');
    });
    
    currentItems = [];
    const source = type === 'material' ? catalog.materials : catalog.works;
    source.forEach(item => {
        if (item.group === category) currentItems.push({ ...item, itemType: type });
    });
    
    const select = document.getElementById('itemSelect');
    select.innerHTML = '<option value="">Выберите позицию</option>';
    currentItems.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.name;
        opt.textContent = item.name;
        opt.dataset.unit = item.unit || '';
        opt.dataset.price = item.price || 0;
        opt.dataset.size = item.size || '';
        opt.dataset.supplier = item.supplier || '';
        opt.dataset.site = item.site || '';
        select.appendChild(opt);
    });
    
    document.getElementById('infoBlock').style.display = 'none';
    document.getElementById('calcBlock').style.display = 'none';
    document.getElementById('rowTotal').innerHTML = '0 ₽';
    currentItem = null;
}

function fillDetails() {
    const select = document.getElementById('itemSelect');
    const opt = select.options[select.selectedIndex];
    if (!opt || !opt.value) return;
    
    const selected = currentItems.find(item => item.name === opt.value);
    if (!selected) return;
    
    document.getElementById('infoBlock').style.display = 'block';
    document.getElementById('sizeValue').innerHTML = selected.size || '—';
    document.getElementById('unitValue').innerHTML = selected.unit || '—';
    document.getElementById('priceValue').innerHTML = selected.price
        ? selected.price.toLocaleString('ru-RU') + ' ₽/' + (selected.unit || 'ед.') : '—';
    
    const suppRow = document.getElementById('supplierRow');
    const siteRow = document.getElementById('siteRow');
    if (selected.supplier) {
        suppRow.style.display = 'flex';
        document.getElementById('supplierValue').innerHTML = selected.supplier;
    } else {
        suppRow.style.display = 'none';
    }
    if (selected.site) {
        siteRow.style.display = 'flex';
        const siteVal = document.getElementById('siteValue');
        if (selected.site.startsWith('http')) {
            siteVal.innerHTML = `<a href="${selected.site}" target="_blank" style="color:#2e7d32;">открыть</a>`;
        } else {
            siteVal.innerHTML = selected.site;
        }
    } else {
        siteRow.style.display = 'none';
    }
    
    currentItem = {
        type: currentType === 'material' ? 'Материал' : 'Работа',
        category: currentCategory,
        name: selected.name,
        unit: selected.unit || 'ед.',
        price: parseFloat(selected.price) || 0,
        size: selected.size || '',
        supplier: selected.supplier || '',
        site: selected.site || ''
    };
    
    buildCalcInterface();
}

function getCalcType(unit) {
    const u = (unit || '').toLowerCase();
    if (u.includes('м²') || u.includes('м.кв') || u.includes('кв.м')) return 'area';
    if (u.includes('м.п') || u === 'м' || u.includes('пог.м')) return 'length';
    return 'piece';
}

function buildCalcInterface() {
    const calcBlock = document.getElementById('calcBlock');
    const calcFields = document.getElementById('calcFields');
    if (!currentItem) return;
    
    const calcType = getCalcType(currentItem.unit);
    let html = '';
    const unitLabel = currentItem.unit || 'ед.';
    
    if (calcType === 'area') {
        html = `
            <div class="field-group">
                <label>Площадь (м²)</label>
                <input type="number" id="calcQty" value="1" step="0.01" min="0.01" placeholder="Сколько м² нужно">
                <div class="calc-hint">Введите нужную площадь в м²</div>
            </div>
        `;
    } else if (calcType === 'length') {
        html = `
            <div class="field-group">
                <label>Длина (м)</label>
                <input type="number" id="calcQty" value="1" step="0.1" min="0.1" placeholder="Сколько метров нужно">
                <div class="calc-hint">Введите нужную длину в метрах</div>
            </div>
        `;
    } else {
        html = `
            <div class="field-group">
                <label>Количество (${unitLabel})</label>
                <input type="number" id="calcQty" value="1" step="1" min="1" placeholder="Сколько нужно">
                <div class="calc-hint">Введите нужное количество</div>
            </div>
        `;
    }
    
    if (currentItem.size) {
        html += `<div style="font-size:11px;color:#6c7a8a;margin-top:6px;">Размер единицы: ${currentItem.size}</div>`;
    }
    
    calcFields.innerHTML = html;
    calcBlock.style.display = 'block';
    
    document.getElementById('calcQty')?.addEventListener('input', calculateTotal);
    calculateTotal();
}

function calculateTotal() {
    if (!currentItem) return 0;
    
    const qty = parseFloat(document.getElementById('calcQty')?.value) || 0;
    const total = qty * currentItem.price;
    const unitLabel = currentItem.unit || 'ед.';
    
    let calcText = '';
    const calcType = getCalcType(currentItem.unit);
    if (calcType === 'area') {
        calcText = `${qty.toFixed(2)} м² × ${currentItem.price.toFixed(2)} ₽/м² = ${total.toFixed(2)} ₽`;
    } else if (calcType === 'length') {
        calcText = `${qty.toFixed(1)} м × ${currentItem.price.toFixed(2)} ₽/м = ${total.toFixed(2)} ₽`;
    } else {
        calcText = `${qty} ${unitLabel} × ${currentItem.price.toFixed(2)} ₽ = ${total.toFixed(2)} ₽`;
    }
    
    document.getElementById('rowTotal').innerHTML = total.toFixed(2).replace('.', ',') + ' ₽';
    const calcResult = document.getElementById('calcResult');
    if (calcResult) calcResult.innerHTML = calcText;
    
    return { total, quantity: qty, calcText };
}

function addToEstimate() {
    if (!currentItem || !currentItem.name) { alert('Выберите позицию'); return; }
    
    const calc = calculateTotal();
    if (calc.total === 0) { alert('Укажите количество'); return; }
    
    const qty = calc.quantity;
    let calcTextShort = '';
    const calcType = getCalcType(currentItem.unit);
    if (calcType === 'area') calcTextShort = `${qty.toFixed(2)} м²`;
    else if (calcType === 'length') calcTextShort = `${qty.toFixed(1)} м`;
    else calcTextShort = `${qty} ${currentItem.unit || 'ед.'}`;
    
    estimateItems.push({
        type: currentItem.type,
        category: currentItem.category,
        name: currentItem.name,
        calcText: calcTextShort,
        unit: currentItem.unit || 'ед.',
        quantity: qty,
        price: currentItem.price,
        total: calc.total
    });
    
    renderEstimate();
    document.getElementById('rowTotal').innerHTML = '0 ₽';
}

function renderEstimate() {
    const tbody = document.getElementById('estimateBody');
    tbody.innerHTML = '';
    let grand = 0;
    
    if (estimateItems.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="estimate-empty">Смета пуста. Добавьте позиции.</td></tr>';
        document.getElementById('totalEstimate').innerHTML = '0 ₽';
        return;
    }
    
    // Группируем
    const materials = estimateItems.filter(i => i.type === 'Материал');
    const works = estimateItems.filter(i => i.type === 'Работа');
    
    let matsSum = 0, worksSum = 0;
    
    if (materials.length > 0) {
        const headerRow = tbody.insertRow();
        headerRow.insertCell(0).innerHTML = '<strong>МАТЕРИАЛЫ</strong>';
        headerRow.insertCell(0).colSpan = 8;
        headerRow.cells[0].style.cssText = 'background:#e8f5e9;font-weight:700;font-size:12px;color:#1a5d2a;padding:8px 10px;';
        
        materials.forEach((item, idx) => {
            matsSum += item.total;
            const row = tbody.insertRow();
            row.className = idx % 2 === 0 ? 'even' : 'odd';
            row.insertCell(0).innerHTML = item.type;
            row.insertCell(1).innerHTML = item.name;
            row.insertCell(2).innerHTML = item.calcText;
            row.insertCell(3).innerHTML = item.unit;
            row.insertCell(4).innerHTML = item.quantity;
            row.insertCell(5).innerHTML = item.price.toFixed(2).replace('.', ',') + ' ₽';
            row.insertCell(6).innerHTML = item.total.toFixed(2).replace('.', ',') + ' ₽';
            row.insertCell(6).className = 'col-sum';
            const delCell = row.insertCell(7);
            delCell.innerHTML = '<button class="del-btn">×</button>';
            delCell.querySelector('button').onclick = () => {
                const realIdx = estimateItems.indexOf(item);
                if (realIdx >= 0) { estimateItems.splice(realIdx, 1); renderEstimate(); }
            };
        });
        
        const totalRow = tbody.insertRow();
        totalRow.className = 'estimate-total-row';
        totalRow.insertCell(0).innerHTML = '';
        totalRow.insertCell(0).colSpan = 5;
        totalRow.insertCell(1).innerHTML = '';
        totalRow.insertCell(2).innerHTML = '';
        totalRow.insertCell(3).innerHTML = '';
        totalRow.insertCell(4).innerHTML = '';
        totalRow.insertCell(5).innerHTML = '<strong>Итого материалы:</strong>';
        totalRow.insertCell(5).style.textAlign = 'right';
        totalRow.insertCell(6).innerHTML = '<strong>' + matsSum.toFixed(2).replace('.', ',') + ' ₽</strong>';
        totalRow.insertCell(6).className = 'col-sum';
        totalRow.insertCell(7).innerHTML = '';
    }
    
    if (works.length > 0) {
        if (materials.length > 0) {
            const spacer = tbody.insertRow();
            spacer.insertCell(0).colSpan = 8;
            spacer.cells[0].style.height = '8px';
        }
        
        const headerRow = tbody.insertRow();
        headerRow.insertCell(0).innerHTML = '<strong>РАБОТЫ И УСЛУГИ</strong>';
        headerRow.insertCell(0).colSpan = 8;
        headerRow.cells[0].style.cssText = 'background:#e8f5e9;font-weight:700;font-size:12px;color:#1a5d2a;padding:8px 10px;';
        
        works.forEach((item, idx) => {
            worksSum += item.total;
            const row = tbody.insertRow();
            row.className = idx % 2 === 0 ? 'even' : 'odd';
            row.insertCell(0).innerHTML = item.type;
            row.insertCell(1).innerHTML = item.name;
            row.insertCell(2).innerHTML = item.calcText;
            row.insertCell(3).innerHTML = item.unit;
            row.insertCell(4).innerHTML = item.quantity;
            row.insertCell(5).innerHTML = item.price.toFixed(2).replace('.', ',') + ' ₽';
            row.insertCell(6).innerHTML = item.total.toFixed(2).replace('.', ',') + ' ₽';
            row.insertCell(6).className = 'col-sum';
            const delCell = row.insertCell(7);
            delCell.innerHTML = '<button class="del-btn">×</button>';
            delCell.querySelector('button').onclick = () => {
                const realIdx = estimateItems.indexOf(item);
                if (realIdx >= 0) { estimateItems.splice(realIdx, 1); renderEstimate(); }
            };
        });
        
        const totalRow = tbody.insertRow();
        totalRow.className = 'estimate-total-row';
        totalRow.insertCell(0).innerHTML = '';
        totalRow.insertCell(0).colSpan = 5;
        totalRow.insertCell(5).innerHTML = '<strong>Итого работы:</strong>';
        totalRow.insertCell(5).style.textAlign = 'right';
        totalRow.insertCell(6).innerHTML = '<strong>' + worksSum.toFixed(2).replace('.', ',') + ' ₽</strong>';
        totalRow.insertCell(6).className = 'col-sum';
        totalRow.insertCell(7).innerHTML = '';
    }
    
    grand = matsSum + worksSum;
    document.getElementById('totalEstimate').innerHTML = grand.toFixed(2).replace('.', ',') + ' ₽';
    localStorage.setItem('estimate', JSON.stringify(estimateItems));
}

function loadEstimateFromStorage() {
    const saved = localStorage.getItem('estimate');
    if (saved) {
        try { estimateItems = JSON.parse(saved); renderEstimate(); } catch(e) {}
    }
}

function copyEstimate() {
    if (estimateItems.length === 0) { alert('Смета пуста'); return; }
    
    let text = 'Тип\tНаименование\tРасчёт\tЕд.изм\tКол-во\tЦена/ед\tСумма\n';
    estimateItems.forEach(item => {
        text += [
            item.type,
            item.name,
            item.calcText,
            item.unit,
            item.quantity,
            item.price.toFixed(2),
            item.total.toFixed(2)
        ].join('\t') + '\n';
    });
    const grand = estimateItems.reduce((s, i) => s + i.total, 0);
    text += `\nИТОГО:\t\t\t\t\t${grand.toFixed(2)} ₽`;
    
    navigator.clipboard.writeText(text).then(() => {
        alert('Смета скопирована в буфер');
    }).catch(() => {
        alert('Не удалось скопировать');
    });
}

function clearEstimate() {
    if (confirm('Очистить смету?')) {
        estimateItems = [];
        renderEstimate();
    }
}

function exportToXLSX() {
    if (estimateItems.length === 0) { alert('Смета пуста'); return; }
    
    if (typeof ExcelJS === 'undefined') {
        alert('Компонент экспорта загружается. Попробуйте через пару секунд.');
        return;
    }
    
    exportToXLSX_do();
}

async function exportToXLSX_do() {
    const workbook = new ExcelJS.Workbook();
    const sheet = workbook.addWorksheet('Смета', { views: [{ showGridLines: false }] });
    
    sheet.columns = [
        { width: 12 }, { width: 30 }, { width: 20 },
        { width: 10 }, { width: 10 }, { width: 14 }, { width: 16 }
    ];

    titleRow.getCell(1).value = 'Смета от ' + new Date().toLocaleString('ru-RU');
    titleRow.getCell(1).font = { bold: true, size: 14, color: { argb: 'FF1A5D2A' } };
    sheet.mergeCells(rowNum, 1, rowNum, 7);
    titleRow.height = 28;
    rowNum++;
    
    // Шапка
    const headers = ['Тип', 'Наименование', 'Расчёт', 'Ед.', 'Кол-во', 'Цена/ед', 'Сумма'];
    const headerRow = sheet.getRow(rowNum);
    headers.forEach((h, i) => {
        headerRow.getCell(i + 1).value = h;
        headerRow.getCell(i + 1).font = { bold: true, color: { argb: 'FFFFFFFF' }, size: 10 };
        headerRow.getCell(i + 1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2E7D32' } };
        headerRow.getCell(i + 1).alignment = { horizontal: 'center', vertical: 'middle' };
        headerRow.getCell(i + 1).border = {
            top: { style: 'thin' }, bottom: { style: 'thin' },
            left: { style: 'thin' }, right: { style: 'thin' }
        };
    });
    headerRow.height = 24;
    rowNum++;
    
    let matsSum = 0, worksSum = 0;
    
    if (materials.length > 0) {
        const sr = sheet.getRow(rowNum);
        sr.getCell(1).value = 'МАТЕРИАЛЫ';
        sr.getCell(1).font = { bold: true, size: 11, color: { argb: 'FF1A5D2A' } };
        sr.getCell(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFC8E6C9' } };
        sheet.mergeCells(rowNum, 1, rowNum, 7);
        applyBorder(sr, 1, 7);
        sr.height = 22;
        rowNum++;
        
        materials.forEach((item, idx) => {
            matsSum += item.total;
            const row = sheet.getRow(rowNum);
            const bg = idx % 2 === 0 ? 'FFFFFFFF' : 'FFF5F5F5';
            const vals = [item.type, item.name, item.calcText, item.unit, item.quantity,
                item.price.toFixed(2).replace('.',',')+' ₽', item.total.toFixed(2).replace('.',',')+' ₽'];
            vals.forEach((v, i) => {
                row.getCell(i + 1).value = v;
                row.getCell(i + 1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: bg } };
                row.getCell(i + 1).alignment = { vertical: 'middle', horizontal: (i >= 4) ? 'right' : 'left' };
                row.getCell(i + 1).border = {
                    top: { style: 'thin' }, bottom: { style: 'thin' },
                    left: { style: 'thin' }, right: { style: 'thin' }
                };
            });
            row.getCell(7).font = { bold: true };
            row.height = 20;
            rowNum++;
        });
        
        const tr = sheet.getRow(rowNum);
        sheet.mergeCells(rowNum, 1, rowNum, 5);
        tr.getCell(6).value = 'Итого материалы:';
        tr.getCell(7).value = matsSum.toFixed(2).replace('.',',')+' ₽';
        [6,7].forEach(i => {
            tr.getCell(i).font = { bold: true };
            tr.getCell(i).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFF9C4' } };
            tr.getCell(i).alignment = { horizontal: 'right', vertical: 'middle' };
            tr.getCell(i).border = {
                top: { style: 'thin' }, bottom: { style: 'thin' },
                left: { style: 'thin' }, right: { style: 'thin' }
            };
        });
        applyBorder(tr, 1, 5);
        tr.height = 22;
        rowNum++;
    }
    
    if (works.length > 0) {
        rowNum++;
        const sr = sheet.getRow(rowNum);

        sr.getCell(1).font = { bold: true, size: 11, color: { argb: 'FF1A5D2A' } };

        sheet.mergeCells(rowNum, 1, rowNum, 7);
        applyBorder(sr, 1, 7);
        sr.height = 22;
        rowNum++;
        
        works.forEach((item, idx) => {
            worksSum += item.total;
            const row = sheet.getRow(rowNum);
            const bg = idx % 2 === 0 ? 'FFFFFFFF' : 'FFF5F5F5';
            const vals = [item.type, item.name, item.calcText, item.unit, item.quantity,
                item.price.toFixed(2).replace('.',',')+' ₽', item.total.toFixed(2).replace('.',',')+' ₽'];

            };

        tr.height = 22;

    }
    
    // Общий итог
    rowNum++;
    const grand = matsSum + worksSum;

    gr.getCell(6).value = 'ВСЕГО:';

            left: { style: 'thin' }, right: { style: 'thin' }
        };
    });
    applyBorder(gr, 1, 5);
    gr.height = 26;
    
    const buffer = await workbook.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `smeta_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.xlsx`;
    link.click();
    URL.revokeObjectURL(link.href);
}

function applyBorder(row, fromCol, toCol) {
    for (let i = fromCol; i <= toCol; i++) {
        row.getCell(i).border = {
            top: { style: 'thin' }, bottom: { style: 'thin' },
            left: { style: 'thin' }, right: { style: 'thin' }
        };
    }
}
