<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Конструктор сметы</title>
    <style>
        :root {
            --green: #2e7d32;
            --green-dark: #1a5d2a;
            --green-light: #c8e6c9;
            --yellow: #fff9c4;
            --orange: #ffcc02;
            --gray-bg: #f5f7fb;
            --gray-border: #b0b8c0;
            --gray-text: #4a5568;
            --white: #ffffff;
            --red: #b71c1c;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            
            /* Базовые размеры */
            --fs-xs: 12px;
            --fs-sm: 14px;
            --fs-md: 16px;
            --fs-lg: 20px;
            --fs-xl: 28px;
            --fs-title: 20px;
            
            /* Отступы */
            --pad-cell: 10px 14px;
            --pad-btn: 12px 24px;
            --gap: 12px;
        }
        
        /* Крупный режим */
        body.large-mode {
            --fs-xs: 15px;
            --fs-sm: 17px;
            --fs-md: 19px;
            --fs-lg: 24px;
            --fs-xl: 34px;
            --fs-title: 24px;
            --pad-cell: 14px 18px;
            --pad-btn: 16px 28px;
            --gap: 16px;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--gray-bg);
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-size: var(--fs-sm);
        }
        
        /* ШАПКА */
        .header {
            background: var(--white);
            border-bottom: 2px solid var(--gray-border);
            padding: 0 24px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .header-title {
            font-size: var(--fs-title);
            font-weight: 700;
            color: #1a1a1a;
        }
        .header-status {
            font-size: var(--fs-xs);
            color: var(--gray-text);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .status-dot.online { background: #4caf50; }
        .status-dot.offline { background: #f44336; }
        .status-dot.loading { background: #ff9800; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        
        .btn-icon {
            background: #f0f0f0;
            border: 1px solid var(--gray-border);
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: var(--fs-xs);
            font-family: var(--font);
            white-space: nowrap;
            transition: background 0.15s;
        }
        .btn-icon:hover { background: #e0e0e0; }
        .btn-icon.active { background: #1a1a1a; color: white; border-color: #1a1a1a; }
        
        /* ОСНОВНОЙ БЛОК */
        .main-layout {
            display: flex;
            flex: 1;
            gap: 2px;
            background: var(--gray-border);
            overflow: hidden;
        }
        
        .column {
            background: var(--white);
            overflow-y: auto;
        }
        .column-catalog {
            width: 270px;
            min-width: 220px;
            flex-shrink: 0;
            padding: 16px var(--gap);
        }
        .column-params {
            flex: 1;
            min-width: 320px;
            padding: 20px 24px;
        }
        .column-estimate {
            flex: 1.8;
            min-width: 440px;
            display: flex;
            flex-direction: column;
        }
        
        .column-header {
            font-size: var(--fs-xs);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--gray-text);
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--gray-border);
        }
        
        .section-label {
            font-size: var(--fs-xs);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #666;
            margin: 16px 0 8px;
        }
        .section-label:first-child { margin-top: 0; }
        
        .category-list { display: flex; flex-direction: column; gap: 3px; }
        .category-item {
            display: flex; align-items: center; gap: 8px;
            padding: var(--pad-cell); border-radius: 6px;
            cursor: pointer; font-size: var(--fs-sm); color: #1a1a1a;
            transition: background 0.15s; border: 1px solid transparent;
            font-weight: 500;
        }
        .category-item:hover { background: #f0f0f0; }
        .category-item.active {
            background: #e0e0e0; border-color: #1a1a1a; font-weight: 700;
        }
        
        .divider { height: 1px; background: var(--gray-border); margin: 14px 0; }
        
        .field-group { margin-bottom: 18px; }
        .field-group label {
            display: block; font-size: var(--fs-xs); font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--gray-text); margin-bottom: 6px;
        }
        .field-group select, .field-group input {
            width: 100%; padding: var(--pad-cell); border: 2px solid var(--gray-border);
            border-radius: 8px; font-size: var(--fs-md); font-family: var(--font);
            background: var(--white); color: #1a1a1a;
        }
        .field-group select:focus, .field-group input:focus {
            outline: none; border-color: #1a1a1a;
        }
        
        .info-block {
            background: #f5f5f5; border: 1px solid var(--gray-border);
            border-radius: 8px; padding: 14px 16px; margin-bottom: 18px;
        }
        .info-row {
            display: flex; justify-content: space-between;
            padding: 6px 0; font-size: var(--fs-sm);
        }
        .info-row .label { color: var(--gray-text); font-weight: 500; }
        .info-row .value { font-weight: 700; color: #1a1a1a; }
        .info-row .value.size-hint {
            background: #e0e0e0; color: #1a1a1a;
            padding: 2px 10px; border-radius: 4px; font-size: var(--fs-xs);
            font-weight: 600;
        }
        
        .calc-block {
            background: #f5f5f5; border: 1px solid var(--gray-border);
            border-radius: 8px; padding: 16px; margin-bottom: 18px;
        }
        .calc-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
        .calc-row .field-group { flex: 1; min-width: 120px; margin-bottom: 0; }
        .calc-hint { font-size: var(--fs-xs); color: var(--gray-text); margin-top: 6px; }
        .calc-result {
            margin-top: 14px; padding-top: 12px;
            border-top: 1px solid var(--gray-border);
            text-align: right; font-size: var(--fs-sm); font-weight: 600;
        }
        
        .position-total {
            background: #f5f5f5; border: 2px solid #1a1a1a;
            border-radius: 8px; padding: 16px; text-align: center; margin-bottom: 14px;
        }
        .position-total .pt-label {
            font-size: var(--fs-xs); font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .position-total .pt-value {
            font-size: var(--fs-xl); font-weight: 800; color: #1a1a1a;
        }
        
        .btn {
            padding: var(--pad-btn); border-radius: 6px; font-weight: 700;
            cursor: pointer; font-family: var(--font); font-size: var(--fs-md);
            border: 2px solid transparent; transition: all 0.15s; white-space: nowrap;
        }
        .btn-primary { background: #1a1a1a; color: white; width: 100%; }
        .btn-primary:hover { background: #333; }
        .btn-outline { background: white; border-color: #1a1a1a; color: #1a1a1a; }
        .btn-outline:hover { background: #f0f0f0; }
        .btn-sm { padding: 8px 16px; font-size: var(--fs-sm); }
        .btn-danger { color: var(--red); border-color: var(--red); background: white; }
        .btn-danger:hover { background: #faf0f0; }
        
        /* ТАБЛИЦА СМЕТЫ */
        .estimate-header-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; border-bottom: 2px solid var(--gray-border); flex-shrink: 0;
        }
        .estimate-title { font-size: var(--fs-lg); font-weight: 700; }
        .estimate-grand { font-size: var(--fs-lg); font-weight: 800; }
        
        .estimate-table-wrap { flex: 1; overflow-y: auto; padding: 0; }
        .estimate-table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
        .estimate-table th {
            text-align: left; padding: var(--pad-cell); background: #e8e8e8;
            font-weight: 700; color: #1a1a1a;
            border-bottom: 2px solid var(--gray-border);
            position: sticky; top: 0; z-index: 1;
            font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.5px;
        }
        .estimate-table th.col-right { text-align: right; }
        
        .estimate-table td {
            padding: var(--pad-cell); border-bottom: 1px solid #e0e0e0; vertical-align: middle;
        }
        .estimate-table .even { background: #fafafa; }
        .estimate-table .odd { background: #ffffff; }
        .estimate-table .col-right { text-align: right; white-space: nowrap; }
        .estimate-table .col-bold { font-weight: 700; }
        .estimate-table .del-btn {
            background: none; border: none; cursor: pointer;
            color: #999; font-size: 18px; padding: 0 6px; line-height: 1;
            font-weight: 700;
        }
        .estimate-table .del-btn:hover { color: #000; }
        
        .section-row td {
            background: #d5d5d5; font-weight: 700; font-size: var(--fs-xs);
            padding: 8px var(--pad-cell); text-transform: uppercase;
            letter-spacing: 0.8px; border-bottom: 2px solid #aaa;
        }
        .subtotal-row td {
            background: #e8e0c0; font-weight: 700; font-size: var(--fs-sm);
            border-top: 1px solid #c0b890; border-bottom: 1px solid #c0b890;
        }
        .grand-row td {
            background: #d0c8a0; font-weight: 800; font-size: var(--fs-md);
            border-top: 2px solid #999; border-bottom: 2px solid #999;
        }
        
        .estimate-empty { text-align: center; padding: 40px; color: #888; font-size: var(--fs-sm); }
        
        .estimate-actions {
            padding: 14px 20px; border-top: 2px solid var(--gray-border);
            display: flex; gap: var(--gap); flex-wrap: wrap; flex-shrink: 0;
        }
        
        /* МОБИЛЬНАЯ */
        @media (max-width: 900px) {
            .main-layout { flex-direction: column; overflow: visible; }
            .column-catalog { width: 100%; min-width: 0; max-height: none; padding: 12px; }
            .category-list { flex-direction: row; flex-wrap: wrap; gap: 4px; }
            .category-item { font-size: var(--fs-xs); padding: 8px 12px; white-space: nowrap; }
            .column-params { min-width: 0; padding: 12px; }
            .column-estimate { min-width: 0; flex: 1; }
            .header { padding: 0 12px; height: 52px; }
            .header-title { font-size: var(--fs-md); }
            .estimate-table { font-size: var(--fs-xs); }
            .estimate-actions { flex-direction: column; }
            .btn-sm { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-left">
        <span class="header-title">Конструктор сметы</span>
        <span class="header-status" id="dataStatus">
            <span class="status-dot loading"></span> Загрузка...
        </span>
    </div>
    <div class="header-right">
        <button class="btn-icon" id="btnLarge" onclick="toggleLargeMode()" title="Крупный шрифт">
            A<span style="font-size:1.3em;">A</span>
        </button>
    </div>
</header>

<div class="main-layout">

    <!-- КАТАЛОГ -->
    <div class="column column-catalog">
        <div class="section-label">Материалы</div>
        <div class="category-list" id="materialsList">
            <div style="color:#888; padding:8px;">Загрузка...</div>
        </div>
        <div class="divider"></div>
        <div class="section-label">Работы и услуги</div>
        <div class="category-list" id="worksList">
            <div style="color:#888; padding:8px;">Загрузка...</div>
        </div>
    </div>

    <!-- ПАРАМЕТРЫ -->
    <div class="column column-params">
        <div class="column-header">Параметры позиции</div>

        <div class="field-group">
            <label>Позиция</label>
            <select id="itemSelect">
                <option value="">Сначала выберите категорию</option>
            </select>
        </div>

        <div id="infoBlock" class="info-block" style="display:none;">
            <div class="info-row"><span class="label">Размер</span><span class="value size-hint" id="sizeValue">—</span></div>
            <div class="info-row"><span class="label">Ед. измерения</span><span class="value" id="unitValue">—</span></div>
            <div class="info-row"><span class="label">Цена за ед.</span><span class="value" id="priceValue">—</span></div>
            <div class="info-row" id="supplierRow" style="display:none;"><span class="label">Поставщик</span><span class="value" id="supplierValue">—</span></div>
            <div class="info-row" id="siteRow" style="display:none;"><span class="label">Сайт</span><span class="value" id="siteValue">—</span></div>
        </div>

        <div id="calcBlock" class="calc-block" style="display:none;">
            <div class="calc-row" id="calcFields"></div>
            <div class="calc-result" id="calcResult"></div>
        </div>

        <div class="position-total">
            <div class="pt-label">Сумма за позицию</div>
            <div class="pt-value" id="rowTotal">0 ₽</div>
        </div>

        <button class="btn btn-primary" onclick="addToEstimate()">Добавить в смету</button>
    </div>

    <!-- СМЕТА -->
    <div class="column column-estimate">
        <div class="estimate-header-row">
            <span class="estimate-title">Смета</span>
            <span class="estimate-grand" id="totalEstimate">0 ₽</span>
        </div>
        <div class="estimate-table-wrap">
            <table class="estimate-table">
                <thead>
                    <tr>
                        <th>Тип</th><th>Наименование</th><th>Расчёт</th>
                        <th>Ед.</th><th class="col-right">Кол-во</th>
                        <th class="col-right">Цена/ед</th><th class="col-right">Сумма</th><th></th>
                    </tr>
                </thead>
                <tbody id="estimateBody">
                    <tr><td colspan="8" class="estimate-empty">Смета пуста</td></tr>
                </tbody>
            </table>
        </div>
        <div class="estimate-actions">
            <button class="btn btn-outline btn-sm" onclick="exportToXLSX()">Экспорт в Excel</button>
            <button class="btn btn-outline btn-sm" onclick="copyEstimate()">Копировать</button>
            <button class="btn btn-danger btn-sm" onclick="clearEstimate()">Очистить</button>
        </div>
    </div>

</div>

<script>
// ============================================================
// РЕЖИМ КРУПНОГО ШРИФТА
// ============================================================
function toggleLargeMode() {
    document.body.classList.toggle('large-mode');
    const isLarge = document.body.classList.contains('large-mode');
    document.getElementById('btnLarge').classList.toggle('active', isLarge);
    localStorage.setItem('largeMode', isLarge ? '1' : '0');
}

// Восстановление режима
if (localStorage.getItem('largeMode') === '1') {
    document.body.classList.add('large-mode');
    document.getElementById('btnLarge').classList.add('active');
}

// ============================================================
// УТИЛИТЫ
// ============================================================
function parsePrice(value) {
    if (value === undefined || value === null || value === '') return 0;
    if (typeof value === 'number') return value;
    let s = String(value).trim().replace(/\s/g, '').replace(',', '.');
    let num = parseFloat(s);
    return isNaN(num) ? 0 : num;
}

// ============================================================
// ЗАГРУЗКА ДАННЫХ
// ============================================================
const SPREADSHEET_ID = "1OhoJYlXsYiJDdCF_ET7gkNKg21juUI5ENo-haz6wcR4";
const SHEET1_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=Лист1`;
const SHEET2_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=Лист2`;

let catalog = { materials: [], works: [] };
let dataLoaded = false;

function setDataStatus(status, text) {
    document.getElementById('dataStatus').innerHTML = `<span class="status-dot ${status}"></span> ${text}`;
}

function loadAllData() {
    setDataStatus('loading', 'Загрузка...');
    Promise.all([fetch(SHEET1_URL).then(r=>r.text()), fetch(SHEET2_URL).then(r=>r.text())])
    .then(([t1,t2]) => {
        const j1 = JSON.parse(t1.substring(47, t1.length-2));
        catalog.materials = [];
        for (let r of j1.table.rows) {
            const c = r.c;
            if (!c||!c[0]||!c[0].v) continue;
            const g = String(c[0]?.v||'').trim();
            if (!g) continue;
            catalog.materials.push({
                group:g, name:String(c[1]?.v||'').trim(),
                unit:String(c[3]?.v||'').trim(), price:parsePrice(c[4]?.v),
                size:String(c[5]?.v||'').trim(), supplier:String(c[7]?.v||'').trim(),
                site:String(c[8]?.v||'').trim()
            });
        }
        const j2 = JSON.parse(t2.substring(47, t2.length-2));
        catalog.works = [];
        for (let r of j2.table.rows) {
            const c = r.c;
            if (!c||!c[0]||!c[0].v) continue;
            const g = String(c[0]?.v||'').trim();
            if (!g) continue;
            catalog.works.push({
                group:g, name:String(c[1]?.v||'').trim(),
                unit:String(c[2]?.v||'').trim(), price:parsePrice(c[3]?.v),
                note:String(c[4]?.v||'').trim(), size:'', supplier:'', site:''
            });
        }
        dataLoaded = true;
        setDataStatus('online', 'Готово');
        initConstructor();
        preloadExcelJS();
    })
    .catch(e => { console.error(e); setDataStatus('offline', 'Ошибка'); });
}

function preloadExcelJS() {
    if (typeof ExcelJS === 'undefined' && !document.getElementById('exceljs-script')) {
        const s = document.createElement('script');
        s.id = 'exceljs-script';
        s.src = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
        document.head.appendChild(s);
    }
}

// ============================================================
// КОНСТРУКТОР
// ============================================================
let materialCategories = [], workCategories = [];
let currentType = null, currentCategory = null, currentItems = [], currentItem = null;
let estimateItems = [];

function initConstructor() {
    materialCategories = [...new Set(catalog.materials.map(i=>i.group).filter(Boolean))].sort();
    workCategories = [...new Set(catalog.works.map(i=>i.group).filter(Boolean))].sort();
    renderCategories();
    loadEstimateFromStorage();
}

function renderCategories() {
    const md = document.getElementById('materialsList'); md.innerHTML = '';
    materialCategories.forEach(c => {
        const d = document.createElement('div'); d.className = 'category-item';
        d.textContent = c; d.onclick = () => selectCategory('material', c);
        md.appendChild(d);
    });
    const wd = document.getElementById('worksList'); wd.innerHTML = '';
    workCategories.forEach(c => {
        const d = document.createElement('div'); d.className = 'category-item';
        d.textContent = c; d.onclick = () => selectCategory('work', c);
        wd.appendChild(d);
    });
    resetForm();
}

function resetForm() {
    currentType=null;currentCategory=null;currentItems=[];currentItem=null;
    document.getElementById('itemSelect').innerHTML='<option value="">Сначала выберите категорию</option>';
    document.getElementById('infoBlock').style.display='none';
    document.getElementById('calcBlock').style.display='none';
    document.getElementById('rowTotal').innerHTML='0 ₽';
    document.querySelectorAll('.category-item').forEach(e=>e.classList.remove('active'));
}

function selectCategory(type, cat) {
    currentType=type;currentCategory=cat;
    document.querySelectorAll('.category-item').forEach(e=>e.classList.remove('active'));
    const sel = type==='material'?'#materialsList .category-item':'#worksList .category-item';
    document.querySelectorAll(sel).forEach(e=>{if(e.textContent.trim()===cat)e.classList.add('active')});
    currentItems=[];
    const src = type==='material'?catalog.materials:catalog.works;
    src.forEach(i=>{if(i.group===cat)currentItems.push({...i,itemType:type})});
    const s = document.getElementById('itemSelect');
    s.innerHTML='<option value="">Выберите позицию</option>';
    currentItems.forEach(i=>{
        const o = document.createElement('option');
        o.value=i.name;o.textContent=i.name;
        o.dataset.unit=i.unit||'';o.dataset.price=i.price||0;
        o.dataset.size=i.size||'';o.dataset.supplier=i.supplier||'';
        o.dataset.site=i.site||'';s.appendChild(o);
    });
    document.getElementById('infoBlock').style.display='none';
    document.getElementById('calcBlock').style.display='none';
    document.getElementById('rowTotal').innerHTML='0 ₽';
    currentItem=null;
}

function fillDetails() {
    const s = document.getElementById('itemSelect');
    const o = s.options[s.selectedIndex];
    if(!o||!o.value)return;
    const sel = currentItems.find(i=>i.name===o.value);
    if(!sel)return;
    document.getElementById('infoBlock').style.display='block';
    document.getElementById('sizeValue').innerHTML=sel.size||'—';
    document.getElementById('unitValue').innerHTML=sel.unit||'—';
    document.getElementById('priceValue').innerHTML=sel.price?sel.price.toLocaleString('ru-RU')+' ₽/'+(sel.unit||'ед.'):'—';
    document.getElementById('supplierRow').style.display=sel.supplier?'flex':'none';
    if(sel.supplier)document.getElementById('supplierValue').innerHTML=sel.supplier;
    document.getElementById('siteRow').style.display=sel.site?'flex':'none';
    if(sel.site)document.getElementById('siteValue').innerHTML=sel.site.startsWith('http')?`<a href="${sel.site}" target="_blank" style="color:#1a1a1a;">открыть</a>`:sel.site;
    currentItem={type:currentType==='material'?'Материал':'Работа',category:currentCategory,name:sel.name,unit:sel.unit||'ед.',price:parseFloat(sel.price)||0,size:sel.size||'',supplier:sel.supplier||'',site:sel.site||''};
    buildCalcInterface();
}

function getCalcType(u) {
    const un=(u||'').toLowerCase();
    if(un.includes('м²')||un.includes('м.кв')||un.includes('кв.м'))return'area';
    if(un.includes('м.п')||un==='м'||un.includes('пог.м'))return'length';
    return'piece';
}

function buildCalcInterface() {
    if(!currentItem)return;
    const ct=getCalcType(currentItem.unit);
    const ul=currentItem.unit||'ед.';
    let h='';
    if(ct==='area')h=`<div class="field-group"><label>Площадь (м²)</label><input type="number" id="calcQty" value="1" step="0.01" min="0.01"><div class="calc-hint">Введите нужную площадь</div></div>`;
    else if(ct==='length')h=`<div class="field-group"><label>Длина (м)</label><input type="number" id="calcQty" value="1" step="0.1" min="0.1"><div class="calc-hint">Введите нужную длину</div></div>`;
    else h=`<div class="field-group"><label>Количество (${ul})</label><input type="number" id="calcQty" value="1" step="1" min="1"><div class="calc-hint">Введите нужное количество</div></div>`;
    if(currentItem.size)h+=`<div style="font-size:var(--fs-xs);color:var(--gray-text);margin-top:6px;">Размер единицы: ${currentItem.size}</div>`;
    document.getElementById('calcFields').innerHTML=h;
    document.getElementById('calcBlock').style.display='block';
    document.getElementById('calcQty')?.addEventListener('input',calculateTotal);
    calculateTotal();
}

function calculateTotal() {
    if(!currentItem)return 0;
    const q=parseFloat(document.getElementById('calcQty')?.value)||0;
    const t=q*currentItem.price;
    const ct=getCalcType(currentItem.unit);
    let txt='';
    if(ct==='area')txt=`${q.toFixed(2)} м² x ${currentItem.price.toFixed(2)} ₽/м² = ${t.toFixed(2)} ₽`;
    else if(ct==='length')txt=`${q.toFixed(1)} м x ${currentItem.price.toFixed(2)} ₽/м = ${t.toFixed(2)} ₽`;
    else txt=`${q} ${currentItem.unit||'ед.'} x ${currentItem.price.toFixed(2)} ₽ = ${t.toFixed(2)} ₽`;
    document.getElementById('rowTotal').innerHTML=t.toFixed(2).replace('.',',')+' ₽';
    document.getElementById('calcResult').innerHTML=txt;
    return{total:t,quantity:q,calcText:txt};
}

function addToEstimate() {
    if(!currentItem||!currentItem.name){alert('Выберите позицию');return;}
    const c=calculateTotal();
    if(c.total===0){alert('Укажите количество');return;}
    const ct=getCalcType(currentItem.unit);
    let s='';
    if(ct==='area')s=`${c.quantity.toFixed(2)} м²`;
    else if(ct==='length')s=`${c.quantity.toFixed(1)} м`;
    else s=`${c.quantity} ${currentItem.unit||'ед.'}`;
    estimateItems.push({type:currentItem.type,category:currentItem.category,name:currentItem.name,calcText:s,unit:currentItem.unit||'ед.',quantity:c.quantity,price:currentItem.price,total:c.total});
    renderEstimate();
    document.getElementById('rowTotal').innerHTML='0 ₽';
}

function renderEstimate() {
    const tb=document.getElementById('estimateBody');
    tb.innerHTML='';
    if(!estimateItems.length){
        tb.innerHTML='<tr><td colspan="8" class="estimate-empty">Смета пуста</td></tr>';
        document.getElementById('totalEstimate').innerHTML='0 ₽';
        return;
    }
    const mats=estimateItems.filter(i=>i.type==='Материал');
    const wrk=estimateItems.filter(i=>i.type==='Работа');
    let ms=0,ws=0,ri=0;
    
    function ar(item){
        const r=tb.insertRow();r.className=ri%2===0?'even':'odd';ri++;
        r.insertCell(0).innerHTML=item.type;r.insertCell(1).innerHTML=item.name;
        r.insertCell(2).innerHTML=item.calcText;r.insertCell(3).innerHTML=item.unit;
        r.insertCell(4).innerHTML=item.quantity;r.cells[4].className='col-right';
        r.insertCell(5).innerHTML=item.price.toFixed(2).replace('.',',')+' ₽';r.cells[5].className='col-right';
        r.insertCell(6).innerHTML=item.total.toFixed(2).replace('.',',')+' ₽';r.cells[6].className='col-right col-bold';
        const d=r.insertCell(7);d.innerHTML='<button class="del-btn">&times;</button>';
        d.querySelector('button').onclick=()=>{
            const idx=estimateItems.indexOf(item);
            if(idx>=0){estimateItems.splice(idx,1);renderEstimate();}
        };
    }
    
    function ast(label,sum){
        const r=tb.insertRow();r.className='subtotal-row';
        r.insertCell(0).colSpan=6;r.cells[0].innerHTML=label;
        r.cells[0].style.textAlign='right';r.cells[0].style.fontWeight='700';
        const v=r.insertCell(1);v.innerHTML=sum.toFixed(2).replace('.',',')+' ₽';
        v.className='col-right';v.style.fontWeight='700';
        r.insertCell(2).innerHTML='';
    }
    
    if(mats.length){
        const sr=tb.insertRow();sr.className='section-row';
        sr.insertCell(0).colSpan=8;sr.cells[0].innerHTML='МАТЕРИАЛЫ';
        mats.forEach(i=>{ms+=i.total;ar(i);});
        ast('Итого материалы:',ms);
    }
    if(wrk.length){
        const sr=tb.insertRow();sr.className='section-row';
        sr.insertCell(0).colSpan=8;sr.cells[0].innerHTML='РАБОТЫ И УСЛУГИ';
        wrk.forEach(i=>{ws+=i.total;ar(i);});
        ast('Итого работы:',ws);
    }
    const g=ms+ws;
    const gr=tb.insertRow();gr.className='grand-row';
    gr.insertCell(0).colSpan=6;gr.cells[0].innerHTML='ВСЕГО ПО СМЕТЕ:';
    gr.cells[0].style.textAlign='right';gr.cells[0].style.fontWeight='800';
    const gv=gr.insertCell(1);gv.innerHTML=g.toFixed(2).replace('.',',')+' ₽';
    gv.className='col-right';gv.style.fontWeight='800';
    gr.insertCell(2).innerHTML='';
    document.getElementById('totalEstimate').innerHTML=g.toFixed(2).replace('.',',')+' ₽';
    localStorage.setItem('estimate',JSON.stringify(estimateItems));
}

function loadEstimateFromStorage() {
    try{const s=localStorage.getItem('estimate');if(s){estimateItems=JSON.parse(s);renderEstimate();}}catch(e){}
}

// ============================================================
// ЭКСПОРТ
// ============================================================
function copyEstimate() {
    if(!estimateItems.length){alert('Смета пуста');return;}
    let t='Тип\tНаименование\tРасчёт\tЕд.\tКол-во\tЦена/ед\tСумма\n';
    const mats=estimateItems.filter(i=>i.type==='Материал');
    const wrk=estimateItems.filter(i=>i.type==='Работа');
    let ms=0,ws=0;
    if(mats.length){t+='\nМАТЕРИАЛЫ\n';mats.forEach(i=>{ms+=i.total;t+=[i.type,i.name,i.calcText,i.unit,i.quantity,i.price.toFixed(2),i.total.toFixed(2)].join('\t')+'\n';});t+=`\t\t\t\t\tИтого материалы:\t${ms.toFixed(2)} ₽\n`;}
    if(wrk.length){t+='\nРАБОТЫ И УСЛУГИ\n';wrk.forEach(i=>{ws+=i.total;t+=[i.type,i.name,i.calcText,i.unit,i.quantity,i.price.toFixed(2),i.total.toFixed(2)].join('\t')+'\n';});t+=`\t\t\t\t\tИтого работы:\t${ws.toFixed(2)} ₽\n`;}
    t+=`\n\t\t\t\t\tВСЕГО:\t${(ms+ws).toFixed(2)} ₽`;
    navigator.clipboard.writeText(t).then(()=>alert('Скопировано')).catch(()=>alert('Не удалось'));
}

function clearEstimate(){if(confirm('Очистить смету?')){estimateItems=[];renderEstimate();}}

function exportToXLSX() {
    if(!estimateItems.length){alert('Смета пуста');return;}
    if(typeof ExcelJS==='undefined'){alert('Подождите загрузки...');return;}
    exportToXLSX_do();
}

async function exportToXLSX_do() {
    const wb=new ExcelJS.Workbook();
    const ws=wb.addWorksheet('Смета',{views:[{showGridLines:false}]});
    ws.columns=[{w:12},{w:30},{w:20},{w:10},{w:10},{w:14},{w:16}];
    const mats=estimateItems.filter(i=>i.type==='Материал');
    const wrk=estimateItems.filter(i=>i.type==='Работа');
    let r=1;
    const tr=ws.getRow(r);tr.getCell(1).value='Смета от '+new Date().toLocaleString('ru-RU');
    tr.getCell(1).font={bold:true,size:14,color:{argb:'FF1A1A1A'}};
    ws.mergeCells(r,1,r,7);tr.height=28;r++;
    ['Тип','Наименование','Расчёт','Ед.','Кол-во','Цена/ед','Сумма'].forEach((h,i)=>{
        const c=ws.getRow(r).getCell(i+1);c.value=h;
        c.font={bold:true,color:{argb:'FFFFFFFF'},size:10};
        c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF333333'}};
        c.alignment={horizontal:'center',vertical:'middle'};c.border=bd();
    });
    ws.getRow(r).height=24;r++;
    let ms=0,ws2=0;
    if(mats.length){
        const sr=ws.getRow(r);sr.getCell(1).value='МАТЕРИАЛЫ';
        sr.getCell(1).font={bold:true,size:11};sr.getCell(1).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFD5D5D5'}};
        ws.mergeCells(r,1,r,7);applyB(sr,1,7);sr.height=22;r++;
        mats.forEach((it,i)=>{
            ms+=it.total;const row=ws.getRow(r);
            [it.type,it.name,it.calcText,it.unit,it.quantity,it.price.toFixed(2).replace('.',',')+' ₽',it.total.toFixed(2).replace('.',',')+' ₽'].forEach((v,j)=>{
                const c=row.getCell(j+1);c.value=v;
                c.fill={type:'pattern',pattern:'solid',fgColor:{argb:i%2===0?'FFFFFFFF':'FFF5F5F5'}};
                c.alignment={vertical:'middle',horizontal:j>=4?'right':'left'};c.border=bd();
            });
            row.getCell(7).font={bold:true};row.height=20;r++;
        });
        const tr2=ws.getRow(r);ws.mergeCells(r,1,r,5);
        tr2.getCell(6).value='Итого материалы:';tr2.getCell(7).value=ms.toFixed(2).replace('.',',')+' ₽';
        [6,7].forEach(j=>{tr2.getCell(j).font={bold:true};tr2.getCell(j).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFE8E0C0'}};tr2.getCell(j).alignment={horizontal:'right',vertical:'middle'};tr2.getCell(j).border=bd();});
        applyB(tr2,1,5);tr2.height=22;r++;
    }
    if(wrk.length){
        r++;const sr=ws.getRow(r);sr.getCell(1).value='РАБОТЫ И УСЛУГИ';
        sr.getCell(1).font={bold:true,size:11};sr.getCell(1).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFD5D5D5'}};
        ws.mergeCells(r,1,r,7);applyB(sr,1,7);sr.height=22;r++;
        wrk.forEach((it,i)=>{
            ws2+=it.total;const row=ws.getRow(r);
            [it.type,it.name,it.calcText,it.unit,it.quantity,it.price.toFixed(2).replace('.',',')+' ₽',it.total.toFixed(2).replace('.',',')+' ₽'].forEach((v,j)=>{
                const c=row.getCell(j+1);c.value=v;
                c.fill={type:'pattern',pattern:'solid',fgColor:{argb:i%2===0?'FFFFFFFF':'FFF5F5F5'}};
                c.alignment={vertical:'middle',horizontal:j>=4?'right':'left'};c.border=bd();
            });
            row.getCell(7).font={bold:true};row.height=20;r++;
        });
        const tr2=ws.getRow(r);ws.mergeCells(r,1,r,5);
        tr2.getCell(6).value='Итого работы:';tr2.getCell(7).value=ws2.toFixed(2).replace('.',',')+' ₽';
        [6,7].forEach(j=>{tr2.getCell(j).font={bold:true};tr2.getCell(j).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFE8E0C0'}};tr2.getCell(j).alignment={horizontal:'right',vertical:'middle'};tr2.getCell(j).border=bd();});
        applyB(tr2,1,5);tr2.height=22;r++;
    }
    r++;const g=ms+ws2;const gr=ws.getRow(r);
    ws.mergeCells(r,1,r,5);
    gr.getCell(6).value='ВСЕГО ПО СМЕТЕ:';gr.getCell(7).value=g.toFixed(2).replace('.',',')+' ₽';
    [6,7].forEach(j=>{gr.getCell(j).font={bold:true,size:12};gr.getCell(j).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFD0C8A0'}};gr.getCell(j).alignment={horizontal:'right',vertical:'middle'};gr.getCell(j).border={top:{style:'medium'},bottom:{style:'medium'},left:{style:'thin'},right:{style:'thin'}};});
    applyB(gr,1,5);gr.height=26;
    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=`smeta_${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.xlsx`;
    a.click();URL.revokeObjectURL(a.href);
}
function bd(){return{top:{style:'thin'},bottom:{style:'thin'},left:{style:'thin'},right:{style:'thin'}};}
function applyB(row,f,t){for(let i=f;i<=t;i++)row.getCell(i).border=bd();}

// ============================================================
// ЗАПУСК
// ============================================================
document.getElementById('itemSelect').addEventListener('change',fillDetails);
loadAllData();
window.addToEstimate=addToEstimate;
window.exportToXLSX=exportToXLSX;
window.copyEstimate=copyEstimate;
window.clearEstimate=clearEstimate;
</script>
