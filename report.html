<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отчет по материалам</title>
    <!-- Chart.js для графиков -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 24px; background: #f0f2f5; }
        .container { max-width: 1600px; margin: 0 auto; }
        h1 { font-size: 1.8rem; font-weight: 600; margin: 0 0 4px 0; color: #0f3b2c; }
        .sub { color: #475569; font-size: 0.9rem; border-left: 3px solid #2e7d32; padding-left: 12px; margin: 8px 0 24px 0; }
        
        /* Панель фильтров */
        .filters-card { background: white; border-radius: 20px; padding: 20px 24px; margin-bottom: 24px; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; border: 1px solid #e2e8f0; }
        .filter-group { display: flex; flex-direction: column; gap: 6px; min-width: 160px; }
        .filter-group label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; color: #5b6e8c; }
        select, input { padding: 10px 14px; border-radius: 14px; border: 1px solid #cbd5e1; font-size: 0.9rem; font-family: inherit; background: white; }
        button { background: #2e7d32; border: none; padding: 10px 20px; border-radius: 40px; color: white; cursor: pointer; font-weight: 500; }
        button:hover { background: #1b5e20; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        
        /* Карточки статистики */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 28px; }
        .stat-card { background: white; border-radius: 24px; padding: 16px 20px; border: 1px solid #e9edf2; }
        .stat-card h3 { font-size: 0.75rem; font-weight: 600; color: #5b6e8c; margin: 0 0 8px 0; }
        .stat-value { font-size: 2rem; font-weight: 700; color: #0f3b2c; }
        
        /* Графики */
        .charts-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 24px; margin-bottom: 28px; }
        .chart-card { background: white; border-radius: 24px; padding: 20px; border: 1px solid #e9edf2; }
        .chart-card h3 { margin: 0 0 16px 0; font-size: 1rem; color: #1e293b; }
        canvas { max-height: 300px; width: 100%; }
        
        /* Таблица */
        .table-wrapper { background: white; border-radius: 24px; border: 1px solid #e9edf2; overflow: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 800px; }
        th { text-align: left; padding: 16px 12px; background: #f8fafc; font-weight: 600; border-bottom: 1px solid #e2e8f0; cursor: pointer; user-select: none; position: sticky; top: 0; }
        th:hover { background: #e9ecef; }
        th::after { content: " ↕"; opacity: 0.3; font-size: 0.7rem; }
        th.sort-asc::after { content: " ↑"; opacity: 1; }
        th.sort-desc::after { content: " ↓"; opacity: 1; }
        td { padding: 12px; border-bottom: 1px solid #f0f2f5; }
        .price-cell { font-weight: 500; text-align: right; white-space: nowrap; }
        .badge-missing { background: #ffebee; color: #c62828; padding: 4px 8px; border-radius: 40px; font-size: 0.7rem; white-space: nowrap; }
        .total-row td { background: #fef6e0; font-weight: 700; }
        .loading, .error-message { text-align: center; padding: 48px; }
        .error-message { background: #fff5f5; color: #b91c1c; border-radius: 24px; }
        a { color: #2e7d32; text-decoration: none; }
        a:hover { text-decoration: underline; }
        @media (max-width: 768px) {
            body { padding: 16px; }
            .filters-card { flex-direction: column; }
            .filter-group { width: 100%; }
            .charts-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📦 Сводка по материалам</h1>
    <div class="sub">📅 Данные из Google Таблицы · обновляются автоматически</div>

    <!-- Панель фильтров -->
    <div class="filters-card">
        <div class="filter-group">
            <label>📁 Группа</label>
            <select id="filterGroup"><option value="">Все группы</option></select>
        </div>
        <div class="filter-group">
            <label>🏭 Поставщик</label>
            <select id="filterSupplier"><option value="">Все поставщики</option></select>
        </div>
        <div class="filter-group">
            <label>📏 Размер</label>
            <select id="filterSize"><option value="">Все размеры</option></select>
        </div>
        <div class="filter-group">
            <label>💰 Цена (мин)</label>
            <input type="number" id="filterPriceMin" placeholder="0" step="1000">
        </div>
        <div class="filter-group">
            <label>💰 Цена (макс)</label>
            <input type="number" id="filterPriceMax" placeholder="Любая" step="1000">
        </div>
        <div class="filter-group">
            <label>🔍 Поиск</label>
            <input type="text" id="filterSearch" placeholder="Наименование...">
        </div>
        <div class="filter-group">
            <label>&nbsp;</label>
            <button id="resetBtn">⟳ Сбросить всё</button>
        </div>
    </div>

    <!-- Карточки статистики -->
    <div class="stats-grid" id="statsContainer">
        <div class="stat-card"><h3>💰 Общая сумма</h3><div class="stat-value">—</div></div>
        <div class="stat-card"><h3>📦 Позиций</h3><div class="stat-value">—</div></div>
        <div class="stat-card"><h3>📁 Групп</h3><div class="stat-value">—</div></div>
        <div class="stat-card"><h3>⚠️ Без цены</h3><div class="stat-value">—</div></div>
    </div>

    <!-- Графики -->
    <div class="charts-row">
        <div class="chart-card">
            <h3>📊 Сумма по группам</h3>
            <canvas id="sumChart"></canvas>
        </div>
        <div class="chart-card">
            <h3>🥧 Количество по группам</h3>
            <canvas id="countChart"></canvas>
        </div>
    </div>

    <!-- Таблица -->
    <div class="table-wrapper">
        <div id="tableContainer" class="loading">🔄 Загрузка данных...</div>
    </div>
</div>

<script>
    // ⚠️ ВСТАВЬ СВОЮ ССЫЛКУ НА APPS SCRIPT ⚠️
    const API_URL = "https://script.google.com/macros/s/AKfycbxMZil0-M9ZNFuMxH3mmgpXbpiNefx1p1I3po3oMbHW116IGy4-JjTnjSG8GeuuFkV84w/exec";
    
    let allData = [];
    let groups = [];
    let suppliers = [];
    let sizes = [];
    
    let sumChart = null;
    let countChart = null;
    
    let currentSort = { column: 'price', direction: 'desc' };

    function loadData() {
        const container = document.getElementById('tableContainer');
        container.innerHTML = '<div class="loading">📡 Загрузка данных...</div>';
        
        const callbackName = 'jsonp_callback_' + Math.random().toString(36).substr(2);
        
        window[callbackName] = function(data) {
            delete window[callbackName];
            document.body.removeChild(script);
            
            allData = data.data;
            
            if (!allData || allData.length === 0) {
                container.innerHTML = '<div class="loading">📭 В таблице пока нет данных</div>';
                return;
            }
            
            // Извлекаем уникальные значения для фильтров
            const groupsSet = new Set();
            const suppliersSet = new Set();
            const sizesSet = new Set();
            
            for (let i = 0; i < allData.length; i++) {
                const row = allData[i];
                const group = row[0] ? String(row[0]).trim() : '';
                const supplier = row[2] ? String(row[2]).trim() : '';
                const size = row[6] ? String(row[6]).trim() : '';
                if (group) groupsSet.add(group);
                if (supplier) suppliersSet.add(supplier);
                if (size && size !== '—') sizesSet.add(size);
            }
            
            groups = Array.from(groupsSet).sort();
            suppliers = Array.from(suppliersSet).sort();
            sizes = Array.from(sizesSet).sort();
            
            // Заполняем выпадающие списки
            const groupSelect = document.getElementById('filterGroup');
            groupSelect.innerHTML = '<option value="">Все группы</option>';
            groups.forEach(g => {
                const option = document.createElement('option');
                option.value = g;
                option.textContent = g;
                groupSelect.appendChild(option);
            });
            
            const supplierSelect = document.getElementById('filterSupplier');
            supplierSelect.innerHTML = '<option value="">Все поставщики</option>';
            suppliers.forEach(s => {
                const option = document.createElement('option');
                option.value = s;
                option.textContent = s;
                supplierSelect.appendChild(option);
            });
            
            const sizeSelect = document.getElementById('filterSize');
            sizeSelect.innerHTML = '<option value="">Все размеры</option>';
            sizes.forEach(sz => {
                const option = document.createElement('option');
                option.value = sz;
                option.textContent = sz;
                sizeSelect.appendChild(option);
            });
            
            // Добавляем обработчики
            document.getElementById('filterGroup').addEventListener('change', () => { currentSort = { column: 'price', direction: 'desc' }; renderTable(); });
            document.getElementById('filterSupplier').addEventListener('change', () => { currentSort = { column: 'price', direction: 'desc' }; renderTable(); });
            document.getElementById('filterSize').addEventListener('change', renderTable);
            document.getElementById('filterPriceMin').addEventListener('input', renderTable);
            document.getElementById('filterPriceMax').addEventListener('input', renderTable);
            document.getElementById('filterSearch').addEventListener('input', renderTable);
            document.getElementById('resetBtn').addEventListener('click', resetFilters);
            
            renderTable();
        };
        
        const script = document.createElement('script');
        script.src = API_URL + '?callback=' + callbackName;
        script.onerror = function() {
            delete window[callbackName];
            document.body.removeChild(script);
            container.innerHTML = `<div class="error-message">❌ Ошибка загрузки данных. Проверьте ссылку API.</div>`;
        };
        document.body.appendChild(script);
    }
    
    function getFilteredData() {
        const filterGroup = document.getElementById('filterGroup').value;
        const filterSupplier = document.getElementById('filterSupplier').value;
        const filterSize = document.getElementById('filterSize').value;
        const filterPriceMin = parseFloat(document.getElementById('filterPriceMin').value);
        const filterPriceMax = parseFloat(document.getElementById('filterPriceMax').value);
        const filterSearch = document.getElementById('filterSearch').value.toLowerCase();
        
        let filtered = [];
        
        for (let i = 0; i < allData.length; i++) {
            const row = allData[i];
            const group = row[0] ? String(row[0]).trim() : '';
            const name = row[1] ? String(row[1]).trim() : '';
            const supplier = row[2] ? String(row[2]).trim() : '';
            const unit = row[3] || '';
            const pricePerUnit = row[4] || '';
            let totalPriceRaw = row[5];
            const size = row[6] ? String(row[6]).trim() : '';
            const site = row[7] || '';
            
            // Фильтры
            if (filterGroup && group !== filterGroup) continue;
            if (filterSupplier && supplier !== filterSupplier) continue;
            if (filterSize && size !== filterSize) continue;
            if (filterSearch && !name.toLowerCase().includes(filterSearch)) continue;
            if (!group) continue;
            
            // Парсим цену
            let totalNum = 0;
            let hasPrice = false;
            if (totalPriceRaw && String(totalPriceRaw).trim() !== '') {
                const priceStr = String(totalPriceRaw).replace(/[^\d,.-]/g, '').replace(',', '.');
                const parsed = parseFloat(priceStr);
                if (!isNaN(parsed)) {
                    totalNum = parsed;
                    hasPrice = true;
                }
            }
            
            // Фильтр по цене
            if (!isNaN(filterPriceMin) && totalNum < filterPriceMin) continue;
            if (!isNaN(filterPriceMax) && totalNum > filterPriceMax) continue;
            
            filtered.push({ group, name, supplier, unit, pricePerUnit, totalPriceRaw, totalNum, hasPrice, size, site });
        }
        
        return filtered;
    }
    
    function renderTable() {
        let filtered = getFilteredData();
        
        // Сортировка
        filtered.sort((a, b) => {
            let aVal, bVal;
            switch (currentSort.column) {
                case 'name': aVal = a.name; bVal = b.name; return currentSort.direction === 'asc' ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
                case 'group': aVal = a.group; bVal = b.group; return currentSort.direction === 'asc' ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
                case 'supplier': aVal = a.supplier; bVal = b.supplier; return currentSort.direction === 'asc' ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
                case 'price': return currentSort.direction === 'asc' ? a.totalNum - b.totalNum : b.totalNum - a.totalNum;
                default: return b.totalNum - a.totalNum;
            }
        });
        
        // Статистика
        const totalSum = filtered.reduce((sum, item) => sum + item.totalNum, 0);
        const uniqueGroups = new Set(filtered.map(i => i.group)).size;
        const withoutPrice = filtered.filter(i => !i.hasPrice).length;
        
        document.getElementById('statsContainer').innerHTML = `
            <div class="stat-card"><h3>💰 Общая сумма</h3><div class="stat-value">${totalSum.toLocaleString('ru-RU')} ₽</div></div>
            <div class="stat-card"><h3>📦 Позиций</h3><div class="stat-value">${filtered.length}</div></div>
            <div class="stat-card"><h3>📁 Групп</h3><div class="stat-value">${uniqueGroups}</div></div>
            <div class="stat-card"><h3>⚠️ Без цены</h3><div class="stat-value">${withoutPrice}</div></div>
        `;
        
        // Графики
        updateCharts(filtered);
        
        // Таблица
        if (filtered.length === 0) {
            document.getElementById('tableContainer').innerHTML = '<div class="loading">😕 Нет данных по выбранным фильтрам</div>';
            return;
        }
        
        let html = `<table><thead><tr>
            <th onclick="sortTable('name')" id="sort-name">📦 Наименование</th>
            <th onclick="sortTable('group')" id="sort-group">📁 Группа</th>
            <th onclick="sortTable('supplier')" id="sort-supplier">🏭 Поставщик</th>
            <th>📏 Размер</th>
            <th>📐 Ед.изм</th>
            <th>💵 Цена/ед</th>
            <th onclick="sortTable('price')" id="sort-price">💰 Цена общая</th>
            <th>🔗 Сайт</th>
        </tr></thead><tbody>`;
        
        for (const item of filtered) {
            const priceDisplay = item.hasPrice ? `${item.totalNum.toLocaleString('ru-RU')} ₽` : `<span class="badge-missing">нет цены</span>`;
            const siteLink = (item.site && (item.site.startsWith('http') || item.site.startsWith('https'))) 
                ? `<a href="${item.site}" target="_blank">🌐 сайт</a>` : '—';
            
            html += `<tr>
                <td style="max-width:280px;">${escapeHtml(item.name)}</td>
                <td>${escapeHtml(item.group)}</td>
                <td>${escapeHtml(item.supplier)}</td>
                <td>${escapeHtml(item.size)}</td>
                <td>${escapeHtml(item.unit)}</td>
                <td>${escapeHtml(item.pricePerUnit)}</td>
                <td class="price-cell">${priceDisplay}</td>
                <td>${siteLink}</td>
            </tr>`;
        }
        
        html += `<tr class="total-row"><td colspan="6" style="text-align:right;"><strong>ИТОГО:</strong></td><td class="price-cell"><strong>${totalSum.toLocaleString('ru-RU')} ₽</strong></td><td></td></tr>`;
        html += `</tbody>树`;
        
        document.getElementById('tableContainer').innerHTML = html;
        
        // Обновляем стрелки сортировки
        updateSortIndicators();
    }
    
    function updateCharts(filtered) {
        // Группировка по группам
        const groupMap = new Map();
        for (const item of filtered) {
            const group = item.group;
            if (!groupMap.has(group)) {
                groupMap.set(group, { sum: 0, count: 0 });
            }
            const stats = groupMap.get(group);
            stats.sum += item.totalNum;
            stats.count++;
        }
        
        const labels = Array.from(groupMap.keys());
        const sumData = labels.map(g => groupMap.get(g).sum);
        const countData = labels.map(g => groupMap.get(g).count);
        
        // График сумм
        if (sumChart) sumChart.destroy();
        const sumCtx = document.getElementById('sumChart').getContext('2d');
        sumChart = new Chart(sumCtx, {
            type: 'bar',
            data: { labels: labels, datasets: [{ label: 'Сумма, руб', data: sumData, backgroundColor: '#4CAF50', borderRadius: 8 }] },
            options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'top' } } }
        });
        
        // График количества
        if (countChart) countChart.destroy();
        const countCtx = document.getElementById('countChart').getContext('2d');
        countChart = new Chart(countCtx, {
            type: 'pie',
            data: { labels: labels, datasets: [{ data: countData, backgroundColor: ['#4CAF50', '#2196F3', '#FF9800', '#9C27B0', '#F44336', '#00BCD4', '#795548', '#607D8B'] }] },
            options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'right' } } }
        });
    }
    
    function sortTable(column) {
        if (currentSort.column === column) {
            currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
        } else {
            currentSort.column = column;
            currentSort.direction = 'desc';
        }
        renderTable();
    }
    
    function updateSortIndicators() {
        document.querySelectorAll('th').forEach(th => {
            th.classList.remove('sort-asc', 'sort-desc');
        });
        const sortMap = { name: 'sort-name', group: 'sort-group', supplier: 'sort-supplier', price: 'sort-price' };
        const elementId = sortMap[currentSort.column];
        if (elementId) {
            const el = document.getElementById(elementId);
            if (el) el.classList.add(currentSort.direction === 'asc' ? 'sort-asc' : 'sort-desc');
        }
    }
    
    function resetFilters() {
        document.getElementById('filterGroup').value = '';
        document.getElementById('filterSupplier').value = '';
        document.getElementById('filterSize').value = '';
        document.getElementById('filterPriceMin').value = '';
        document.getElementById('filterPriceMax').value = '';
        document.getElementById('filterSearch').value = '';
        currentSort = { column: 'price', direction: 'desc' };
        renderTable();
    }
    
    function escapeHtml(str) {
        if (!str) return '—';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // Глобальные функции для onclick
    window.sortTable = sortTable;
    
    loadData();
</script>
</body>
</html>
