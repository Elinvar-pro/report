<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отчет по материалам</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; background: #f0f2f5; }
        .container { max-width: 1600px; margin: 0 auto; }
        h1 { font-size: 1.6rem; margin: 0 0 4px 0; color: #1a5d2a; }
        .sub { color: #475569; font-size: 0.8rem; margin-bottom: 20px; }
        
        .filters-card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        .filters-row { display: flex; flex-wrap: wrap; gap: 12px; }
        .filter-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 130px; }
        .filter-group label { font-size: 0.7rem; font-weight: 600; color: #5b6e8c; }
        select, input { padding: 8px 12px; border-radius: 12px; border: 1px solid #cbd5e1; font-size: 0.85rem; }
        
        button { background: #2e7d32; border: none; padding: 8px 16px; border-radius: 40px; color: white; cursor: pointer; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: white; border-radius: 16px; padding: 12px 16px; text-align: center; }
        .stat-card h3 { font-size: 0.7rem; color: #5b6e8c; margin: 0 0 4px 0; }
        .stat-value { font-size: 1.4rem; font-weight: 700; color: #1a5d2a; }
        
        .charts-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .chart-card { background: white; border-radius: 16px; padding: 16px; }
        canvas { max-height: 240px; width: 100%; }
        
        .table-wrapper { background: white; border-radius: 16px; overflow: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        th { text-align: left; padding: 12px; background: #f8fafc; cursor: pointer; }
        td { padding: 10px 12px; border-bottom: 1px solid #e2e8f0; }
        .price-cell { text-align: right; }
        .badge-missing { background: #ffebee; color: #c62828; padding: 2px 6px; border-radius: 20px; font-size: 0.7rem; }
        .total-row td { background: #fef6e0; font-weight: 700; }
        .loading { text-align: center; padding: 40px; }
        @media (max-width: 700px) {
            body { padding: 12px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📋 Сводка по материалам</h1>
    <div class="sub">Данные из Google Таблицы</div>

    <div class="filters-card">
        <div class="filters-row">
            <div class="filter-group">
                <label>🔎 Поиск</label>
                <input type="text" id="searchText" placeholder="Название, группа...">
            </div>
            <div class="filter-group">
                <label>📁 Группа</label>
                <select id="filterGroup"><option value="">Все</option></select>
            </div>
            <div class="filter-group">
                <label>🏭 Поставщик</label>
                <select id="filterSupplier"><option value="">Все</option></select>
            </div>
            <div class="filter-group">
                <label>💰 Цена от</label>
                <input type="number" id="priceMin" placeholder="0">
            </div>
            <div class="filter-group">
                <label>💰 Цена до</label>
                <input type="number" id="priceMax" placeholder="Любая">
            </div>
        </div>
        <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: flex-end;">
            <button id="resetBtn">⟳ Сбросить</button>
        </div>
    </div>

    <div class="stats-grid" id="statsContainer">
        <div class="stat-card"><h3>💰 Общая сумма</h3><div class="stat-value">—</div></div>
        <div class="stat-card"><h3>📦 Позиций</h3><div class="stat-value">—</div></div>
        <div class="stat-card"><h3>📁 Групп</h3><div class="stat-value">—</div></div>
        <div class="stat-card"><h3>⚠️ Без цены</h3><div class="stat-value">—</div></div>
    </div>

    <div class="charts-row">
        <div class="chart-card"><h3>Сумма по группам</h3><canvas id="sumChart"></canvas></div>
        <div class="chart-card"><h3>Количество по группам</h3><canvas id="countChart"></canvas></div>
    </div>

    <div class="table-wrapper">
        <div id="tableContainer" class="loading">Загрузка...</div>
    </div>
</div>

<script>
    // ⚠️ ТВОЙ ID ТАБЛИЦЫ (уже вставлен) ⚠️
    const SPREADSHEET_ID = "1OhoJYlXsYiJDdCF_ET7gkNKg21juUI5ENo-haz6wcR4";
    const SHEET_NAME = "Лист1";
    
    let allData = [];
    let allGroups = [], allSuppliers = [];
    let currentSort = { column: 'price', direction: 'desc' };
    let sumChart = null, countChart = null;

    // Функция правильного парсинга числа из строки типа "3 936,53" или "3,936.53"
    function parseRussianNumber(str) {
        if (str === undefined || str === null || str === '') return 0;
        if (typeof str === 'number') return str;
        
        let s = String(str).trim();
        if (s === '') return 0;
        
        // Удаляем пробелы (разделители тысяч)
        s = s.replace(/\s/g, '');
        
        // Определяем формат: если есть и точка, и запятая
        if (s.includes(',') && s.includes('.')) {
            // Если точка перед запятой — формат "1,000.50" (американский)
            if (s.indexOf('.') < s.indexOf(',')) {
                s = s.replace(/\./g, '');
                s = s.replace(',', '.');
            } else {
                s = s.replace(/,/g, '');
            }
        } 
        // Если только запятая
        else if (s.includes(',')) {
            // Проверяем, является ли запятая разделителем тысяч (например, "1,000")
            let parts = s.split(',');
            if (parts.length === 2 && parts[1].length === 3) {
                s = s.replace(',', '');
            } else {
                s = s.replace(',', '.');
            }
        }
        
        let num = parseFloat(s);
        return isNaN(num) ? 0 : num;
    }

    async function loadData() {
        const container = document.getElementById('tableContainer');
        container.innerHTML = '<div class="loading">📡 Загрузка...</div>';
        
        try {
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;
            const response = await fetch(url);
            const text = await response.text();
            
            const jsonStr = text.substring(47, text.length - 2);
            const json = JSON.parse(jsonStr);
            const rows = json.table.rows;
            
            allData = [];
            const groupsSet = new Set();
            const suppliersSet = new Set();
            
            for (let i = 0; i < rows.length; i++) {
                const row = rows[i].c;
                if (!row || !row[0] || !row[0].v) continue;
                
                const group = String(row[0].v || '').trim();
                const name = String(row[1]?.v || '').trim();
                const supplier = String(row[2]?.v || '').trim();
                const unit = String(row[3]?.v || '').trim();
                let pricePerUnitRaw = row[4]?.v || '';
                let totalRaw = row[5]?.v || '';
                const size = String(row[6]?.v || '').trim();
                const site = String(row[7]?.v || '').trim();
                
                if (!group) continue;
                
                // ПРАВИЛЬНЫЙ ПАРСИНГ ЦЕНЫ
                let totalPrice = parseRussianNumber(totalRaw);
                
                // Цена за единицу для отображения
                let pricePerUnitDisplay = '—';
                let pupNum = parseRussianNumber(pricePerUnitRaw);
                if (pupNum > 0) {
                    pricePerUnitDisplay = pupNum.toFixed(2).replace('.', ',') + ' ₽';
                }
                
                allData.push({
                    group, name, supplier, unit,
                    pricePerUnit: pricePerUnitDisplay,
                    totalPrice: totalPrice,
                    hasPrice: totalPrice > 0,
                    size, site
                });
                
                if (group) groupsSet.add(group);
                if (supplier) suppliersSet.add(supplier);
            }
            
            allGroups = Array.from(groupsSet).sort();
            allSuppliers = Array.from(suppliersSet).sort();
            
            // Проверка в консоли — посмотри, что тут будет
            let testSum = 0;
            for (let item of allData) testSum += item.totalPrice;
            console.log("Всего позиций:", allData.length);
            console.log("Сумма (проверка):", testSum);
            console.log("Первые 3 цены:", allData.slice(0,3).map(i => i.totalPrice));
            
            // Заполняем фильтры
            const groupSelect = document.getElementById('filterGroup');
            groupSelect.innerHTML = '<option value="">Все группы</option>';
            allGroups.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g;
                opt.textContent = g;
                groupSelect.appendChild(opt);
            });
            
            const supplierSelect = document.getElementById('filterSupplier');
            supplierSelect.innerHTML = '<option value="">Все поставщики</option>';
            allSuppliers.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                supplierSelect.appendChild(opt);
            });
            
            document.getElementById('filterGroup').addEventListener('change', () => {
                updateSupplierFilter();
                renderTable();
            });
            document.getElementById('filterSupplier').addEventListener('change', () => renderTable());
            document.getElementById('priceMin').addEventListener('input', () => renderTable());
            document.getElementById('priceMax').addEventListener('input', () => renderTable());
            document.getElementById('searchText').addEventListener('input', () => renderTable());
            document.getElementById('resetBtn').addEventListener('click', resetFilters);
            
            updateSupplierFilter();
            renderTable();
            
        } catch (error) {
            console.error(error);
            container.innerHTML = `<div class="loading">❌ Ошибка: ${error.message}</div>`;
        }
    }
    
    function updateSupplierFilter() {
        const selectedGroup = document.getElementById('filterGroup').value;
        const supplierSelect = document.getElementById('filterSupplier');
        const currentVal = supplierSelect.value;
        
        let available;
        if (selectedGroup && selectedGroup !== "Все группы") {
            const set = new Set();
            for (let item of allData) {
                if (item.group === selectedGroup && item.supplier) set.add(item.supplier);
            }
            available = Array.from(set).sort();
        } else {
            available = [...allSuppliers];
        }
        
        supplierSelect.innerHTML = '<option value="">Все поставщики</option>';
        available.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s;
            opt.textContent = s;
            supplierSelect.appendChild(opt);
        });
        
        if (currentVal && available.includes(currentVal)) supplierSelect.value = currentVal;
        else supplierSelect.value = "";
    }
    
    function getFiltered() {
        const filterGroup = document.getElementById('filterGroup').value;
        const filterSupplier = document.getElementById('filterSupplier').value;
        const priceMin = parseFloat(document.getElementById('priceMin').value);
        const priceMax = parseFloat(document.getElementById('priceMax').value);
        const searchText = document.getElementById('searchText').value.toLowerCase().trim();
        
        return allData.filter(item => {
            if (filterGroup && filterGroup !== "Все группы" && item.group !== filterGroup) return false;
            if (filterSupplier && filterSupplier !== "Все поставщики" && item.supplier !== filterSupplier) return false;
            if (!isNaN(priceMin) && item.totalPrice < priceMin) return false;
            if (!isNaN(priceMax) && item.totalPrice > priceMax) return false;
            if (searchText) {
                const str = `${item.name} ${item.group} ${item.supplier} ${item.size}`.toLowerCase();
                if (!str.includes(searchText)) return false;
            }
            return true;
        });
    }
    
    function renderTable() {
        let filtered = getFiltered();
        
        filtered.sort((a, b) => {
            if (currentSort.column === 'name') return currentSort.direction === 'asc' ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name);
            if (currentSort.column === 'group') return currentSort.direction === 'asc' ? a.group.localeCompare(b.group) : b.group.localeCompare(a.group);
            if (currentSort.column === 'supplier') return currentSort.direction === 'asc' ? a.supplier.localeCompare(b.supplier) : b.supplier.localeCompare(a.supplier);
            return currentSort.direction === 'asc' ? a.totalPrice - b.totalPrice : b.totalPrice - a.totalPrice;
        });
        
        const totalSum = filtered.reduce((s, i) => s + i.totalPrice, 0);
        const uniqueGroups = new Set(filtered.map(i => i.group)).size;
        const withoutPrice = filtered.filter(i => !i.hasPrice).length;
        
        document.getElementById('statsContainer').innerHTML = `
            <div class="stat-card"><h3>💰 Общая сумма</h3><div class="stat-value">${totalSum.toLocaleString('ru-RU')} ₽</div></div>
            <div class="stat-card"><h3>📦 Позиций</h3><div class="stat-value">${filtered.length}</div></div>
            <div class="stat-card"><h3>📁 Групп</h3><div class="stat-value">${uniqueGroups}</div></div>
            <div class="stat-card"><h3>⚠️ Без цены</h3><div class="stat-value">${withoutPrice}</div></div>
        `;
        
        updateCharts(filtered);
        
        if (filtered.length === 0) {
            document.getElementById('tableContainer').innerHTML = '<div class="loading">😕 Нет данных</div>';
            return;
        }
        
        let html = '<table><thead><tr><th onclick="sortTable(\'name\')">Наименование</th><th onclick="sortTable(\'group\')">Группа</th><th onclick="sortTable(\'supplier\')">Поставщик</th><th>Размер</th><th>Ед.изм</th><th>Цена/ед</th><th onclick="sortTable(\'price\')">Цена общая</th><th>Сайт</th></tr></thead><tbody>';
        
        for (let item of filtered) {
            const priceDisplay = item.hasPrice ? `${item.totalPrice.toLocaleString('ru-RU')} ₽` : `<span class="badge-missing">нет цены</span>`;
            const siteLink = (item.site && item.site.startsWith('http')) ? `<a href="${item.site}" target="_blank">открыть</a>` : '—';
            html += `<tr><td style="max-width:250px;">${escapeHtml(item.name)}</td><td>${escapeHtml(item.group)}</td><td>${escapeHtml(item.supplier)}</td><td>${escapeHtml(item.size)}</td><td>${escapeHtml(item.unit)}</td><td>${escapeHtml(item.pricePerUnit)}</td><td class="price-cell">${priceDisplay}</td><td>${siteLink}</td></tr>`;
        }
        
        html += `<tr class="total-row"><td colspan="6" style="text-align:right;"><strong>ИТОГО:</strong></td><td class="price-cell"><strong>${totalSum.toLocaleString('ru-RU')} ₽</strong></td><td></td></tr>`;
        html += `</tbody></table>>`;
        
        document.getElementById('tableContainer').innerHTML = html;
    }
    
    function updateCharts(filtered) {
        const map = new Map();
        for (let item of filtered) {
            if (!map.has(item.group)) map.set(item.group, { sum: 0, count: 0 });
            const stat = map.get(item.group);
            stat.sum += item.totalPrice;
            stat.count++;
        }
        const labels = Array.from(map.keys());
        const sumData = labels.map(l => map.get(l).sum);
        const countData = labels.map(l => map.get(l).count);
        
        if (sumChart) sumChart.destroy();
        if (countChart) countChart.destroy();
        
        if (labels.length) {
            sumChart = new Chart(document.getElementById('sumChart'), {
                type: 'bar',
                data: { labels, datasets: [{ label: 'Сумма, руб', data: sumData, backgroundColor: '#2e7d32' }] }
            });
            countChart = new Chart(document.getElementById('countChart'), {
                type: 'pie',
                data: { labels, datasets: [{ data: countData, backgroundColor: ['#2e7d32','#1565c0','#e65100','#6a1b9a','#c62828','#00838f'] }] }
            });
        }
    }
    
    function sortTable(col) {
        if (currentSort.column === col) currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
        else { currentSort.column = col; currentSort.direction = 'desc'; }
        renderTable();
    }
    
    function resetFilters() {
        document.getElementById('filterGroup').value = "Все группы";
        document.getElementById('filterSupplier').value = "Все поставщики";
        document.getElementById('priceMin').value = '';
        document.getElementById('priceMax').value = '';
        document.getElementById('searchText').value = '';
        updateSupplierFilter();
        renderTable();
    }
    
    function escapeHtml(str) { if (!str) return '—'; return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
    
    window.sortTable = sortTable;
    loadData();
</script>
</body>
</html>
