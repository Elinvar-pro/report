<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отчет по материалам</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 24px; background: #f0f2f5; }
        .container { max-width: 1600px; margin: 0 auto; }
        h1 { font-size: 1.8rem; font-weight: 600; margin: 0 0 4px 0; color: #1a5d2a; }
        .sub { color: #475569; font-size: 0.85rem; border-left: 3px solid #2e7d32; padding-left: 12px; margin: 8px 0 24px 0; }
        
        .filters-card { background: white; border-radius: 16px; padding: 20px 24px; margin-bottom: 24px; border: 1px solid #e2e8f0; }
        .filters-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; margin-bottom: 16px; }
        .filter-group { display: flex; flex-direction: column; gap: 6px; min-width: 160px; flex: 1; }
        .filter-group label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; color: #5b6e8c; letter-spacing: 0.5px; }
        select, input { padding: 10px 14px; border-radius: 12px; border: 1px solid #cbd5e1; font-size: 0.85rem; font-family: inherit; background: white; }
        select:focus, input:focus { outline: none; border-color: #2e7d32; box-shadow: 0 0 0 2px rgba(46,125,50,0.1); }
        
        .quick-filters { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; padding-top: 16px; border-top: 1px solid #e2e8f0; }
        .quick-btn { background: #e9ecef; border: none; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 0.75rem; color: #2c3e50; transition: all 0.2s; }
        .quick-btn:hover { background: #cbd5e1; }
        
        button { background: #2e7d32; border: none; padding: 10px 20px; border-radius: 40px; color: white; cursor: pointer; font-weight: 500; font-size: 0.85rem; }
        button:hover { background: #1b5e20; }
        .btn-secondary { background: #6c757d; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
        .stat-card { background: white; border-radius: 20px; padding: 16px 20px; border: 1px solid #e9edf2; }
        .stat-card h3 { font-size: 0.7rem; font-weight: 600; color: #5b6e8c; margin: 0 0 8px 0; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 1.8rem; font-weight: 700; color: #1a5d2a; }
        
        .charts-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 24px; margin-bottom: 28px; }
        .chart-card { background: white; border-radius: 20px; padding: 20px; border: 1px solid #e9edf2; }
        .chart-card h3 { margin: 0 0 16px 0; font-size: 0.9rem; font-weight: 600; color: #1e293b; }
        canvas { max-height: 280px; width: 100%; }
        
        .table-wrapper { background: white; border-radius: 20px; border: 1px solid #e9edf2; overflow: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 800px; }
        th { text-align: left; padding: 14px 12px; background: #f8fafc; font-weight: 600; border-bottom: 1px solid #e2e8f0; cursor: pointer; user-select: none; }
        th:hover { background: #e9ecef; }
        td { padding: 10px 12px; border-bottom: 1px solid #f0f2f5; }
        .price-cell { font-weight: 500; text-align: right; white-space: nowrap; }
        .badge-missing { background: #ffebee; color: #c62828; padding: 2px 8px; border-radius: 20px; font-size: 0.7rem; }
        .total-row td { background: #fef6e0; font-weight: 700; }
        .loading, .error-message { text-align: center; padding: 48px; }
        .error-message { background: #fff5f5; color: #b91c1c; border-radius: 20px; }
        a { color: #2e7d32; text-decoration: none; }
        a:hover { text-decoration: underline; }
        @media (max-width: 768px) {
            body { padding: 16px; }
            .filters-row { flex-direction: column; }
            .filter-group { width: 100%; }
            .charts-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📊 Сводка по материалам</h1>
    <div class="sub">Актуальные данные из Google Таблицы · руководителю</div>

    <div class="filters-card">
        <div class="filters-row">
            <div class="filter-group">
                <label>Группа</label>
                <select id="filterGroup"><option value="">Все группы</option></select>
            </div>
            <div class="filter-group">
                <label>Поставщик</label>
                <select id="filterSupplier"><option value="">Все поставщики</option></select>
            </div>
            <div class="filter-group">
                <label>Цена от (руб)</label>
                <input type="number" id="priceMin" placeholder="0" step="1000">
            </div>
            <div class="filter-group">
                <label>Цена до (руб)</label>
                <input type="number" id="priceMax" placeholder="Любая" step="1000">
            </div>
            <div class="filter-group">
                <label>Поиск</label>
                <input type="text" id="searchText" placeholder="Наименование...">
            </div>
        </div>
        
        <div class="quick-filters">
            <span style="font-size:0.7rem; color:#666;">Быстрые фильтры:</span>
            <button type="button" class="quick-btn" data-quick="expensive">Дорогие (>10000 ₽)</button>
            <button type="button" class="quick-btn" data-quick="noPrice">Без цены</button>
            <button type="button" id="resetAllBtn">Сбросить всё</button>
        </div>
    </div>

    <div class="stats-grid" id="statsContainer">
        <div class="stat-card"><h3>Общая сумма</h3><div class="stat-value">—</div></div>
        <div class="stat-card"><h3>Всего позиций</h3><div class="stat-value">—</div></div>
        <div class="stat-card"><h3>Групп</h3><div class="stat-value">—</div></div>
        <div class="stat-card"><h3>Без цены</h3><div class="stat-value">—</div></div>
    </div>

    <div class="charts-row">
        <div class="chart-card"><h3>Сумма по группам</h3><canvas id="sumChart"></canvas></div>
        <div class="chart-card"><h3>Количество позиций по группам</h3><canvas id="countChart"></canvas></div>
    </div>

    <div class="table-wrapper">
        <div id="tableContainer" class="loading">Загрузка данных...</div>
    </div>
</div>

<script>
    // ⚠️ ВСТАВЬ СВОЮ ССЫЛКУ НА APPS SCRIPT ⚠️
    const API_URL = "https://script.google.com/macros/s/AKfycbx4mWEU7SzgWQkQVihSXTRFlrXBhM-2QbSlwVTrcQKMK8wbh0DKjYkr9iRzaMiw9pxvWQ/exec";
    
    let allData = [];
    let allGroups = [];
    let allSuppliers = [];
    let currentSort = { column: 'price', direction: 'desc' };
    let sumChart = null, countChart = null;
    
    function loadData() {
        const container = document.getElementById('tableContainer');
        container.innerHTML = '<div class="loading">Загрузка данных...</div>';
        
        const callbackName = 'jsonp_callback_' + Math.random().toString(36).substr(2);
        window[callbackName] = function(data) {
            delete window[callbackName];
            document.body.removeChild(script);
            allData = data.data || [];
            
            if (!allData.length) {
                container.innerHTML = '<div class="loading">Нет данных в таблице</div>';
                return;
            }
            
            const groupsSet = new Set();
            const suppliersSet = new Set();
            for (let row of allData) {
                const group = row[0] ? row[0].toString().trim() : '';
                const supplier = row[2] ? row[2].toString().trim() : '';
                if (group) groupsSet.add(group);
                if (supplier) suppliersSet.add(supplier);
            }
            allGroups = Array.from(groupsSet).sort();
            allSuppliers = Array.from(suppliersSet).sort();
            
            const groupSelect = document.getElementById('filterGroup');
            groupSelect.innerHTML = '<option value="">Все группы</option>';
            allGroups.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g;
                opt.textContent = g;
                groupSelect.appendChild(opt);
            });
            
            document.getElementById('filterGroup').addEventListener('change', () => {
                updateSupplierFilter();
                renderTable();
            });
            document.getElementById('filterSupplier').addEventListener('change', () => renderTable());
            document.getElementById('priceMin').addEventListener('input', () => renderTable());
            document.getElementById('priceMax').addEventListener('input', () => renderTable());
            document.getElementById('searchText').addEventListener('input', () => renderTable());
            document.getElementById('resetAllBtn').addEventListener('click', resetAllFilters);
            
            document.querySelectorAll('.quick-btn').forEach(btn => {
                btn.addEventListener('click', () => applyQuickFilter(btn.dataset.quick));
            });
            
            updateSupplierFilter();
            renderTable();
        };
        
        const script = document.createElement('script');
        script.src = API_URL + '?callback=' + callbackName;
        script.onerror = () => {
            delete window[callbackName];
            document.body.removeChild(script);
            container.innerHTML = `<div class="error-message">Ошибка загрузки данных. Проверьте настройки доступа к таблице.</div>`;
        };
        document.body.appendChild(script);
    }
    
    function updateSupplierFilter() {
        const selectedGroup = document.getElementById('filterGroup').value;
        const supplierSelect = document.getElementById('filterSupplier');
        const currentSupplier = supplierSelect.value;
        
        let availableSuppliers;
        if (selectedGroup) {
            const suppliersInGroup = new Set();
            for (let row of allData) {
                const group = row[0] ? row[0].toString().trim() : '';
                const supplier = row[2] ? row[2].toString().trim() : '';
                if (group === selectedGroup && supplier) suppliersInGroup.add(supplier);
            }
            availableSuppliers = Array.from(suppliersInGroup).sort();
        } else {
            availableSuppliers = [...allSuppliers];
        }
        
        supplierSelect.innerHTML = '<option value="">Все поставщики</option>';
        availableSuppliers.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s;
            opt.textContent = s;
            supplierSelect.appendChild(opt);
        });
        
        if (currentSupplier && availableSuppliers.includes(currentSupplier)) {
            supplierSelect.value = currentSupplier;
        } else {
            supplierSelect.value = "";
        }
    }
    
    function getFilteredData() {
        const filterGroup = document.getElementById('filterGroup').value;
        const filterSupplier = document.getElementById('filterSupplier').value;
        const priceMin = parseFloat(document.getElementById('priceMin').value);
        const priceMax = parseFloat(document.getElementById('priceMax').value);
        const searchText = document.getElementById('searchText').value.toLowerCase();
        
        let filtered = [];
        
        for (let row of allData) {
            const group = row[0] ? row[0].toString().trim() : '';
            const name = row[1] ? row[1].toString().trim() : '';
            const supplier = row[2] ? row[2].toString().trim() : '';
            const unit = row[3] || '';
            let pricePerUnitRaw = row[4];
            let totalRaw = row[5];
            const size = row[6] ? row[6].toString().trim() : '';
            const site = row[7] || '';
            
            // Форматирование цены до 2 знаков
            let pricePerUnitFormatted = '';
            if (pricePerUnitRaw && String(pricePerUnitRaw).trim() !== '') {
                let priceStr = String(pricePerUnitRaw).replace(/[^\d,.-]/g, '').replace(',', '.');
                let priceNum = parseFloat(priceStr);
                if (!isNaN(priceNum)) {
                    pricePerUnitFormatted = priceNum.toFixed(2).replace('.', ',') + ' ₽';
                } else {
                    pricePerUnitFormatted = pricePerUnitRaw;
                }
            } else {
                pricePerUnitFormatted = '—';
            }
            
            let totalNum = 0;
            let hasPrice = false;
            if (totalRaw && String(totalRaw).trim() !== '') {
                let priceStr = String(totalRaw).replace(/[^\d,.-]/g, '').replace(',', '.');
                let parsed = parseFloat(priceStr);
                if (!isNaN(parsed)) {
                    totalNum = parsed;
                    hasPrice = true;
                }
            }
            
            if (filterGroup && group !== filterGroup) continue;
            if (filterSupplier && supplier !== filterSupplier) continue;
            if (!isNaN(priceMin) && totalNum < priceMin) continue;
            if (!isNaN(priceMax) && totalNum > priceMax) continue;
            if (searchText && !name.toLowerCase().includes(searchText)) continue;
            if (!group) continue;
            
            filtered.push({ group, name, supplier, unit, pricePerUnit: pricePerUnitFormatted, totalRaw, totalNum, hasPrice, size, site });
        }
        
        return filtered;
    }
    
    function applyQuickFilter(type) {
        resetAllFilters();
        if (type === 'expensive') document.getElementById('priceMin').value = '10000';
        if (type === 'noPrice') {
            document.getElementById('priceMin').value = '-1';
            document.getElementById('priceMax').value = '0';
        }
        renderTable();
    }
    
    function renderTable() {
        let filtered = getFilteredData();
        
        filtered.sort((a, b) => {
            if (currentSort.column === 'name') return currentSort.direction === 'asc' ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name);
            if (currentSort.column === 'group') return currentSort.direction === 'asc' ? a.group.localeCompare(b.group) : b.group.localeCompare(a.group);
            if (currentSort.column === 'supplier') return currentSort.direction === 'asc' ? a.supplier.localeCompare(b.supplier) : b.supplier.localeCompare(a.supplier);
            return currentSort.direction === 'asc' ? a.totalNum - b.totalNum : b.totalNum - a.totalNum;
        });
        
        const totalSum = filtered.reduce((s, i) => s + i.totalNum, 0);
        const uniqueGroups = new Set(filtered.map(i => i.group)).size;
        const withoutPrice = filtered.filter(i => !i.hasPrice).length;
        
        document.getElementById('statsContainer').innerHTML = `
            <div class="stat-card"><h3>Общая сумма</h3><div class="stat-value">${totalSum.toLocaleString('ru-RU')} ₽</div></div>
            <div class="stat-card"><h3>Всего позиций</h3><div class="stat-value">${filtered.length}</div></div>
            <div class="stat-card"><h3>Групп</h3><div class="stat-value">${uniqueGroups}</div></div>
            <div class="stat-card"><h3>Без цены</h3><div class="stat-value">${withoutPrice}</div></div>
        `;
        
        updateCharts(filtered);
        
        if (filtered.length === 0) {
            document.getElementById('tableContainer').innerHTML = '<div class="loading">Нет данных по выбранным фильтрам</div>';
            return;
        }
        
        let html = `<table><thead><tr><th onclick="sortTable('name')">Наименование</th><th onclick="sortTable('group')">Группа</th><th onclick="sortTable('supplier')">Поставщик</th><th>Размер</th><th>Ед.изм</th><th>Цена/ед</th><th onclick="sortTable('price')">Цена общая</th><th>Сайт</th></tr></thead><tbody>`;
        
        for (let item of filtered) {
            const priceDisplay = item.hasPrice ? `${item.totalNum.toLocaleString('ru-RU')} ₽` : `<span class="badge-missing">нет цены</span>`;
            const siteLink = (item.site && item.site.startsWith('http')) ? `<a href="${item.site}" target="_blank">открыть</a>` : '—';
            html += `<tr>
                <td style="max-width:280px;">${escapeHtml(item.name)}</td>
                <td>${escapeHtml(item.group)}</td>
                <td>${escapeHtml(item.supplier)}</td>
                <td>${escapeHtml(item.size)}</td>
                <td>${escapeHtml(item.unit)}</td>
                <td>${escapeHtml(item.pricePerUnit)}</td>
                <td class="price-cell">${priceDisplay}</td>
                <td>${siteLink}</td>
            </tr>`;
        }
        
        html += `<tr class="total-row"><td colspan="6" style="text-align:right;"><strong>ИТОГО:</strong></td><td class="price-cell"><strong>${totalSum.toLocaleString('ru-RU')} ₽</strong></td><td></td></tr>`;
        html += `</tbody>树`;
        
        document.getElementById('tableContainer').innerHTML = html;
    }
    
    function updateCharts(filtered) {
        const groupMap = new Map();
        for (let item of filtered) {
            if (!groupMap.has(item.group)) groupMap.set(item.group, { sum: 0, count: 0 });
            const stat = groupMap.get(item.group);
            stat.sum += item.totalNum;
            stat.count++;
        }
        const labels = Array.from(groupMap.keys());
        const sumData = labels.map(l => groupMap.get(l).sum);
        const countData = labels.map(l => groupMap.get(l).count);
        
        if (sumChart) sumChart.destroy();
        sumChart = new Chart(document.getElementById('sumChart'), {
            type: 'bar',
            data: { labels, datasets: [{ label: 'Сумма, руб', data: sumData, backgroundColor: '#2e7d32', borderRadius: 6 }] },
            options: { responsive: true, maintainAspectRatio: true }
        });
        
        if (countChart) countChart.destroy();
        countChart = new Chart(document.getElementById('countChart'), {
            type: 'pie',
            data: { labels, datasets: [{ data: countData, backgroundColor: ['#2e7d32','#1565c0','#e65100','#6a1b9a','#c62828','#00838f','#5d4037'] }] },
            options: { responsive: true, maintainAspectRatio: true }
        });
    }
    
    function sortTable(col) {
        if (currentSort.column === col) {
            currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
        } else {
            currentSort.column = col;
            currentSort.direction = 'desc';
        }
        renderTable();
    }
    
    function resetAllFilters() {
        document.getElementById('filterGroup').value = '';
        document.getElementById('filterSupplier').value = '';
        document.getElementById('priceMin').value = '';
        document.getElementById('priceMax').value = '';
        document.getElementById('searchText').value = '';
        updateSupplierFilter();
        renderTable();
    }
    
    function escapeHtml(str) {
        if (!str) return '—';
        return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
    }
    
    window.sortTable = sortTable;
    loadData();
</script>
</body>
</html>
