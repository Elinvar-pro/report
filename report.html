<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отчет по материалам</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 24px; background: #f0f2f5; }
        .container { max-width: 1600px; margin: 0 auto; }
        h1 { font-size: 1.8rem; font-weight: 600; margin: 0 0 4px 0; color: #1a5d2a; }
        .sub { color: #475569; font-size: 0.85rem; border-left: 3px solid #2e7d32; padding-left: 12px; margin: 8px 0 24px 0; }
        
        .filters-card { background: white; border-radius: 16px; padding: 20px 24px; margin-bottom: 24px; border: 1px solid #e2e8f0; }
        
        .filters-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            align-items: end;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .filter-group label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #5b6e8c;
            letter-spacing: 0.5px;
        }
        
        select, input {
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            font-size: 0.85rem;
            font-family: inherit;
            background: white;
            width: 100%;
        }
        
        .search-row {
            margin-top: 20px;
        }
        
        .reset-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }
        
        button {
            background: #2e7d32;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
        }
        button:hover { background: #1b5e20; }
        .btn-outline {
            background: white;
            border: 1px solid #2e7d32;
            color: #2e7d32;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 16px 20px;
            border: 1px solid #e9edf2;
        }
        .stat-card h3 {
            font-size: 0.7rem;
            font-weight: 600;
            color: #5b6e8c;
            margin: 0 0 8px 0;
            text-transform: uppercase;
        }
        .stat-value {
            font-size: 1.6rem;
            font-weight: 700;
            color: #1a5d2a;
        }
        
        .charts-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 24px;
            margin-bottom: 28px;
        }
        .chart-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #e9edf2;
        }
        canvas { max-height: 260px; width: 100%; }
        
        .table-wrapper {
            background: white;
            border-radius: 20px;
            border: 1px solid #e9edf2;
            overflow: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 800px;
        }
        th {
            text-align: left;
            padding: 14px 12px;
            background: #f8fafc;
            font-weight: 600;
            cursor: pointer;
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid #f0f2f5;
        }
        .price-cell {
            font-weight: 500;
            text-align: right;
        }
        .badge-missing {
            background: #ffebee;
            color: #c62828;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
        }
        .total-row td {
            background: #fef6e0;
            font-weight: 700;
        }
        .loading, .error-message {
            text-align: center;
            padding: 48px;
        }
        a { color: #2e7d32; text-decoration: none; }
        .search-hint { font-size: 0.7rem; color: #6c757d; margin-top: 4px; }
        
        @media (max-width: 900px) {
            .filters-row { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .filters-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📋 Сводка по материалам</h1>
    <div class="sub">📅 Данные из Google Таблицы | 🔄 Обновляется автоматически</div>

    <div class="filters-card">
        <div class="filters-row">
            <div class="filter-group">
                <label>📁 Группа</label>
                <select id="filterGroup"><option value="">Все группы</option></select>
            </div>
            <div class="filter-group">
                <label>🏭 Поставщик</label>
                <select id="filterSupplier"><option value="">Все поставщики</option></select>
            </div>
            <div class="filter-group">
                <label>💰 Цена от</label>
                <input type="number" id="priceMin" placeholder="0" step="1000">
            </div>
            <div class="filter-group">
                <label>💰 Цена до</label>
                <input type="number" id="priceMax" placeholder="Любая" step="1000">
            </div>
        </div>
        
        <div class="search-row">
            <div class="filter-group">
                <label>🔎 Умный поиск</label>
                <input type="text" id="searchText" placeholder="Поиск по наименованию, группе, поставщику, размеру...">
                <div class="search-hint">📌 Ищет одновременно в 4 полях</div>
            </div>
        </div>
        
        <div class="reset-row">
            <button id="resetAllBtn">⟳ Сбросить всё</button>
        </div>
    </div>

    <div class="stats-grid" id="statsContainer">
        <div class="stat-card"><h3>💰 Общая сумма</h3><div class="stat-value">—</div></div>
        <div class="stat-card"><h3>📦 Всего позиций</h3><div class="stat-value">—</div></div>
        <div class="stat-card"><h3>📁 Групп</h3><div class="stat-value">—</div></div>
        <div class="stat-card"><h3>⚠️ Без цены</h3><div class="stat-value">—</div></div>
    </div>

    <div class="charts-row">
        <div class="chart-card"><h3>📊 Сумма по группам</h3><canvas id="sumChart"></canvas></div>
        <div class="chart-card"><h3>🥧 Количество по группам</h3><canvas id="countChart"></canvas></div>
    </div>

    <div class="table-wrapper">
        <div id="tableContainer" class="loading">📡 Загрузка данных...</div>
    </div>
</div>

<script>
    // ⚠️ ВСТАВЬ СВОЙ ID ТАБЛИЦЫ ⚠️
    const SPREADSHEET_ID = "1OhoJYlXsYiJDdCF_ET7gkNKg21juUI5ENo-haz6wcR4";
    const SHEET_NAME = "Лист1";
    
    let allData = [];
    let allGroups = [];
    let allSuppliers = [];
    let currentSort = { column: 'price', direction: 'desc' };
    let sumChart = null, countChart = null;

    async function loadData() {
        const container = document.getElementById('tableContainer');
        container.innerHTML = '<div class="loading">📡 Загрузка данных...</div>';
        
        try {
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;
            const response = await fetch(url);
            const text = await response.text();
            
            // Парсим JSONP ответ
            const jsonStr = text.substring(47, text.length - 2);
            const json = JSON.parse(jsonStr);
            
            const rows = json.table.rows;
            const cols = json.table.cols;
            
            // Очищаем старые данные
            allData = [];
            
            // Проходим по всем строкам
            for (let i = 0; i < rows.length; i++) {
                const row = rows[i].c;
                const rowData = [];
                for (let j = 0; j < row.length; j++) {
                    // Получаем значение, если оно есть
                    let value = '';
                    if (row[j] && row[j].v !== null && row[j].v !== undefined) {
                        value = row[j].v;
                    }
                    rowData.push(value);
                }
                // Добавляем только если есть хоть какие-то данные
                if (rowData.length > 0 && rowData.some(cell => cell !== '' && cell !== null && cell !== undefined)) {
                    allData.push(rowData);
                }
            }
            
            console.log("Загружено строк (сырых):", allData.length);
            console.log("Первые 3 строки:", allData.slice(0, 3));
            
            if (!allData.length) {
                container.innerHTML = '<div class="loading">📭 Нет данных в таблице</div>';
                return;
            }
            
            // Собираем группы и поставщиков
            const groupsSet = new Set();
            const suppliersSet = new Set();
            for (let row of allData) {
                const group = row[0] ? String(row[0]).trim() : '';
                const supplier = row[2] ? String(row[2]).trim() : '';
                if (group && group !== '') groupsSet.add(group);
                if (supplier && supplier !== '') suppliersSet.add(supplier);
            }
            allGroups = Array.from(groupsSet).sort();
            allSuppliers = Array.from(suppliersSet).sort();
            
            console.log("Найдено групп:", allGroups.length);
            console.log("Найдено поставщиков:", allSuppliers.length);
            
            const groupSelect = document.getElementById('filterGroup');
            groupSelect.innerHTML = '<option value="">📁 Все группы</option>';
            allGroups.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g;
                opt.textContent = g;
                groupSelect.appendChild(opt);
            });
            
            const supplierSelect = document.getElementById('filterSupplier');
            supplierSelect.innerHTML = '<option value="">🏭 Все поставщики</option>';
            allSuppliers.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                supplierSelect.appendChild(opt);
            });
            
            document.getElementById('filterGroup').addEventListener('change', () => {
                updateSupplierFilter();
                renderTable();
            });
            document.getElementById('filterSupplier').addEventListener('change', () => renderTable());
            document.getElementById('priceMin').addEventListener('input', () => renderTable());
            document.getElementById('priceMax').addEventListener('input', () => renderTable());
            document.getElementById('searchText').addEventListener('input', () => renderTable());
            document.getElementById('resetAllBtn').addEventListener('click', resetAllFilters);
            
            updateSupplierFilter();
            renderTable();
            
        } catch (error) {
            console.error('Ошибка:', error);
            container.innerHTML = `<div class="error-message">❌ Ошибка загрузки данных: ${error.message}<br><br>
                1. Таблица опубликована (Файл → Предоставить доступ → "Все, у кого есть ссылка")<br>
                2. ID таблицы правильный<br>
                3. Название листа "${SHEET_NAME}"</div>`;
        }
    }
    
    function updateSupplierFilter() {
        const selectedGroup = document.getElementById('filterGroup').value;
        const supplierSelect = document.getElementById('filterSupplier');
        const currentSupplier = supplierSelect.value;
        
        let availableSuppliers;
        if (selectedGroup && selectedGroup !== "📁 Все группы") {
            const suppliersInGroup = new Set();
            for (let row of allData) {
                const group = row[0] ? String(row[0]).trim() : '';
                const supplier = row[2] ? String(row[2]).trim() : '';
                if (group === selectedGroup && supplier) suppliersInGroup.add(supplier);
            }
            availableSuppliers = Array.from(suppliersInGroup).sort();
        } else {
            availableSuppliers = [...allSuppliers];
        }
        
        supplierSelect.innerHTML = '<option value="">🏭 Все поставщики</option>';
        availableSuppliers.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s;
            opt.textContent = s;
            supplierSelect.appendChild(opt);
        });
        
        if (currentSupplier && availableSuppliers.includes(currentSupplier)) {
            supplierSelect.value = currentSupplier;
        } else {
            supplierSelect.value = "";
        }
    }
    
    function parsePrice(value) {
        if (!value || value === '') return 0;
        if (typeof value === 'number') return value;
        const str = String(value).trim();
        if (str === '') return 0;
        const num = parseFloat(str.replace(/[^\d,.-]/g, '').replace(',', '.'));
        return isNaN(num) ? 0 : num;
    }
    
    function getFilteredData() {
        const filterGroup = document.getElementById('filterGroup').value;
        const filterSupplier = document.getElementById('filterSupplier').value;
        const priceMin = parseFloat(document.getElementById('priceMin').value);
        const priceMax = parseFloat(document.getElementById('priceMax').value);
        const searchText = document.getElementById('searchText').value.toLowerCase().trim();
        
        let filtered = [];
        
        for (let row of allData) {
            const group = row[0] ? String(row[0]).trim() : '';
            const name = row[1] ? String(row[1]).trim() : '';
            const supplier = row[2] ? String(row[2]).trim() : '';
            const unit = row[3] || '';
            let pricePerUnitRaw = row[4];
            let totalRaw = row[5];
            const size = row[6] ? String(row[6]).trim() : '';
            const site = row[7] || '';
            
            // Форматирование цены за единицу
            let pricePerUnitFormatted = '';
            const pricePerUnitNum = parsePrice(pricePerUnitRaw);
            if (pricePerUnitNum > 0) {
                pricePerUnitFormatted = pricePerUnitNum.toFixed(2).replace('.', ',') + ' ₽';
            } else {
                pricePerUnitFormatted = pricePerUnitRaw ? String(pricePerUnitRaw) : '—';
            }
            
            // Парсим общую цену
            let totalNum = parsePrice(totalRaw);
            let hasPrice = totalNum > 0;
            
            // Пропускаем пустые строки
            if (!group || group === '') continue;
            
            // Фильтры
            if (filterGroup && filterGroup !== "📁 Все группы" && group !== filterGroup) continue;
            if (filterSupplier && filterSupplier !== "🏭 Все поставщики" && supplier !== filterSupplier) continue;
            if (!isNaN(priceMin) && totalNum < priceMin) continue;
            if (!isNaN(priceMax) && totalNum > priceMax) continue;
            
            // Умный поиск
            if (searchText) {
                const searchable = `${name} ${group} ${supplier} ${size}`.toLowerCase();
                if (!searchable.includes(searchText)) continue;
            }
            
            filtered.push({ 
                group, name, supplier, unit, 
                pricePerUnit: pricePerUnitFormatted, 
                totalNum, hasPrice, size, site 
            });
        }
        
        return filtered;
    }
    
    function renderTable() {
        let filtered = getFilteredData();
        
        // Сортировка
        filtered.sort((a, b) => {
            if (currentSort.column === 'name') return currentSort.direction === 'asc' ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name);
            if (currentSort.column === 'group') return currentSort.direction === 'asc' ? a.group.localeCompare(b.group) : b.group.localeCompare(a.group);
            if (currentSort.column === 'supplier') return currentSort.direction === 'asc' ? a.supplier.localeCompare(b.supplier) : b.supplier.localeCompare(a.supplier);
            return currentSort.direction === 'asc' ? a.totalNum - b.totalNum : b.totalNum - a.totalNum;
        });
        
        const totalSum = filtered.reduce((s, i) => s + i.totalNum, 0);
        const uniqueGroups = new Set(filtered.map(i => i.group)).size;
        const withoutPrice = filtered.filter(i => !i.hasPrice).length;
        
        document.getElementById('statsContainer').innerHTML = `
            <div class="stat-card"><h3>💰 Общая сумма</h3><div class="stat-value">${totalSum.toLocaleString('ru-RU')} ₽</div></div>
            <div class="stat-card"><h3>📦 Всего позиций</h3><div class="stat-value">${filtered.length}</div></div>
            <div class="stat-card"><h3>📁 Групп</h3><div class="stat-value">${uniqueGroups}</div></div>
            <div class="stat-card"><h3>⚠️ Без цены</h3><div class="stat-value">${withoutPrice}</div></div>
        `;
        
        updateCharts(filtered);
        
        if (filtered.length === 0) {
            document.getElementById('tableContainer').innerHTML = '<div class="loading">🔍 Нет данных по выбранным фильтрам</div>';
            return;
        }
        
        let html = '<table><thead><tr>';
        html += '<th onclick="sortTable(\'name\')">📦 Наименование</th>';
        html += '<th onclick="sortTable(\'group\')">📁 Группа</th>';
        html += '<th onclick="sortTable(\'supplier\')">🏭 Поставщик</th>';
        html += '<th>📏 Размер</th>';
        html += '<th>📐 Ед.изм</th>';
        html += '<th>💵 Цена/ед</th>';
        html += '<th onclick="sortTable(\'price\')">💰 Цена общая</th>';
        html += '<th>🔗 Сайт</th>';
        html += '</tr></thead><tbody>';
        
        for (let item of filtered) {
            const priceDisplay = item.hasPrice ? `${item.totalNum.toLocaleString('ru-RU')} ₽` : `<span class="badge-missing">⚠️ нет цены</span>`;
            const siteLink = (item.site && item.site.startsWith('http')) ? `<a href="${item.site}" target="_blank">🔗 открыть</a>` : '—';
            html += `<tr>
                <td style="max-width:280px;">${escapeHtml(item.name)}</td>
                <td>${escapeHtml(item.group)}</td>
                <td>${escapeHtml(item.supplier)}</td>
                <td>${escapeHtml(item.size)}</td>
                <td>${escapeHtml(item.unit)}</td>
                <td>${escapeHtml(item.pricePerUnit)}</td>
                <td class="price-cell">${priceDisplay}</td>
                <td>${siteLink}</td>
            </tr>`;
        }
        
        html += `<tr class="total-row"><td colspan="6" style="text-align:right;"><strong>ИТОГО:</strong></td><td class="price-cell"><strong>${totalSum.toLocaleString('ru-RU')} ₽</strong></td><td class="price-cell">—</td></tr>`;
        html += `</tbody>树`;
        
        document.getElementById('tableContainer').innerHTML = html;
    }
    
    function updateCharts(filtered) {
        const groupMap = new Map();
        for (let item of filtered) {
            if (!groupMap.has(item.group)) groupMap.set(item.group, { sum: 0, count: 0 });
            const stat = groupMap.get(item.group);
            stat.sum += item.totalNum;
            stat.count++;
        }
        const labels = Array.from(groupMap.keys());
        const sumData = labels.map(l => groupMap.get(l).sum);
        const countData = labels.map(l => groupMap.get(l).count);
        
        if (sumChart) sumChart.destroy();
        if (labels.length > 0) {
            sumChart = new Chart(document.getElementById('sumChart'), {
                type: 'bar',
                data: { labels, datasets: [{ label: 'Сумма, руб', data: sumData, backgroundColor: '#2e7d32', borderRadius: 6 }] },
                options: { responsive: true, maintainAspectRatio: true }
            });
            
            countChart = new Chart(document.getElementById('countChart'), {
                type: 'pie',
                data: { labels, datasets: [{ data: countData, backgroundColor: ['#2e7d32','#1565c0','#e65100','#6a1b9a','#c62828','#00838f','#5d4037'] }] },
                options: { responsive: true, maintainAspectRatio: true }
            });
        }
    }
    
    function sortTable(col) {
        if (currentSort.column === col) {
            currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
        } else {
            currentSort.column = col;
            currentSort.direction = 'desc';
        }
        renderTable();
    }
    
    function resetAllFilters() {
        document.getElementById('filterGroup').value = "📁 Все группы";
        document.getElementById('filterSupplier').value = "🏭 Все поставщики";
        document.getElementById('priceMin').value = '';
        document.getElementById('priceMax').value = '';
        document.getElementById('searchText').value = '';
        updateSupplierFilter();
        renderTable();
    }
    
    function escapeHtml(str) {
        if (!str) return '—';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    window.sortTable = sortTable;
    loadData();
</script>
</body>
</html>
